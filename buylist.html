<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sell Your Collection</title><meta name="description" content="Submit a list of items you want to sell. A staff member will review it and reach out with an offer."><style>
:root{--bg:#f5f7fa;--card:#fff;--text:#111827;--muted:#64748b;--line:#dce3ea;--accent:#087f5b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{background:#07110f;color:#fff;padding:28px 20px}
.head{max-width:760px;margin:auto;display:flex;gap:16px;align-items:center}
.logo{width:56px;height:56px;object-fit:contain;border-radius:12px;background:#fff}
.head h1{margin:0;font-size:clamp(22px,5vw,32px)}
.head p{margin:5px 0 0;color:#b8c7c2;font-size:14px}
.wrap{max-width:760px;margin:auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px rgba(15,23,42,.05)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit}
.field textarea{min-height:70px;resize:vertical}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item-row{border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;position:relative}
.item-row .rm{position:absolute;top:8px;right:8px;background:none;border:0;color:#b91c1c;font-size:18px;cursor:pointer;padding:4px 8px}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:10px 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:800;text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.secondary{background:#e8edf2;color:#263445}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.error-box{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
.error-box.on{display:block}
.confirm-box{text-align:center;padding:40px 20px}
.confirm-box h2{color:var(--accent)}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
@media(max-width:600px){.two-col{grid-template-columns:1fr}}
</style></head><body><header><div class="head"><img id="logo" class="logo" hidden><div><h1 id="store-name">Sell Your Collection</h1><p id="store-message">Loading…</p></div></div></header>
<main class="wrap" id="main">
  <div class="card">
    <div class="field"><label>Your Name *</label><input id="contact-name" placeholder="Full name"></div>
    <div class="two-col">
      <div class="field"><label>Email</label><input id="contact-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Phone</label><input id="contact-phone" type="tel" placeholder="(555) 555-5555" oninput="updateSmsConsentVisibility()"></div>
    </div>
    <div style="font-size:11px;color:var(--muted);margin-top:-6px;margin-bottom:12px">At least one of email or phone is required so we can reach you.</div>
    <label id="sms-consent-row" style="display:none;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);margin-bottom:4px"><input id="sms-consent" type="checkbox" style="margin-top:3px"> I agree to receive text messages from The Mana Pocket about this submission. Message frequency depends on submission activity. Msg &amp; data rates may apply. Reply HELP for help, STOP to opt out. See our <a href="https://themanapocket.com/privacy-policy" target="_blank">Privacy Policy</a> and <a href="https://themanapocket.com/terms-and-conditions" target="_blank">Terms</a>.</label>
  </div>

  <div class="card">
    <div style="font-weight:800;margin-bottom:10px">What do you want to sell?</div>
    <div id="items-list"></div>
    <button class="btn secondary" onclick="addBuylistItemRow()">+ ADD ANOTHER ITEM</button>
  </div>

  <div class="card">
    <div class="field"><label>Anything else we should know?</label><textarea id="submission-notes" placeholder="How you'd like to be contacted, when you're available to bring items in, etc."></textarea></div>
  </div>

  <div id="submit-error" class="error-box"></div>
  <div class="btn-row"><button class="btn" id="submit-btn" onclick="submitBuylist()">SUBMIT FOR REVIEW</button></div>
</main>

<script>
const WORKER='https://still-resonance-4f87.swarnerauto.workers.dev';
let currentStoreId='';
let itemRowCount=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function addBuylistItemRow(){
  itemRowCount++;
  const id='item-row-'+itemRowCount;
  const wrap=document.createElement('div');
  wrap.className='item-row';
  wrap.id=id;
  wrap.innerHTML=`<button type="button" class="rm" onclick="document.getElementById('${id}').remove()">✕</button>
    <div class="field"><label>Item Description *</label><input class="bl-desc" placeholder="e.g. 2019 Panini Prizm box, sealed"></div>
    <div class="two-col">
      <div class="field"><label>Category</label><select class="bl-category"><option value="">Not sure</option><option>Sports Card</option><option>Pokemon TCG</option><option>Magic: The Gathering</option><option>Comic</option><option>Sealed</option><option>Other</option></select></div>
      <div class="field"><label>Condition</label><input class="bl-condition" placeholder="e.g. Near mint, sealed, played"></div>
    </div>
    <div class="field"><label>Your estimated value (optional)</label><input class="bl-value" type="number" min="0" step="0.01" placeholder="0.00"></div>`;
  document.getElementById('items-list').appendChild(wrap);
}

function updateSmsConsentVisibility(){
  const row=document.getElementById('sms-consent-row');
  const hasPhone=document.getElementById('contact-phone').value.trim().length>0;
  row.style.display=hasPhone?'flex':'none';
  if(!hasPhone) document.getElementById('sms-consent').checked=false;
}

function collectBuylistItems(){
  return Array.from(document.querySelectorAll('.item-row')).map(row => ({
    description: row.querySelector('.bl-desc').value.trim(),
    category: row.querySelector('.bl-category').value,
    condition: row.querySelector('.bl-condition').value.trim(),
    estimatedValue: parseFloat(row.querySelector('.bl-value').value) || 0,
  })).filter(it => it.description);
}

async function submitBuylist(){
  const errEl=document.getElementById('submit-error');
  errEl.classList.remove('on'); errEl.textContent='';
  const contactName=document.getElementById('contact-name').value.trim();
  const contactEmail=document.getElementById('contact-email').value.trim();
  const contactPhone=document.getElementById('contact-phone').value.trim();
  const notes=document.getElementById('submission-notes').value.trim();
  const items=collectBuylistItems();
  if(!contactName){ errEl.textContent='Enter your name'; errEl.classList.add('on'); return; }
  if(!contactEmail && !contactPhone){ errEl.textContent='Enter an email or phone number'; errEl.classList.add('on'); return; }
  if(!items.length){ errEl.textContent='Add at least one item you want to sell'; errEl.classList.add('on'); return; }
  const btn=document.getElementById('submit-btn');
  btn.disabled=true; btn.textContent='SUBMITTING…';
  try{
    const res=await fetch(`${WORKER}/public/buylist/submit`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({storeId:currentStoreId,contactName,contactEmail,contactPhone,notes,items})});
    const data=await res.json();
    if(!res.ok || !data.ok) throw new Error(data.error||'Could not submit -- please try again');
    document.getElementById('main').innerHTML=`<div class="card confirm-box"><h2>✓ Submitted</h2><p>Thanks, ${esc(contactName)} -- we received your list of ${items.length} item${items.length===1?'':'s'} and will reach out soon.</p></div>`;
  }catch(e){
    errEl.textContent=e.message; errEl.classList.add('on');
    btn.disabled=false; btn.textContent='SUBMIT FOR REVIEW';
  }
}

async function start(){
  const store=new URLSearchParams(location.search).get('store');
  if(!store){ document.getElementById('main').innerHTML='<div class="empty">Missing store link.</div>'; return; }
  currentStoreId=store;
  try{
    const r=await fetch(`${WORKER}/public/buylist/info?store_id=${encodeURIComponent(store)}&_=${Date.now()}`,{cache:'no-store'});
    const d=await r.json();
    if(!r.ok || !d.ok) throw new Error(d.error||'Not accepting submissions right now');
    document.title=`Sell to ${d.store.name}`;
    document.getElementById('store-name').textContent='Sell to '+d.store.name;
    document.getElementById('store-message').textContent=d.store.message||'Tell us what you have -- we\'ll review it and reach out with an offer.';
    if(d.store.logo){ const logo=document.getElementById('logo'); logo.onerror=()=>{logo.hidden=true}; logo.src=d.store.logo; logo.hidden=false; }
    addBuylistItemRow();
  }catch(e){
    document.getElementById('main').innerHTML=`<div class="empty">${esc(e.message)}</div>`;
  }
}
start();
</script>
</body></html>
