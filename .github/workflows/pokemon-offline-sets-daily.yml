name: Build Daily Pokemon Offline Sets

on:
  push:
    branches: [main]
    paths:
      - scripts/pokemon/**
      - .github/workflows/pokemon-offline-sets-daily.yml
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

concurrency:
  group: pokemon-offline-sets-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POKEMONPRICE_API_KEY: ${{ secrets.POKEMONPRICE_API_KEY }}
      POKEMON_R2_BUCKET: arsca-offline-catalogs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "${POKEMONPRICE_API_KEY:-}" || { echo "::error::POKEMONPRICE_API_KEY is missing. Add the same PokemonPriceTracker key used by the Worker as a GitHub Actions secret."; exit 1; }

      - name: Build Pokemon sets bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(date -u +%F)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm run pokemon:build -- --version="$VERSION" --upload

      - name: Verify production manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 3 \
            "https://still-resonance-4f87.swarnerauto.workers.dev/catalog/pokemon/manifest" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.status!=='ready'||m.version!==process.env.VERSION)process.exit(1)})"
