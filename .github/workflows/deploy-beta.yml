name: Deploy isolated beta

on:
  push:
    branches: [beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: beta
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BETA_WORKER_URL: https://walkoff-beta.swarnerauto.workers.dev
      BETA_SUPABASE_URL: ${{ secrets.BETA_SUPABASE_URL }}
      BETA_SUPABASE_ANON_KEY: ${{ secrets.BETA_SUPABASE_ANON_KEY }}
      BETA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BETA_SUPABASE_SERVICE_ROLE_KEY }}
      POKEMONPRICE_API_KEY: ${{ secrets.POKEMONPRICE_API_KEY }}
      PRICECHARTING_TOKEN: ${{ secrets.PRICECHARTING_TOKEN }}
      COMICVINE_API_KEY: ${{ secrets.COMICVINE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate isolated beta configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETA_SUPABASE_URL BETA_SUPABASE_ANON_KEY BETA_SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is missing from the protected beta environment"; exit 1; fi
          done
          if [[ "$BETA_SUPABASE_URL" == *"vroknjrxubsqyexngwus"* ]]; then
            echo "::error::Beta may not use the production Supabase project"; exit 1
          fi

      - name: Install Wrangler
        run: npm install --no-save wrangler@latest

      - name: Build isolated beta site
        run: node scripts/build-beta-site.mjs

      - name: Configure beta Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const names = ['BETA_SUPABASE_URL','BETA_SUPABASE_SERVICE_ROLE_KEY','POKEMONPRICE_API_KEY','PRICECHARTING_TOKEN','COMICVINE_API_KEY'];
          const map = { BETA_SUPABASE_URL:'SUPABASE_URL', BETA_SUPABASE_SERVICE_ROLE_KEY:'SUPABASE_SERVICE_ROLE_KEY' };
          const values = {};
          for (const name of names) if (process.env[name]) values[map[name] || name] = process.env[name];
          fs.writeFileSync('/tmp/beta-secrets.json', JSON.stringify(values));
          NODE
          npx wrangler secret bulk /tmp/beta-secrets.json --config wrangler.beta.jsonc

      - name: Deploy beta Worker and static site
        run: npx wrangler deploy --config wrangler.beta.jsonc --keep-vars

      - name: Export Topps reference data for manual beta publication
        if: github.event_name == 'workflow_dispatch'
        env:
          SUPABASE_URL: https://vroknjrxubsqyexngwus.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_wbpX2nL8l-4NbXtZNG_bjA_nabSYaJ5
        run: npm run topps:export:supabase

      - name: Build and publish Topps offline beta catalog
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          version="$(date -u +%Y-%m-%d).${GITHUB_RUN_NUMBER}"
          node --max-old-space-size=4096 scripts/topps/build-offline-bundle.mjs --version="$version" --out=data/topps/offline-build
          base="data/topps/offline-build/topps/$version"
          npx wrangler r2 object put "arsca-offline-catalogs-beta/topps/$version/cards.jsonl.gz" --file "$base/cards.jsonl.gz" --remote
          npx wrangler r2 object put "arsca-offline-catalogs-beta/topps/$version/sets.jsonl.gz" --file "$base/sets.jsonl.gz" --remote
          npx wrangler r2 object put "arsca-offline-catalogs-beta/topps/manifest.json" --file data/topps/offline-build/topps/manifest.json --remote
