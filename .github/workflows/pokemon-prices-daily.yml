name: Build Daily Pokemon Prices Bundle

on:
  push:
    branches: [main]
    paths:
      - scripts/pokemon/build-pokemon-prices-bundle.mjs
      - .github/workflows/pokemon-prices-daily.yml
  schedule:
    # PPT's export DOWNLOAD quota (2/day) resets at UTC midnight, but the dump
    # itself isn't regenerated until 6:00 AM UTC -- a client hitting the live
    # export route anytime in that 6-10:50 window used to have a real shot at
    # burning both of the day's slots before this cron got to them (confirmed:
    # 3 of the last 7 scheduled runs failed with exactly that 429). Running at
    # 6:10 gives the dump 10 minutes to regenerate and shrinks that exposure
    # window to almost nothing.
    - cron: '10 6 * * *'
  workflow_dispatch:

concurrency:
  group: pokemon-prices-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POKEMONPRICE_API_KEY: ${{ secrets.POKEMONPRICE_API_KEY }}
      POKEMON_R2_BUCKET: arsca-offline-catalogs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          test -n "${POKEMONPRICE_API_KEY:-}" || { echo "::error::POKEMONPRICE_API_KEY is missing. Add the same PokemonPriceTracker key used by the Worker as a GitHub Actions secret."; exit 1; }

      - name: Build Pokemon cards+sealed price bundle
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(date -u +%F)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm run pokemon:prices:build -- --version="$VERSION" --upload

      - name: Validate generated bundle
        shell: bash
        run: |
          set -euo pipefail
          gzip -t "data/pokemon-prices/build/pokemon/prices/cards.jsonl.gz"
          gzip -t "data/pokemon-prices/build/pokemon/prices/sealed.jsonl.gz"
          node -e "const m=require('./data/pokemon-prices/build/pokemon/prices-manifest.json'); if(m.status!=='ready'||m.version!==process.env.VERSION) process.exit(1)"

      - name: Verify production manifest
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 5 --retry-delay 3 \
            "https://still-resonance-4f87.swarnerauto.workers.dev/catalog/pokemon/prices/manifest" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.status!=='ready'||m.version!==process.env.VERSION)process.exit(1)})"
