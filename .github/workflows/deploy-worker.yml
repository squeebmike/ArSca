jobs:
  deploy-worker:
    name: Validate, deploy, and probe Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: https://still-resonance-4f87.swarnerauto.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate required GitHub secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error title=Missing GitHub secret::CLOUDFLARE_API_TOKEN is undefined. Add it in repo Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error title=Missing GitHub secret::CLOUDFLARE_ACCOUNT_ID is undefined. Add it in repo Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Cloudflare secrets are present."

      - name: Install dependencies
        run: npm ci

      - name: Parse check, non-blocking for Worker deploy
        continue-on-error: true
        run: npm run test:parse

      - name: Verify SEO discovery
        # dashboard.html's app code is in scripts/dashboard-app.js; this
        # preload puts it back inline for tests that read dashboard.html.
        run: node --import=./tests/helpers/dashboard-source-hook.mjs --test tests/seo-discovery-regressions.test.mjs tests/foc-preorder-share-page.test.mjs tests/backlist-catalog.test.mjs tests/comic-new-releases.test.mjs tests/bcw-storefront.test.mjs tests/item-seo-pages.test.mjs

      - name: Verify automatic book alerts
        run: node --import=./tests/helpers/cloudflare-modules-hook.mjs --test tests/article-marketplace.test.mjs tests/book-alerts.test.mjs tests/book-alert-management.test.mjs tests/comic-articles.test.mjs tests/pocket-guides.test.mjs tests/social-links-page.test.mjs tests/store-shopping-improvements.test.mjs tests/department-pages.test.mjs tests/product-shopping.test.mjs

      - name: Verify unified comic search
        run: node --import=./tests/helpers/cloudflare-modules-hook.mjs --test tests/comic-search.test.mjs tests/preorder-mobile-rollout.test.mjs

      - name: Verify baseball checklist discovery
        run: node --import=./tests/helpers/cloudflare-modules-hook.mjs --test tests/sports-card-finder.test.mjs tests/sports-card-number-search.test.mjs tests/collector-page-ui.test.mjs tests/public-baseball-checklist-policy.test.mjs tests/baseball-catalog-pages.test.mjs tests/football-catalog-pages.test.mjs tests/secret-lair-pages.test.mjs tests/baseball-team-pages.test.mjs tests/baseball-player-pages.test.mjs tests/catalog-highlights.test.mjs tests/collection-tools.test.mjs tests/baseball-odds.test.mjs tests/catalog-availability.test.mjs tests/reference-set-cache.test.mjs

      - name: Smoke tests are manual only
        run: |
          echo "::notice title=Smoke tests skipped::Playwright smoke tests are available through npm run test:smoke:manual and are not a deploy gate."

      - name: Validate Wrangler config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('wrangler.deploy.jsonc', 'utf8').replace(/\/\/.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '');
          const config = JSON.parse(raw);
          const required = [];
          if (!config.name) required.push('name');
          if (config.name !== 'still-resonance-4f87') throw new Error(`Worker name mismatch: ${config.name}`);
          if (!config.main) required.push('main');
          if (!config.compatibility_date) required.push('compatibility_date');
          if (!Array.isArray(config.kv_namespaces) || !config.kv_namespaces.length) required.push('kv_namespaces');
          if (required.length) throw new Error('Missing required wrangler fields: ' + required.join(', '));
          const kv = config.kv_namespaces.find(k => k.binding === 'LBA_KV');
          if (!kv) throw new Error('Missing LBA_KV namespace binding');
          if (!kv.id || /placeholder|changeme|todo/i.test(kv.id)) throw new Error('LBA_KV namespace id is missing or placeholder');
          const r2 = (config.r2_buckets || []).find(binding => binding.binding === 'MTG_CATALOG_R2');
          if (!r2?.bucket_name) throw new Error('Missing MTG_CATALOG_R2 bucket binding');
          if (config.account_id && config.account_id !== process.env.CLOUDFLARE_ACCOUNT_ID) {
            throw new Error('wrangler account_id does not match CLOUDFLARE_ACCOUNT_ID secret');
          }
          if (!config.account_id) {
            console.log('wrangler account_id is intentionally omitted; Wrangler will use CLOUDFLARE_ACCOUNT_ID from the GitHub Actions environment.');
          }
          console.log(JSON.stringify({
            workerName: config.name,
            main: config.main,
            compatibilityDate: config.compatibility_date,
            kvBindings: config.kv_namespaces.map(k => ({ binding: k.binding, id: k.id })),
            r2Bindings: config.r2_buckets.map(binding => ({ binding: binding.binding, bucket: binding.bucket_name })),
          }, null, 2));
          NODE
          npx --yes wrangler@4.145.0 deploy --config wrangler.deploy.jsonc --dry-run

      - name: Validate Wrangler authentication
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.145.0 whoami

      - name: Ensure MTG R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          buckets="$(npx --yes wrangler@4.145.0 r2 bucket list --config wrangler.deploy.jsonc)"
          if grep -Fq "arsca-offline-catalogs" <<< "$buckets"; then
            echo "MTG R2 bucket already exists."
          else
            npx --yes wrangler@4.145.0 r2 bucket create arsca-offline-catalogs --config wrangler.deploy.jsonc
          fi

      - name: Deploy Worker
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.145.0 deploy --config wrangler.deploy.jsonc --keep-vars
          echo "Deployed Worker URL: ${WORKER_URL}"

      - name: Validate live endpoints
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const workerUrl = process.env.WORKER_URL;
          async function request(label, path, options = {}, accept = r => r.ok) {
            const res = await fetch(workerUrl + path, options);
            const text = await res.text();
            let body;
            try { body = JSON.parse(text); } catch { body = { raw: text.slice(0, 300) }; }
            const ok = accept(res, body);
            const item = { label, path, status: res.status, ok, body };
            console.log(JSON.stringify(item));
            if (!ok) throw new Error(`${label} failed with HTTP ${res.status}: ${text.slice(0, 300)}`);
            return item;
          }

          const probeKey = 'deploy_probe_' + Date.now();
          // The health check runs seconds after a fresh deploy, which can
          // occasionally race Cloudflare's edge propagation (especially
          // right after routes/workers_dev topology changes) and see a
          // stale response for a moment. Retry before treating it as real.
          for (let attempt = 1; ; attempt++) {
            try {
              await request('health', '/health');
              break;
            } catch (err) {
              if (attempt >= 4) throw err;
              console.log(`health check attempt ${attempt} failed, retrying in 5s: ${err.message}`);
              await new Promise(r => setTimeout(r, 5000));
            }
          }
          await request('anonymous kv write rejected', '/kv/' + probeKey, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ok: true, probeKey, at: new Date().toISOString() }),
          }, res => res.status === 401 || res.status === 403);
          await request('anonymous kv read rejected', '/kv/' + probeKey, {}, res => res.status === 401 || res.status === 403);
          // Paid price lookups now require staff login. These anonymous
          // probes must verify that protection, without spending API keys.
          await request('anonymous PriceCharting CSV status rejected', '/pricing/pricecharting/csv/status', {}, res => res.status === 401 || res.status === 403);
          await request('PriceCharting CSV test route', '/pricing/pricecharting/csv/test-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ categoryKey: 'pokemon-cards' }),
          }, res => res.status === 401 || res.status === 403);
          await request('PriceCharting CSV sync route', '/pricing/pricecharting/csv/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ categoryKey: 'deploy-probe-' + Date.now() }),
          }, res => res.status === 401 || res.status === 403);
          await request('offline cache manifest', '/offline/cache/manifest');
          await request('MTG R2 manifest', '/catalog/mtg/manifest', {}, res => res.ok || res.status === 404);
          await request('MTG R2 file validation', '/catalog/mtg/download?file=invalid', {}, res => res.status === 400);
          await request('Topps R2 manifest', '/catalog/topps/manifest', {}, res => res.ok || res.status === 404);
          await request('Topps R2 file validation', '/catalog/topps/download?file=invalid', {}, res => res.status === 400);
          await request('PokemonPriceTracker cards route', '/pricing/pokemonpricetracker/cards?search=charizard&language=english&limit=1', {}, res => res.status !== 404);
          // These paths are zone-routed to themanapocket.com in
          // wrangler.deploy.jsonc, but workers_dev:true exposes every route
          // this Worker's fetch() handles on *.workers.dev too, so checking
          // them here (against real internet access, unlike this
          // repository's own sandboxed dev environment) is real proof they
          // actually render, not just that the code parses.
          await request('MTG Academy page', '/mtg-rules', {}, res => res.ok);
          await request('MTG Rules Boss page', '/mtg-judge', {}, res => res.ok);
          await request('anonymous MTG AI question rejected', '/mtg-judge/ask', {method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}, res => res.status === 401);
          await request('FAQ page', '/faq', {}, res => res.ok);
          await request('News page', '/news', {}, res => res.ok);
          await request('Category index page', '/category', {}, res => res.ok);
          await request('Comics category page', '/category/comics', {}, res => res.ok);
          await request('Unknown category 404s', '/category/not-a-real-category', {}, res => res.status === 404);
          await request('Pages sitemap', '/sitemap-pages.xml', {}, res => res.ok);
          // /books' default (no ?q= typed) state depends on this returning a
          // real, non-empty shelves payload -- it silently swallows any
          // failure client-side (see backlist.js's loadShelves()), so a
          // regression here shows up to customers as "nothing loads until I
          // hit Search" with no error anywhere, and previously had no CI
          // coverage at all.
          await request('Backlist shelves (New Arrivals / Under $10 / Staff Picks)', '/public/backlist/shelves?store_id=0f9dd4bc-42a7-487e-a972-2905d24513e9', {}, (res, body) => res.ok && body?.ok === true && Array.isArray(body.shelves));
          console.log(JSON.stringify({ ok: true, workerUrl, checkedAt: new Date().toISOString() }));
          NODE
