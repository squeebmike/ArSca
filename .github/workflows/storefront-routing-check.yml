name: Inspect storefront routing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read route and zone status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          async function get(path) {
            const res=await fetch('https://api.cloudflare.com/client/v4/'+path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
            const body=await res.json();
            if(!body.success){console.log(JSON.stringify({path,status:res.status,errors:body.errors}));return null;}
            return body.result;
          }
          (async()=>{
            const zones=await get('zones?name=themanapocket.com');
            for(const z of zones||[]){
              console.log(JSON.stringify({zone:z.id,name:z.name,status:z.status,paused:z.paused,type:z.type,name_servers:z.name_servers}));
              console.log(JSON.stringify({routes:await get('zones/'+z.id+'/workers/routes')}));
              for(const name of ['themanapocket.com','www.themanapocket.com']){
                const records=await get('zones/'+z.id+'/dns_records?name='+name);
                console.log(JSON.stringify({dns:(records||[]).map(r=>({name:r.name,type:r.type,content:r.content,proxied:r.proxied}))}));
              }
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
      - name: Probe live production paths (does the Worker route actually intercept these, or does Webflow 404 them?)
        shell: bash
        run: |
          node <<'NODE'
          async function probe(url, dumpHeaders) {
            try {
              const res = await fetch(url, { redirect: 'manual' });
              const text = await res.text();
              const out = { url, status: res.status, location: res.headers.get('location') || null, snippet: text.slice(0, 200) };
              if (dumpHeaders) out.headers = Object.fromEntries(res.headers.entries());
              console.log(JSON.stringify(out));
            } catch (e) {
              console.log(JSON.stringify({ url, error: e.message }));
            }
          }
          (async () => {
            // Confirm the Worker itself is healthy at its own workers.dev domain
            // (bypasses Cloudflare Routes/DNS entirely -- isolates "is the Worker
            // broken" from "does themanapocket.com actually route to it").
            await probe('https://still-resonance-4f87.swarnerauto.workers.dev/health');
            await probe('https://still-resonance-4f87.swarnerauto.workers.dev/preorder/00000000-0000-0000-0000-000000000000/test');
            // The oldest bound route (since February) -- if this also falls
            // through to Webflow, the problem is systemic, not specific to the
            // routes added this session.
            await probe('https://themanapocket.com/mtg', true);
            await probe('https://themanapocket.com/bcw');
            await probe('https://themanapocket.com/sitemap-items.xml');
            await probe('https://themanapocket.com/item/00000000-0000-0000-0000-000000000000/test', true);
            await probe('https://themanapocket.com/book/00000000-0000-0000-0000-000000000000/test');
            await probe('https://themanapocket.com/preorder/00000000-0000-0000-0000-000000000000/test');
            await probe('https://themanapocket.com/sitemap-preorders.xml');
            // Webflow's own dashboard flags the bare apex domain with "Update
            // needed" (a DNS problem) while www shows "Proxied" with no
            // warning -- test whether the Worker Routes (bound only to the
            // bare "themanapocket.com" pattern, no www) actually intercept on
            // www at all, since that's the domain Webflow says is healthy.
            await probe('https://www.themanapocket.com/mtg', true);
            await probe('https://www.themanapocket.com/preorder/00000000-0000-0000-0000-000000000000/test', true);
          })();
          NODE
