name: Prepare production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.1.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate version
        shell: bash
        run: |
          [[ "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v1.2.3"; exit 1; }
      - name: Open production promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          existing="$(gh pr list --base main --head beta --state open --json url --jq '.[0].url // empty')"
          if [ -n "$existing" ]; then echo "Promotion PR already open: $existing"; exit 0; fi
          gh pr create --base main --head beta --title "Release ${{ inputs.version }}" --body "Promote the tested beta build to production.\n\nRelease: ${{ inputs.version }}\n\nComplete the manual release checklist before merging."
