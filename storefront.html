<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="version" content="2026.07.03.02-public-storefront"><title>Store Inventory</title><style>
:root{--bg:#f5f7fa;--card:#fff;--text:#111827;--muted:#64748b;--line:#dce3ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}header{background:#07110f;color:#fff;padding:28px 20px}.head{max-width:1180px;margin:auto;display:flex;gap:16px;align-items:center}.logo{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#fff}.head h1{margin:0;font-size:clamp(24px,5vw,40px)}.head p{margin:5px 0 0;color:#b8c7c2}.wrap{max-width:1180px;margin:auto;padding:20px}.controls{position:sticky;top:0;z-index:3;background:rgba(245,247,250,.96);padding:12px 0;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:8px}.controls input,.controls select{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;font-size:15px}.summary{color:var(--muted);font-size:14px;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 16px rgba(15,23,42,.05);cursor:pointer}.photo{width:100%;height:260px;object-fit:contain;background:#eef2f5}.no-photo{height:260px;display:grid;place-items:center;background:#eef2f5;color:var(--muted)}.body{padding:14px}.name{font-weight:800;font-size:16px;line-height:1.3}.meta{font-size:12px;color:var(--muted);margin-top:6px;min-height:31px}.price{font-weight:900;color:#047857;font-size:22px;margin-top:10px}.empty{text-align:center;padding:70px 20px;color:var(--muted)}dialog{border:0;border-radius:18px;padding:0;max-width:680px;width:calc(100% - 24px);box-shadow:0 25px 80px #0005}dialog::backdrop{background:#07110fcc}.detail{display:grid;grid-template-columns:1fr 1fr}.detail img,.detail .no-photo{width:100%;height:420px;object-fit:contain}.detail-copy{padding:24px}.btn{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:10px 18px;border:0;border-radius:10px;background:#087f5b;color:#fff;font-weight:800;text-decoration:none;cursor:pointer;margin-top:14px}.close{background:#e8edf2;color:#263445;margin-left:7px}@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.detail{grid-template-columns:1fr}.detail img,.detail .no-photo{height:300px}.photo,.no-photo{height:220px}}
</style></head><body><header><div class="head"><img id="logo" class="logo" hidden><div><h1 id="store-name">Store Inventory</h1><p id="store-message">Loading available items…</p></div></div></header><main class="wrap"><div class="controls"><input id="q" placeholder="Search inventory…"><select id="category"><option value="">All categories</option></select><select id="year"><option value="">All years</option></select><select id="condition"><option value="">All conditions</option></select><select id="sort"><option value="newest">Newest</option><option value="name">Name</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="year">Year</option></select></div><div id="summary" class="summary"></div><section id="grid" class="grid"></section></main><dialog id="detail"><div id="detail-content"></div></dialog><script>
const WORKER='https://still-resonance-4f87.swarnerauto.workers.dev';let payload={store:{},items:[]};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>Number(n)>0?'$'+Number(n).toFixed(2):'Ask for price';
function fill(id,values){const el=document.getElementById(id);[...new Set(values.filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(v=>el.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),cat=document.getElementById('category').value,year=document.getElementById('year').value,cond=document.getElementById('condition').value,sort=document.getElementById('sort').value;let rows=payload.items.filter(i=>(!q||[i.name,i.set,i.variant,i.category,i.year,i.condition].join(' ').toLowerCase().includes(q))&&(!cat||i.category===cat)&&(!year||String(i.year)===year)&&(!cond||i.condition===cond));rows.sort(sort==='price-low'?(a,b)=>a.price-b.price:sort==='price-high'?(a,b)=>b.price-a.price:sort==='name'?(a,b)=>a.name.localeCompare(b.name):sort==='year'?(a,b)=>String(b.year).localeCompare(String(a.year),undefined,{numeric:true}):(a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));document.getElementById('summary').textContent=`${rows.length} available item${rows.length===1?'':'s'}`;document.getElementById('grid').innerHTML=rows.length?rows.map(i=>`<article class="card" data-id="${esc(i.id)}">${i.image?`<img class="photo" src="${esc(i.image)}" alt="${esc(i.name)}" loading="lazy">`:'<div class="no-photo">NO PHOTO</div>'}<div class="body"><div class="name">${esc(i.name)}</div><div class="meta">${esc([i.set,i.year,i.variant,i.condition].filter(Boolean).join(' · '))}</div><div class="price">${money(i.price)}</div></div></article>`).join(''):'<div class="empty">No matching items.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(c.dataset.id));}
function openItem(id){const i=payload.items.find(x=>x.id===id),s=payload.store;if(!i)return;const subject=encodeURIComponent(`Question about ${i.name}`),body=encodeURIComponent(`Hi, I am interested in ${i.name}${i.price?' listed at '+money(i.price):''}. Is it still available?`);document.getElementById('detail-content').innerHTML=`<div class="detail">${i.image?`<img src="${esc(i.image)}" alt="${esc(i.name)}">`:'<div class="no-photo">NO PHOTO</div>'}<div class="detail-copy"><div class="meta">${esc(i.category)}</div><h2>${esc(i.name)}</h2><div class="meta">${esc([i.set,i.year,i.variant,i.condition].filter(Boolean).join(' · '))}</div><div class="price">${money(i.price)}</div>${s.email?`<a class="btn" href="mailto:${esc(s.email)}?subject=${subject}&body=${body}">ASK ABOUT THIS ITEM</a>`:''}<button class="btn close" onclick="document.getElementById('detail').close()">CLOSE</button></div></div>`;document.getElementById('detail').showModal();}
async function start(){const store=new URLSearchParams(location.search).get('store');if(!store){document.getElementById('grid').innerHTML='<div class="empty">Missing store link.</div>';return}try{const r=await fetch(`${WORKER}/public/storefront?store_id=${encodeURIComponent(store)}`),d=await r.json();if(!r.ok)throw new Error(d.error||'Storefront unavailable');payload=d;document.title=`${d.store.name} Inventory`;document.getElementById('store-name').textContent=d.store.name;document.getElementById('store-message').textContent=d.store.message||[d.store.location,'Browse available inventory'].filter(Boolean).join(' · ');if(d.store.logo){const logo=document.getElementById('logo');logo.src=d.store.logo;logo.hidden=false}fill('category',d.items.map(i=>i.category));fill('year',d.items.map(i=>i.year));fill('condition',d.items.map(i=>i.condition));render();}catch(e){document.getElementById('grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`;document.getElementById('store-message').textContent='This catalog is not currently available.';}}
document.querySelectorAll('.controls input,.controls select').forEach(el=>el.addEventListener(el.tagName==='INPUT'?'input':'change',render));start();
</script></body></html>
