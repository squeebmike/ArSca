<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="version" content="2026.08.18.01-sms-consent-optional"><title>Store Inventory</title><meta name="description" content="Shop sports cards, Pokémon TCG, One Piece TCG, comics and sealed product. Browse live inventory with real market pricing and buy online for pickup or shipping."><meta property="og:type" content="website"><meta property="og:title" content="Store Inventory"><meta property="og:description" content="Shop sports cards, Pokémon TCG, One Piece TCG, comics and sealed product. Browse live inventory with real market pricing and buy online for pickup or shipping."><meta name="twitter:card" content="summary"><style>
:root{--bg:#f5f7fa;--card:#fff;--text:#111827;--muted:#64748b;--line:#dce3ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}header{background:#07110f;color:#fff;padding:28px 20px}.head{max-width:1180px;margin:auto;display:flex;gap:16px;align-items:center}.logo{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#fff}.head h1{margin:0;font-size:clamp(24px,5vw,40px)}.head p{margin:5px 0 0;color:#b8c7c2}.wrap{max-width:1180px;margin:auto;padding:20px}.controls{position:sticky;top:0;z-index:3;background:rgba(245,247,250,.96);padding:12px 0;display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px}.controls input,.controls select{min-height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:9px 12px;font-size:15px}.summary{color:var(--muted);font-size:14px;margin:8px 0 14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 3px 16px rgba(15,23,42,.05);cursor:pointer}.photo{width:100%;height:260px;object-fit:contain;background:#eef2f5}.no-photo{height:260px;display:grid;place-items:center;background:#eef2f5;color:var(--muted)}.body{padding:14px}.name{font-weight:800;font-size:16px;line-height:1.3}.meta{font-size:12px;color:var(--muted);margin-top:6px;min-height:31px}.price-row{display:flex;align-items:baseline;gap:8px;margin-top:10px;flex-wrap:wrap}.price{font-weight:900;color:#047857;font-size:22px}.stock-low{font-size:11px;font-weight:800;color:#b45309;margin-top:4px}.signed-badge{display:inline-block;font-size:11px;font-weight:800;color:#92400e;background:#fef3c7;border:1px solid #fde68a;border-radius:6px;padding:2px 8px;margin-top:5px}.card-add-btn{display:block;width:100%;min-height:40px;margin-top:10px;border:0;border-radius:9px;background:#087f5b;color:#fff;font-weight:800;font-size:13px;cursor:pointer}.card-add-btn:active{background:#065f46}.empty{text-align:center;padding:70px 20px;color:var(--muted)}dialog{border:0;border-radius:18px;padding:0;max-width:680px;width:calc(100% - 24px);box-shadow:0 25px 80px #0005}dialog::backdrop{background:#07110fcc}.detail{display:grid;grid-template-columns:1fr 1fr}.detail img,.detail .no-photo{width:100%;height:420px;object-fit:contain}.detail-copy{padding:24px}.btn{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:10px 18px;border:0;border-radius:10px;background:#087f5b;color:#fff;font-weight:800;text-decoration:none;cursor:pointer;margin-top:14px}.btn:disabled{opacity:.5;cursor:not-allowed}.close{background:#e8edf2;color:#263445;margin-left:7px}.btn-row{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:760px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.detail{grid-template-columns:1fr}.detail img,.detail .no-photo{height:300px}.photo,.no-photo{height:220px}}
/* CART */
#cart-fab{position:fixed;right:20px;bottom:20px;z-index:20;background:#07110f;color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;align-items:center;gap:8px}
#cart-fab.on{display:inline-flex}
#cart-fab .badge{background:#087f5b;border-radius:999px;padding:2px 9px;font-size:13px}
.sheet-copy{padding:22px 24px}
.sheet-title{font-size:20px;font-weight:900;margin:0 0 14px}
.cart-line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cart-line img{width:44px;height:58px;object-fit:contain;background:#eef2f5;border-radius:6px}
.cart-line .name{font-size:13px;font-weight:700}
.cart-line .sub{font-size:11px;color:var(--muted)}
.cart-line .rm{margin-left:auto;background:none;border:0;color:#b91c1c;font-size:20px;cursor:pointer;padding:4px 8px}

.cart-total-row.grand{font-weight:900;font-size:19px;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
/* CHECKOUT FORM */
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:14px;font-family:inherit}

.fulfill-opt b{display:block;font-size:14px}
.fulfill-opt span{font-size:12px;color:var(--muted)}
.error-box{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
.error-box.on{display:block}
#stripe-payment-element{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px}
.confirm-box{text-align:center;padding:30px 20px}
.confirm-num{font-family:monospace;font-size:26px;font-weight:900;color:#087f5b;letter-spacing:1px;margin:14px 0}
</style></head><body><header><div class="head"><img id="logo" class="logo" hidden><div><h1 id="store-name">Store Inventory</h1><p id="store-message">Loading available items…</p></div></div></header><main class="wrap"><div class="controls"><input id="q" placeholder="Search inventory…"><select id="category"><option value="">All categories</option></select><select id="ptype"><option value="">All product types</option></select><select id="year"><option value="">All years</option></select><select id="condition"><option value="">All conditions</option></select><select id="sort"><option value="newest">Newest</option><option value="name">Name</option><option value="price-low">Price: low to high</option><option value="price-high">Price: high to low</option><option value="year">Year</option></select></div><div id="summary" class="summary"></div><section id="grid" class="grid"></section></main>

<dialog id="detail"><div id="detail-content"></div></dialog>

<button id="cart-fab" onclick="openCart()">🛒 Cart <span class="badge" id="cart-count">0</span></button>

<dialog id="cart-modal"><div class="sheet-copy">
  <div class="sheet-title">Your Cart</div>
  <div id="cart-lines"></div>
  <div id="cart-totals"></div>
  <div class="btn-row">
    <button class="btn" id="cart-checkout-btn" onclick="openCheckout()">CHECKOUT</button>
    <button class="btn close" onclick="document.getElementById('cart-modal').close()">CLOSE</button>
  </div>
</div></dialog>

<dialog id="checkout-modal"><div class="sheet-copy" id="checkout-content"></div></dialog>

<script src="https://js.stripe.com/v3/"></script>
<script>
const WORKER='https://still-resonance-4f87.swarnerauto.workers.dev';
let payload={store:{},items:[]};
let cart=JSON.parse(localStorage.getItem('storefront_cart')||'[]');
let currentStoreId='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n)>0?'$'+Number(n).toFixed(2):'Ask for price';
function fill(id,values){const el=document.getElementById(id);[...new Set(values.filter(Boolean).map(String))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true})).forEach(v=>el.insertAdjacentHTML('beforeend',`<option value="${esc(v)}">${esc(v)}</option>`));}
// Cascading filter: the Product Type list (Secret Lair, Booster Box, Comic,
// ...) is only meaningful scoped to a category -- MTG and Comics don't share
// product types, so showing every type from every category at once (the
// original behavior) buried the ones a shopper actually wants under
// unrelated noise. Re-narrows the option list to whatever's selected in
// Category, keeping the current pick only if it still applies there.
function refreshProductTypeOptions(){
  const cat=document.getElementById('category').value, sel=document.getElementById('ptype'), current=sel.value;
  const scoped=payload.items.filter(i=>!cat||i.category===cat).map(i=>i.configuration);
  sel.innerHTML='<option value="">All product types</option>';
  fill('ptype', scoped);
  sel.value=[...sel.options].some(o=>o.value===current)?current:'';
}

function saveCart(){ localStorage.setItem('storefront_cart', JSON.stringify(cart)); updateCartFab(); }
function updateCartFab(){
  const fab=document.getElementById('cart-fab');
  const count=cart.reduce((a,c)=>a+c.qty,0);
  document.getElementById('cart-count').textContent=count;
  fab.classList.toggle('on', count>0);
}
function addToCart(id){
  const item=payload.items.find(x=>x.id===id); if(!item) return;
  const available=Math.max(1, Number(item.quantity||1));
  const existing=cart.find(c=>c.id===id);
  if(existing){
    if(existing.qty>=available){ toast('Only '+available+' available'); return; }
    existing.qty++;
  } else {
    cart.push({id, qty:1, name:item.name, price:item.price, image:item.image, set:item.set, year:item.year, condition:item.condition});
  }
  saveCart();
  toast('Added to cart');
}
function removeFromCart(id){ cart=cart.filter(c=>c.id!==id); saveCart(); renderCart(); }
// Lets a customer bump quantity up/down right in the cart drawer instead of
// having to close it and re-find the item in the grid -- especially useful
// on a slow/spotty connection where every extra navigation is costly, since
// this is purely local cart state with no network round trip.
function changeCartQty(id, delta){
  const line=cart.find(c=>c.id===id); if(!line) return;
  const item=payload.items.find(x=>x.id===id);
  const available=Math.max(1, Number(item?.quantity||1));
  const next=line.qty+delta;
  if(next<=0){ removeFromCart(id); return; }
  if(next>available){ toast('Only '+available+' available'); return; }
  line.qty=next;
  saveCart();
  renderCart();
}
function cartTotals(){ const subtotal=cart.reduce((a,c)=>a+Number(c.price||0)*c.qty,0); return {subtotal}; }
function toast(msg){
  let t=document.getElementById('sf-toast');
  if(!t){ t=document.createElement('div'); t.id='sf-toast'; t.style.cssText='position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#07110f;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:50'; document.body.appendChild(t); }
  t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', 1800);
}

// Only calls it out when stock is actually scarce -- most items here are
// unique singles (qty 1), so a flat "1 in stock" on every card would just
// be noise. This is the same urgency-style low-stock line customers expect
// from other shopping sites.
function stockLine(qty){
  const n=Number(qty||0);
  return (n>0 && n<=5) ? `<div class="stock-low">Only ${n} left!</div>` : '';
}
function render(){const q=document.getElementById('q').value.toLowerCase().trim(),cat=document.getElementById('category').value,ptype=document.getElementById('ptype').value,year=document.getElementById('year').value,cond=document.getElementById('condition').value,sort=document.getElementById('sort').value;let rows=payload.items.filter(i=>(!q||[i.name,i.set,i.variant,i.category,i.year,i.condition,i.configuration].join(' ').toLowerCase().includes(q))&&(!cat||i.category===cat)&&(!ptype||i.configuration===ptype)&&(!year||String(i.year)===year)&&(!cond||i.condition===cond));rows.sort(sort==='price-low'?(a,b)=>a.price-b.price:sort==='price-high'?(a,b)=>b.price-a.price:sort==='name'?(a,b)=>a.name.localeCompare(b.name):sort==='year'?(a,b)=>String(b.year).localeCompare(String(a.year),undefined,{numeric:true}):(a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));document.getElementById('summary').textContent=`${rows.length} available item${rows.length===1?'':'s'}`;document.getElementById('grid').innerHTML=rows.length?rows.map(i=>{
  return `<article class="card" data-id="${esc(i.id)}">${i.image?`<img class="photo" src="${esc(i.image)}" alt="${esc(i.name)}" loading="lazy">`:'<div class="no-photo">NO PHOTO</div>'}<div class="body"><div class="name">${esc(i.name)}</div><div class="meta">${esc([i.set,i.year,i.variant,i.configuration,i.condition].filter(Boolean).join(' · '))}</div>${i.isSigned?`<div class="signed-badge">✍ Signed${i.signedBy?' by '+esc(i.signedBy):''}</div>`:''}<div class="price-row"><div class="price">${money(i.price)}</div></div>${stockLine(i.quantity)}<button class="card-add-btn" onclick="event.stopPropagation();addToCart('${esc(i.id)}')">ADD TO CART</button></div></article>`;
}).join(''):'<div class="empty">No matching items.</div>';document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(c.dataset.id));}

// Book details/story/creators panel for comic items -- server only attaches
// `comic` when the item actually has a saved comic record (see the Worker's
// /public/storefront route), so this renders nothing for non-comic items.
function comicDetailHtml(c){
  const stats=[['Series',c.seriesName],['Issue #',c.number],['Selected cover',c.selectedCover],['Publisher',c.publisher],['Series began',c.seriesYearBegan],['Cover date',c.coverDate],['Store date',c.storeDate],['Cover price',c.coverPrice?`${c.coverPriceCurrency||'USD'} ${c.coverPrice.toFixed(2)}`:''],['Rating',c.rating],['UPC',c.upc],['SKU',c.sku]].filter(([,v])=>v);
  const credits=(c.credits||[]).map(cr=>[cr.creator,(cr.roles||[]).join(', ')].filter(Boolean).join(' — ')).join('; ');
  if(!stats.length && !c.description && !(c.writers||[]).length) return '';
  return `<div style="margin-top:18px;padding:16px 24px 20px;border-top:1px solid var(--line)">
    <div style="font-weight:900;font-size:14px;margin-bottom:10px">Book Details, Story &amp; Creators</div>
    ${stats.length?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:14px">${stats.map(([label,value])=>`<div style="background:#f5f7fa;border-radius:8px;padding:8px"><div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em">${esc(label)}</div><div style="font-size:13px;font-weight:700;word-break:break-word">${esc(value)}</div></div>`).join('')}</div>`:''}
    ${c.description?`<div style="font-size:13px;line-height:1.6;margin-bottom:14px">${esc(c.description)}</div>`:''}
    <div style="font-size:13px;line-height:1.7">
      ${c.writers?.length?`<div><b>Writer:</b> ${esc(c.writers.join(', '))}</div>`:''}
      ${c.artists?.length?`<div><b>Artists:</b> ${esc(c.artists.join(', '))}</div>`:''}
      ${c.coverArtists?.length?`<div><b>Cover artists:</b> ${esc(c.coverArtists.join(', '))}</div>`:''}
      ${credits?`<details style="margin:4px 0;color:var(--muted)"><summary style="cursor:pointer">All creator credits</summary><div style="margin-top:6px">${esc(credits)}</div></details>`:''}
      ${c.characters?.length?`<div><b>Characters:</b> ${esc(c.characters.join(', '))}</div>`:''}
      ${c.teams?.length?`<div><b>Team:</b> ${esc(c.teams.join(', '))}</div>`:''}
    </div>
  </div>`;
}
function openItem(id){
  const i=payload.items.find(x=>x.id===id),s=payload.store;if(!i)return;
  const askText=`Hi, I am interested in ${i.name}${i.price?' listed at '+money(i.price):''}. Is it still available?`;
  const smsBody=encodeURIComponent(askText);
  const smsNumber=String(s.phone||'').replace(/[^\d+]/g,'');
  const gallery=[i.image,...(Array.isArray(i.photos)?i.photos:[])].filter(Boolean);
  const thumbs=gallery.length>1?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${gallery.map((url,idx)=>`<img src="${esc(url)}" onclick="document.getElementById('detail-main-photo').src='${esc(url)}'" style="width:52px;height:52px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid ${idx===0?'#087f5b':'transparent'}">`).join('')}</div>`:'';
  document.getElementById('detail-content').innerHTML=`<div class="detail"><div>${gallery.length?`<img id="detail-main-photo" src="${esc(gallery[0])}" alt="${esc(i.name)}">`:'<div class="no-photo">NO PHOTO</div>'}${thumbs}</div><div class="detail-copy"><div class="meta">${esc(i.category)}</div><h2>${esc(i.name)}</h2><div class="meta">${esc([i.set,i.year,i.variant,i.configuration,i.condition].filter(Boolean).join(' · '))}</div>${i.isSigned?`<div class="signed-badge">✍ Signed${i.signedBy?' by '+esc(i.signedBy):''}</div>`:''}<div class="price">${money(i.price)}</div>${stockLine(i.quantity)}<div class="btn-row"><button class="btn" onclick="addToCart('${esc(i.id)}');document.getElementById('detail').close()">ADD TO CART</button>${smsNumber?`<a class="btn close" href="sms:${esc(smsNumber)}?body=${smsBody}">TEXT US ABOUT THIS ITEM</a>`:''}</div><button class="btn close" style="margin-top:8px" onclick="document.getElementById('detail').close()">CLOSE</button></div></div>${i.comic?comicDetailHtml(i.comic):''}`;
  document.getElementById('detail').showModal();
}

function openCart(){ renderCart(); document.getElementById('cart-modal').showModal(); }
function renderCart(){
  const linesEl=document.getElementById('cart-lines'), totalsEl=document.getElementById('cart-totals'), btn=document.getElementById('cart-checkout-btn');
  if(!cart.length){ linesEl.innerHTML='<div class="empty" style="padding:24px 0">Your cart is empty.</div>'; totalsEl.innerHTML=''; btn.disabled=true; return; }
  btn.disabled=false;
  linesEl.innerHTML=cart.map(c=>{
    const item=payload.items.find(x=>x.id===c.id);
    const available=Math.max(1, Number(item?.quantity||1));
    return `<div class="cart-line">${c.image?`<img src="${esc(c.image)}">`:''}<div><div class="name">${esc(c.name)}</div><div class="sub">${esc([c.set,c.year,c.condition].filter(Boolean).join(' · '))}</div><div class="qty-stepper"><button onclick="changeCartQty('${esc(c.id)}',-1)" aria-label="Decrease quantity">−</button><span class="qty-val">${c.qty}</span><button onclick="changeCartQty('${esc(c.id)}',1)" ${c.qty>=available?'disabled':''} aria-label="Increase quantity">+</button></div></div><div>$${(c.price*c.qty).toFixed(2)}</div><button class="rm" onclick="removeFromCart('${esc(c.id)}')" aria-label="Remove item">×</button></div>`;
  }).join('');
  const {subtotal}=cartTotals();
  totalsEl.innerHTML=`<div class="cart-total-row grand"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div><div style="font-size:11px;color:var(--muted)">Shipping (if selected) is calculated at checkout.</div>`;
}

// ── CHECKOUT ──────────────────────────────────────────────────────
let checkoutFulfillment='pickup_fedway';
function openCheckout(){
  document.getElementById('cart-modal').close();
  checkoutFulfillment='pickup_fedway';
  renderCheckoutForm();
  document.getElementById('checkout-modal').showModal();
}
function renderCheckoutForm(){
  document.getElementById('checkout-content').innerHTML=`
    <div class="sheet-title">Checkout</div>
    <div class="error-box" id="checkout-error"></div>
    <div class="fulfill-opts" id="fulfill-opts">
      <div class="fulfill-opt ${checkoutFulfillment==='pickup_fedway'?'on':''}" data-method="pickup_fedway" onclick="setFulfillment('pickup_fedway')"><b>Local Pickup — Fed Way Commons</b><span>We're there most weekends. We'll text/call to arrange a pickup time.</span></div>
      <div class="fulfill-opt ${checkoutFulfillment==='pickup_kitsap'?'on':''}" data-method="pickup_kitsap" onclick="setFulfillment('pickup_kitsap')"><b>Local Meetup — Kitsap County</b><span>We'll coordinate a meeting spot and time with you directly.</span></div>
      <div class="fulfill-opt ${checkoutFulfillment==='shipping'?'on':''}" data-method="shipping" onclick="setFulfillment('shipping')"><b>Ship to me</b><span>Real carrier rate, calculated from your address once entered below.</span></div>
    </div>
    <div class="field"><label>Full name</label><input id="ck-name" placeholder="Jane Smith"></div>
    <div class="field"><label>Phone number</label><input id="ck-phone" type="tel" placeholder="(555) 555-5555"></div>
    <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--text);margin:-6px 0 14px"><input id="ck-sms-consent" type="checkbox" style="margin-top:3px"> I agree to receive text messages about this order from ${esc(payload.store.name||'this store')}. Message frequency depends on order activity. Msg &amp; data rates may apply. Reply HELP for help, STOP to opt out. See our <a href="https://themanapocket.com/privacy-policy" target="_blank">Privacy Policy</a> and <a href="https://themanapocket.com/terms-and-conditions" target="_blank">Terms</a>.</label>
    <div class="field"><label>Email (optional)</label><input id="ck-email" type="email" placeholder="jane@example.com"></div>
    <div id="ck-shipping-fields" style="display:${checkoutFulfillment==='shipping'?'block':'none'}">
      <div class="field"><label>Address line 1</label><input id="ck-addr1" placeholder="123 Main St" oninput="liveShippingQuoteDebounced()"></div>
      <div class="field"><label>Address line 2 (optional)</label><input id="ck-addr2" placeholder="Apt / unit" oninput="liveShippingQuoteDebounced()"></div>
      <div class="field"><label>City</label><input id="ck-city" oninput="liveShippingQuoteDebounced()"></div>
      <div class="field"><label>State</label><input id="ck-state" maxlength="2" placeholder="WA" oninput="liveShippingQuoteDebounced()"></div>
      <div class="field"><label>ZIP</label><input id="ck-zip" oninput="liveShippingQuoteDebounced()"></div>
    </div>
    <div id="ck-summary" style="margin:14px 0;font-size:14px"></div>
    <div class="btn-row">
      <button class="btn" id="ck-continue-btn" onclick="submitCheckout()">CONTINUE TO PAYMENT</button>
      <button class="btn close" onclick="document.getElementById('checkout-modal').close()">CANCEL</button>
    </div>`;
  liveShippingQuote={cents:null,real:false,loading:false,label:'',error:''};
  updateCheckoutSummary();
}
function setFulfillment(method){
  checkoutFulfillment=method;
  document.querySelectorAll('.fulfill-opt').forEach(el=>el.classList.toggle('on', el.dataset.method===method));
  document.getElementById('ck-shipping-fields').style.display = method==='shipping' ? 'block' : 'none';
  if(method==='shipping') liveShippingQuoteDebounced();
  updateCheckoutSummary();
}
let liveShippingQuote={cents:null,real:false,loading:false,label:'',error:''};
async function fetchLiveShippingQuote(){
  if(checkoutFulfillment!=='shipping'||!cart.length) return;
  const line1=document.getElementById('ck-addr1')?.value.trim();
  const city=document.getElementById('ck-city')?.value.trim();
  const state=document.getElementById('ck-state')?.value.trim();
  const zip=document.getElementById('ck-zip')?.value.trim();
  if(!line1||!city||!state||!zip){ liveShippingQuote={cents:null,real:false,loading:false,label:'',error:''}; updateCheckoutSummary(); return; }
  liveShippingQuote={cents:null,real:false,loading:true,label:'',error:''};
  updateCheckoutSummary();
  try{
    const res=await fetch(`${WORKER}/public/storefront/shipping-quote`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        storeId:currentStoreId,
        items:cart.map(c=>({itemId:c.id, quantity:c.qty})),
        destination:{line1, line2:document.getElementById('ck-addr2')?.value.trim()||'', city, state, zip},
      }),
    });
    const data=await res.json();
    if(!res.ok||!data.ok){ liveShippingQuote={cents:null,real:false,loading:false,label:'',error:data.error||'Live shipping is unavailable. Please choose pickup.'}; updateCheckoutSummary(); return; }
    liveShippingQuote={
      cents:data.shippingFeeCents,
      real:!!data.real,
      loading:false,
      label:data.real && data.carrier ? `${data.carrier}${data.serviceName?' '+data.serviceName:''}` : '',
      error:'',
    };
  }catch(e){
    liveShippingQuote={cents:null,real:false,loading:false,label:'',error:'Live shipping is unavailable. Please choose pickup or try again.'};
  }
  updateCheckoutSummary();
}
const liveShippingQuoteDebounced=debounce(fetchLiveShippingQuote, 600);
function updateCheckoutSummary(){
  const {subtotal}=cartTotals();
  const needsQuote=checkoutFulfillment==='shipping'&&liveShippingQuote.cents==null;
  const shipping=checkoutFulfillment==='shipping'&&!needsQuote ? liveShippingQuote.cents/100 : 0;
  const shipLabel=liveShippingQuote.loading ? 'Getting live carrier rate…' : (liveShippingQuote.error||'Enter your complete address for a live carrier rate.');
  document.getElementById('ck-summary').innerHTML=`<div class="cart-total-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>${checkoutFulfillment==='shipping'?(needsQuote?`<div style="padding:10px 0;color:var(--muted)">${esc(shipLabel)}</div>`:`<div class="cart-total-row"><span>Shipping${liveShippingQuote.label?' ('+esc(liveShippingQuote.label)+')':''}</span><span>$${shipping.toFixed(2)}</span></div>`):''}<div class="cart-total-row grand"><span>${needsQuote?'Subtotal':'Total'}</span><span>$${(subtotal+shipping).toFixed(2)}</span></div>`;
  const btn=document.getElementById('ck-continue-btn');
  if(btn){ btn.disabled=needsQuote; btn.textContent=needsQuote?'LIVE SHIPPING QUOTE REQUIRED':'CONTINUE TO PAYMENT'; }
}
function showCheckoutError(msg){
  const el=document.getElementById('checkout-error');
  el.textContent=msg; el.classList.add('on');
}

async function submitCheckout(){
  const name=document.getElementById('ck-name').value.trim();
  const phone=document.getElementById('ck-phone').value.trim();
  const email=document.getElementById('ck-email').value.trim();
  document.getElementById('checkout-error').classList.remove('on');
  if(!name||!phone){ showCheckoutError('Name and phone number are required.'); return; }
  let shippingAddress=null;
  if(checkoutFulfillment==='shipping'){
    shippingAddress={
      line1:document.getElementById('ck-addr1').value.trim(),
      line2:document.getElementById('ck-addr2').value.trim(),
      city:document.getElementById('ck-city').value.trim(),
      state:document.getElementById('ck-state').value.trim(),
      zip:document.getElementById('ck-zip').value.trim(),
    };
    if(!shippingAddress.line1||!shippingAddress.city||!shippingAddress.state||!shippingAddress.zip){ showCheckoutError('A complete shipping address is required.'); return; }
    if(liveShippingQuote.loading||liveShippingQuote.cents==null){ showCheckoutError(liveShippingQuote.error||'Wait for a live carrier rate before continuing.'); return; }
  }
  const btn=document.getElementById('ck-continue-btn');
  btn.disabled=true; btn.textContent='PLEASE WAIT…';
  try{
    const res=await fetch(`${WORKER}/public/storefront/checkout`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        storeId:currentStoreId,
        items:cart.map(c=>({itemId:c.id, quantity:c.qty})),
        fulfillment:{method:checkoutFulfillment, name, phone, email, shippingAddress},
      }),
    });
    const data=await res.json();
    if(!res.ok||!data.ok) throw new Error(data.error||'Checkout failed');
    mountStripePayment(data);
  }catch(e){
    showCheckoutError(e.message);
    btn.disabled=false; btn.textContent='CONTINUE TO PAYMENT';
  }
}

let stripeCheckoutRuntime=null;
async function mountStripePayment(data){
  const stripe=Stripe(data.publishableKey);
  const elements=stripe.elements({clientSecret:data.clientSecret, appearance:{theme:'stripe', variables:{colorPrimary:'#087f5b', borderRadius:'8px'}}});
  document.getElementById('checkout-content').innerHTML=`
    <div class="sheet-title">Payment</div>
    <div class="error-box" id="pay-error"></div>
    <div style="margin-bottom:12px;font-size:14px">Total: <b>$${(data.amountCents/100).toFixed(2)}</b>${data.mode==='test'?' (test mode)':''}</div>
    <div id="stripe-payment-element"></div>
    <div class="btn-row">
      <button class="btn" id="pay-btn" onclick="confirmStorefrontPayment()">PAY $${(data.amountCents/100).toFixed(2)}</button>
      <button class="btn close" onclick="document.getElementById('checkout-modal').close()">CANCEL</button>
    </div>`;
  elements.create('payment',{layout:'tabs'}).mount('#stripe-payment-element');
  stripeCheckoutRuntime={stripe, elements, confirmationNumber:data.confirmationNumber};
}
async function confirmStorefrontPayment(){
  const rt=stripeCheckoutRuntime; if(!rt) return;
  const btn=document.getElementById('pay-btn'), errEl=document.getElementById('pay-error');
  btn.disabled=true; btn.textContent='PROCESSING…'; errEl.classList.remove('on');
  try{
    const result=await rt.stripe.confirmPayment({elements:rt.elements, redirect:'if_required'});
    if(result.error) throw new Error(result.error.message);
    cart=[]; saveCart();
    document.getElementById('checkout-content').innerHTML=`<div class="confirm-box">
      <div style="font-size:40px">✅</div>
      <div style="font-size:18px;font-weight:800;margin-top:8px">Order confirmed!</div>
      <div class="confirm-num">${esc(rt.confirmationNumber)}</div>
      <div style="color:var(--muted);font-size:13px">Save this confirmation number. We'll text/call you to arrange pickup or get your order shipped.</div>
      <button class="btn" onclick="document.getElementById('checkout-modal').close();location.reload()">DONE</button>
    </div>`;
  }catch(e){
    errEl.textContent=e.message; errEl.classList.add('on');
    btn.disabled=false; btn.textContent='RETRY PAYMENT';
  }
}

// Falls back to this store when the page is opened with no ?store= param,
// so a plain custom-domain URL (e.g. shop.example.com) works as a bookmark
// without needing the query string tacked on.
const DEFAULT_STORE_ID='0f9dd4bc-42a7-487e-a972-2905d24513e9';
async function start(){const store=new URLSearchParams(location.search).get('store')||DEFAULT_STORE_ID;if(!store){document.getElementById('grid').innerHTML='<div class="empty">Missing store link.</div>';return}currentStoreId=store;try{const r=await fetch(`${WORKER}/public/storefront?store_id=${encodeURIComponent(store)}&_=${Date.now()}`,{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.error||'Storefront unavailable');payload=d;document.title=`${d.store.name} Inventory`;const desc=`Shop ${d.store.name} — sports cards, Pokémon TCG, One Piece TCG, comics and sealed product. Real market pricing, buy online for pickup or shipping.`;document.querySelector('meta[name="description"]')?.setAttribute('content',desc);document.querySelector('meta[property="og:title"]')?.setAttribute('content',`${d.store.name} Inventory`);document.querySelector('meta[property="og:description"]')?.setAttribute('content',desc);document.getElementById('store-name').textContent=d.store.name;document.getElementById('store-message').textContent=d.store.message||[d.store.location,'Browse available inventory'].filter(Boolean).join(' · ');if(d.store.logo){const logo=document.getElementById('logo');logo.onerror=()=>{logo.hidden=true};logo.src=d.store.logo;logo.hidden=false}fill('category',d.items.map(i=>i.category));refreshProductTypeOptions();fill('year',d.items.map(i=>i.year));fill('condition',d.items.map(i=>i.condition));cart=cart.filter(c=>d.items.some(i=>i.id===c.id));saveCart();render();}catch(e){document.getElementById('grid').innerHTML=`<div class="empty">${esc(e.message)}</div>`;document.getElementById('store-message').textContent='This catalog is not currently available.';}}
document.getElementById('category').addEventListener('change', refreshProductTypeOptions);
// render() filters the entire catalog and rebuilds the whole product grid --
// real work on a shop with hundreds/thousands of items. The search box used
// to call it directly on every keystroke; debounce it so it only runs once
// the customer pauses typing. The dropdown filters stay on 'change' (already
// a discrete, infrequent event, not a keystroke stream) so picking one still
// feels instant.
function debounce(fn, waitMs){
  let timer=null;
  return function(...args){ clearTimeout(timer); timer=setTimeout(()=>fn.apply(this,args), waitMs); };
}
const renderDebounced = debounce(render, 200);
document.querySelectorAll('.controls input').forEach(el=>el.addEventListener('input', renderDebounced));
document.querySelectorAll('.controls select').forEach(el=>el.addEventListener('change', render));
updateCartFab();
start();
</script></body></html>
