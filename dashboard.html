<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBA Dashboard</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:20px}
.card{background:#111;padding:15px;margin:10px 0;border-radius:10px}
</style>
</head>

<body>

<h2>Inventory Dashboard</h2>

<div class="card">
Proxy:
<input id="proxy" style="width:100%">
</div>

<button onclick="load()">Load Inventory</button>

<pre id="out"></pre>

<script>

const DEFAULT_PROXY = "https://still-resonance-4f87.swarnerauto.workers.dev";

document.getElementById("proxy").value =
localStorage.getItem("proxy") || DEFAULT_PROXY;

async function load(){

  const proxy = document.getElementById("proxy").value;
  localStorage.setItem("proxy", proxy);

  const res = await fetch(proxy + "/proxy/collections/YOUR_COLLECTION/items");
  const data = await res.json();

  document.getElementById("out").textContent =
  JSON.stringify(data,null,2);
}

</script>

</body>
</html>
