<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBA Dashboard</title>

<style>
body{background:#000;color:#fff;font-family:sans-serif;padding:20px}
h1{margin-bottom:10px}
.card{background:#111;padding:15px;margin:10px 0;border-radius:10px}
</style>
</head>

<body>

<h1>Inventory</h1>

<button onclick="load()">Refresh</button>

<div id="stats"></div>
<pre id="data"></pre>

<script>

const WORKER = "https://still-resonance-4f87.swarnerauto.workers.dev";

async function load(){

  const res = await fetch(WORKER + "/proxy/collections/YOUR_COLLECTION/items");
  const data = await res.json();

  document.getElementById("data").textContent =
    JSON.stringify(data,null,2);

  const total = data.items?.length || 0;

  document.getElementById("stats").innerHTML =
    `<div class="card">Total Items: ${total}</div>`;
}

load();

</script>

</body>
</html>
