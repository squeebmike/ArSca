<script>
// ============================================================
// LBA DASHBOARD SCRIPT — REPLACEMENT
// ============================================================

// ---------------- CONFIG ----------------
const WF_PRODUCTS = '65eb45a28ff6bf3fe4f17b14';
const WF_SKUS     = '65eb45a28ff6bf3fe4f17afb';
const DEFAULT_PROXY = 'https://still-resonance-4f87.swarnerauto.workers.dev';

const CAT_MAP = {
  '891253037409c4fe59854f3c9ef99a6b': 'Sports',
  '475ed99cc87de703b543fe9529e2c1da': 'TCG',
  '27f1c9c43a61cf03820a31132cfc6b9a': 'Comic',
  '2c3076cc33bf2f312265bfdc894db265': 'Graded'
};

const STATUS_SOLD_ID = 'e6b42f14fcb99aa2168a5f5672226f68';

// ---------------- STATE ----------------
let all = [];
let filtered = [];
let activeF = 'all';
let page = 1;
const PER = 50;
let sortState = { col: 'name', dir: 1 };

// ---------------- HELPERS ----------------
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const money0 = n => '$' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
const money2 = n => '$' + Number(n || 0).toFixed(2);

function getWfToken() {
  return localStorage.getItem('lba_wf_token') || '';
}
function setWfToken(v) {
  localStorage.setItem('lba_wf_token', v);
}
function getProxyUrl() {
  return (localStorage.getItem('lba_proxy_url') || DEFAULT_PROXY).replace(/\/+$/, '');
}
function setProxyUrl(v) {
  localStorage.setItem('lba_proxy_url', v);
}
function clearCreds() {
  localStorage.removeItem('lba_wf_token');
  localStorage.removeItem('lba_proxy_url');
}

function buildUrl(path) {
  return getProxyUrl() + '/proxy' + path;
}

function buildHeaders() {
  return {
    'accept': 'application/json',
    'X-LBA-Token': getWfToken(),
  };
}

async function wfFetch(path, options = {}) {
  const res = await fetch(buildUrl(path), {
    ...options,
    headers: {
      ...(options.headers || {}),
      ...buildHeaders(),
    }
  });
  return res;
}

function showSetup(prefill = true) {
  const setup = $('#setup');
  if (!setup) return;
  setup.style.display = 'flex';

  if (prefill) {
    const wfInp = $('#wf-inp');
    const proxyInp = $('#proxy-inp');
    if (wfInp) wfInp.value = getWfToken();
    if (proxyInp) proxyInp.value = getProxyUrl();
  }
}

function hideSetup() {
  const setup = $('#setup');
  if (setup) setup.style.display = 'none';
}

function showError(msg) {
  const box = $('#token-help');
  if (!box) return;
  box.innerHTML = msg;
  box.style.display = 'block';
  showSetup(true);
}

function safeLower(v) {
  return String(v || '').toLowerCase();
}

function parseNumber(v, fallback = 0) {
  const n = parseFloat(v);
  return Number.isFinite(n) ? n : fallback;
}

function parseIntSafe(v, fallback = 0) {
  const n = parseInt(v, 10);
  return Number.isFinite(n) ? n : fallback;
}

// ---------------- INIT ----------------
window.initDashboard = function initDashboard() {
  const t = ($('#wf-inp')?.value || '').trim();
  const p = ($('#proxy-inp')?.value || '').trim();

  if (!t) {
    alert('Enter your Webflow API token');
    return;
  }

  setWfToken(t);
  if (p) setProxyUrl(p);

  hideSetup();
  loadInventory();
};

window.resetToken = function resetToken() {
  clearCreds();
  showSetup(false);

  const wfInp = $('#wf-inp');
  const proxyInp = $('#proxy-inp');

  if (wfInp) wfInp.value = '';
  if (proxyInp) proxyInp.value = DEFAULT_PROXY;

  const tokenHelp = $('#token-help');
  if (tokenHelp) tokenHelp.style.display = 'none';
};

(function boot() {
  if (getWfToken()) {
    hideSetup();
    loadInventory();
  } else {
    showSetup(true);
  }
})();

// ---------------- DATA LOAD ----------------
async function fetchPagedCollection(collectionId) {
  let items = [];
  let offset = 0;
  let total = 1;

  while (offset < total) {
    const res = await wfFetch(`/collections/${collectionId}/items?limit=100&offset=${offset}`);

    if (res.status === 401) {
      clearCreds();
      showError('Invalid token. Re-enter your Webflow token.');
      throw new Error('Unauthorized');
    }
    if (res.status === 403) {
      showError('Token is valid but missing required Webflow permissions.');
      throw new Error('Forbidden');
    }
    if (!res.ok) {
      throw new Error(`Webflow API ${res.status}`);
    }

    const data = await res.json();
    const batch = data.items || [];
    const paginationTotal = data.pagination?.total || batch.length || 0;

    items = items.concat(batch);
    total = paginationTotal;
    offset += batch.length;

    if (batch.length < 100) break;
  }

  return items;
}

window.loadInventory = async function loadInventory() {
  const sync = $('#sync-status');
  if (sync) sync.textContent = 'Loading...';

  if (!getWfToken()) {
    showSetup(true);
    return;
  }

  try {
    const [products, skus] = await Promise.all([
      fetchPagedCollection(WF_PRODUCTS),
      fetchPagedCollection(WF_SKUS).catch(() => [])
    ]);

    const skuPriceMap = {};
    for (const sku of skus) {
      const f = sku.fieldData || {};
      const productId = f.product;
      const priceCents = f.price?.value || 0;
      if (productId && priceCents > 0) {
        skuPriceMap[productId] = priceCents / 100;
      }
    }

    all = products.map(p => mapItem(p, skuPriceMap));
    filtered = [...all];

    renderAll();

    if (sync) {
      sync.textContent = `${products.length} products · ${skus.length} SKUs · ${new Date().toLocaleTimeString()}`;
    }
  } catch (err) {
    console.error(err);
    if (sync) sync.textContent = `⚠ ${err.message}`;
  }
};

function mapItem(item, skuPriceMap = {}) {
  const f = item.fieldData || {};

  const isSold =
    f['sold-out'] === true ||
    f.status === STATUS_SOLD_ID ||
    safeLower(f.status).includes('sold');

  let category = CAT_MAP[f['card-category']] || 'Comic';

  if (!f['card-category'] && /marvel|dc|image|dark horse|idw/i.test(`${f.publisher || ''} ${f.brand || ''}`)) {
    category = 'Comic';
  }

  if (safeLower(f.grader || f.grade || f.graded) && category !== 'Comic' && category !== 'Sports' && category !== 'TCG') {
    category = 'Graded';
  }

  const qty = Math.max(1, parseIntSafe(f['inventory-count'] ?? f['quantity-in-stock'] ?? 1, 1));
  const skuPrice = skuPriceMap[item.id] || 0;
  const market = parseNumber(f['market-value'], skuPrice || 0);
  const cost = parseNumber(f.cost, 0);
  const salePrice = parseNumber(f['sale-price'], isSold ? skuPrice : 0);
  const explicitProfit = parseNumber(f.profit, NaN);

  const name = f['player-card-name'] || f.name || '—';
  const set = f['set-name'] || f.set || '';
  const variant = f['variant-parallel'] || f.variant || '';

  const profit = Number.isFinite(explicitProfit)
    ? explicitProfit
    : (isSold ? salePrice - cost : market - cost);

  return {
    id: item.id,
    name,
    set,
    variant,
    year: f.year || '',
    condition: f.condition || 'NM',
    category,
    qty,
    cost,
    market,
    salePrice,
    profit,
    status: isSold ? 'sold' : 'in_stock',
    channel: f['sale-channel'] || '',
    addedAt: f['date-added'] || item.createdOn || '',
    soldAt: f['date-sold'] || '',
    isRookie: !!f['is-rookie'],
    description: f.description || '',
    publisher: f.publisher || f.brand || '',
  };
}

// ---------------- RENDER ----------------
function renderAll() {
  renderStats();
  renderCats();
  renderChannels();
  renderTopVal();
  renderFeed();
  filterTable();
}

function renderStats() {
  const ins = all.filter(i => i.status === 'in_stock');
  const sold = all.filter(i => i.status === 'sold');

  const inStockUnits = ins.reduce((a, i) => a + (i.qty || 1), 0);
  const marketValue = ins.reduce((a, i) => a + ((i.market || 0) * (i.qty || 1)), 0);
  const totalProfit = sold.reduce((a, i) => a + (i.profit || 0), 0);
  const costBasis = all.reduce((a, i) => a + ((i.cost || 0) * (i.qty || 1)), 0);
  const soldRevenue = sold.reduce((a, i) => a + (i.salePrice || 0), 0);
  const avgMargin = sold.length ? totalProfit / sold.length : 0;

  $('#s1').textContent = ins.length;
  $('#s1b').textContent = `${inStockUnits} units · ${all.length} SKUs`;
  $('#s2').textContent = money0(marketValue);
  $('#s3').textContent = `${totalProfit >= 0 ? '+' : ''}${money0(totalProfit)}`;
  $('#s3b').textContent = `${sold.length} sold`;
  $('#s4').textContent = sold.length;
  $('#s4b').textContent = `${money0(soldRevenue)} rev`;
  $('#s5').textContent = money0(costBasis);
  $('#s6').textContent = `${avgMargin >= 0 ? '+' : ''}${money2(avgMargin)}`;
}

function renderCats() {
  ['Sports', 'TCG', 'Comic', 'Graded'].forEach(c => {
    const items = all.filter(i => i.category === c && i.status === 'in_stock');
    const count = items.reduce((a, i) => a + (i.qty || 1), 0);
    const value = items.reduce((a, i) => a + ((i.market || 0) * (i.qty || 1)), 0);

    const key = c.toLowerCase();
    const cEl = document.getElementById('c-' + key);
    const vEl = document.getElementById('cv-' + key);

    if (cEl) cEl.textContent = count;
    if (vEl) vEl.textContent = `${money0(value)} value`;
  });

  const totalUnits = all
    .filter(i => i.status === 'in_stock')
    .reduce((a, i) => a + (i.qty || 1), 0);

  $('#ct-total').textContent = `${totalUnits} in stock`;
}

function renderChannels() {
  const sold = all.filter(i => i.status === 'sold');
  const bucket = {};

  for (const i of sold) {
    const ch = i.channel || 'In-Store';
    bucket[ch] = (bucket[ch] || 0) + (i.salePrice || 0);
  }

  const pairs = Object.entries(bucket).sort((a, b) => b[1] - a[1]);
  const max = pairs[0]?.[1] || 1;
  const colors = {
    'In-Store': 'var(--g)',
    'eBay': 'var(--gold)',
    'Whatnot': 'var(--purple)',
    'Website': 'var(--blue)',
  };

  const el = $('#ch-bars');
  if (!pairs.length) {
    el.innerHTML = `<div style="color:var(--dim);font-family:'DM Mono',monospace;font-size:11px;padding:20px 0">No sales yet</div>`;
    return;
  }

  el.innerHTML = pairs.map(([c, v]) => `
    <div class="br">
      <span class="br-l">${c}</span>
      <div class="br-t">
        <div class="br-f" style="width:${(v / max * 100).toFixed(1)}%;background:${colors[c] || 'var(--red)'}"></div>
      </div>
      <span class="br-v">${money0(v)}</span>
    </div>
  `).join('');
}

function renderTopVal() {
  const top = all
    .filter(i => i.status === 'in_stock' && i.market > 0)
    .sort((a, b) => (b.market || 0) - (a.market || 0))
    .slice(0, 8);

  const el = $('#top-val');
  if (!top.length) {
    el.innerHTML = `<div class="empty"><div class="empty-t">NO ITEMS YET</div><div class="empty-s">Add inventory to see top value items</div></div>`;
    return;
  }

  const max = top[0].market || 1;
  const colors = {
    Sports: 'var(--gold)',
    TCG: 'var(--g)',
    Comic: 'var(--purple)',
    Graded: 'var(--blue)',
  };

  el.innerHTML = top.map(i => `
    <div class="br">
      <span class="br-l" title="${escapeHtml(i.name)}">${escapeHtml(i.name)}</span>
      <div class="br-t">
        <div class="br-f" style="width:${(i.market / max * 100).toFixed(1)}%;background:${colors[i.category] || 'var(--g)'}"></div>
      </div>
      <span class="br-v">${money2(i.market)}</span>
    </div>
  `).join('');
}

function renderFeed() {
  const sorted = [...all]
    .sort((a, b) => new Date(b.soldAt || b.addedAt || 0) - new Date(a.soldAt || a.addedAt || 0))
    .slice(0, 10);

  const el = $('#feed');
  if (!sorted.length) {
    el.innerHTML = `<div class="empty"><div class="empty-t">NO ACTIVITY</div></div>`;
    return;
  }

  el.innerHTML = sorted.map(i => {
    const isSale = i.status === 'sold';
    const d = new Date(i.soldAt || i.addedAt || 0);
    const ds = d.getFullYear() > 2000 ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';

    return `
      <div class="fi">
        <div class="fi-i ${isSale ? 'sale' : 'add'}">${isSale ? '✓' : '+'}</div>
        <div class="fi-b">
          <div class="fi-n">${escapeHtml(i.name)}</div>
          <div class="fi-m">${isSale ? `SOLD via ${escapeHtml(i.channel || '—')}` : escapeHtml(i.category)} · ${ds}</div>
        </div>
        <div class="fi-a ${isSale ? 'pos' : 'cost'}">${isSale ? money2(i.salePrice) : (i.market > 0 ? money2(i.market) : '—')}</div>
      </div>
    `;
  }).join('');
}

// ---------------- TABLE ----------------
window.srt = function srt(col) {
  if (sortState.col === col) {
    sortState.dir *= -1;
  } else {
    sortState.col = col;
    sortState.dir = 1;
  }

  $$('th').forEach(th => th.classList.remove('asc', 'desc'));

  const map = {
    name: 0,
    set: 1,
    qty: 3,
    market: 4,
    cost: 5,
    profit: 6,
  };
  const idx = map[col];
  const th = document.querySelectorAll('th')[idx];
  if (th) th.classList.add(sortState.dir === 1 ? 'asc' : 'desc');

  page = 1;
  renderTable();
};

window.setF = function setF(f, btn) {
  activeF = f;
  page = 1;
  $$('.fb').forEach(b => b.classList.remove('on'));
  if (btn) btn.classList.add('on');
  filterTable();
};

window.filterTable = function filterTable() {
  const q = safeLower($('#tbl-q')?.value || '');

  filtered = all.filter(i => {
    const matchesQ =
      !q ||
      safeLower(i.name).includes(q) ||
      safeLower(i.set).includes(q) ||
      safeLower(i.variant).includes(q);

    const matchesF =
      activeF === 'all' ? true :
      activeF === 'in_stock' ? i.status === 'in_stock' :
      activeF === 'sold' ? i.status === 'sold' :
      safeLower(i.category) === safeLower(activeF);

    return matchesQ && matchesF;
  });

  filtered.sort((a, b) => {
    let av = a[sortState.col];
    let bv = b[sortState.col];

    if (typeof av === 'string') av = safeLower(av);
    if (typeof bv === 'string') bv = safeLower(bv);

    if (av < bv) return -1 * sortState.dir;
    if (av > bv) return  1 * sortState.dir;
    return 0;
  });

  renderTable();
};

function renderTable() {
  const start = (page - 1) * PER;
  const rows = filtered.slice(start, start + PER);
  const tb = $('#tbody');

  if (!filtered.length) {
    tb.innerHTML = `
      <tr>
        <td colspan="8">
          <div class="empty">
            <div class="empty-t">NO ITEMS FOUND</div>
            <div class="empty-s">No matching inventory yet.</div>
          </div>
        </td>
      </tr>
    `;
    $('#pager').innerHTML = '';
    return;
  }

  tb.innerHTML = rows.map(i => {
    const ins = i.status === 'in_stock';
    const pft = ins ? ((i.market || 0) - (i.cost || 0)) : (i.profit || 0);
    const pClass = pft >= 0 ? 'pp' : 'pp neg';
    const catClass = (i.category || 'TCG').replace(/\s+/g, '');
    return `
      <tr class="${ins ? '' : 'sold'}">
        <td>
          <span class="dot ${ins ? 'in_stock' : 'sold'}"></span>
          <span class="nc">${escapeHtml(i.name)}${i.isRookie ? ' <span style="color:var(--gold);font-size:8px">RC</span>' : ''}</span>
        </td>
        <td><span class="sc2">${escapeHtml([i.set, i.variant].filter(Boolean).join(' · ') || '—')}</span></td>
        <td><span class="ct ${catClass}">${escapeHtml(i.category || 'TCG')}</span></td>
        <td style="text-align:center;font-family:'Orbitron',monospace;font-size:11px;color:${(i.qty || 1) > 1 ? 'var(--g)' : 'var(--dim)'}">${i.qty || 1}</td>
        <td class="pc pm">${i.market > 0 ? money2(i.market) : '—'}</td>
        <td class="pc pd">${i.cost > 0 ? money2(i.cost) : '—'}</td>
        <td class="pc ${pClass}">${(i.cost > 0 || i.profit) ? `${pft >= 0 ? '+' : ''}${money2(pft)}` : '—'}</td>
        <td><span style="font-family:'DM Mono',monospace;font-size:10px;color:${ins ? 'var(--g)' : 'var(--dim)'}">${ins ? 'IN STOCK' : `SOLD${i.channel ? ' · ' + escapeHtml(i.channel) : ''}`}</span></td>
      </tr>
    `;
  }).join('');

  const totalPages = Math.ceil(filtered.length / PER);
  $('#pager').innerHTML = totalPages <= 1 ? '' :
    Array.from({ length: totalPages }, (_, i) => `
      <button class="pg${i + 1 === page ? ' on' : ''}" onclick="page=${i + 1};renderTable()">${i + 1}</button>
    `).join('');
}

window.renderTable = renderTable;

// ---------------- UTILS ----------------
function escapeHtml(str) {
  return String(str || '')
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}
</script>
