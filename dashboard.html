<!DOCTYPE html>
<html>
<head>
  <title>LBA Dashboard</title>
</head>
<body>
  <h1>Inventory Dashboard</h1>

  <label>Worker URL:</label><br>
  <input id="proxy" style="width:400px"><br><br>

  <label>Webflow Token (optional):</label><br>
  <input id="token" style="width:400px"><br><br>

  <button onclick="loadData()">Load Inventory</button>

  <pre id="output"></pre>

  <script>
    function getHeaders() {
      const token = document.getElementById('token').value;
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['X-LBA-Token'] = token;
      return headers;
    }

    async function loadData() {
      const proxy = document.getElementById('proxy').value;

      const res = await fetch(proxy + '/proxy/collections', {
        headers: getHeaders()
      });

      const data = await res.json();

      document.getElementById('output').textContent =
        JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
