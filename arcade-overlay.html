<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Mana Pocket Arcade V4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="assets/live-studio.css?v=40"><link rel="stylesheet" href="assets/byterider.css?v=20"></head>
<body class="mana-overlay">
<section id="mana-hud" class="mana-panel" aria-label="Show score board">
  <div class="mana-hud-row">
    <div class="mana-stat"><span class="mana-label">1UP SCORE</span><b id="mana-gross">$0</b></div>
    <div class="mana-stat"><span class="mana-label">SOLD</span><b id="mana-sold">0</b></div>
    <div class="mana-stat"><span class="mana-label">HI-SCORE</span><b id="mana-biggest">$0</b></div>
  </div>
  <div id="mana-boss" aria-label="Boss battle">
    <canvas id="mana-boss-sprite" width="48" height="48" aria-hidden="true"></canvas><canvas id="mana-boss-3d" width="280" height="280" aria-hidden="true"></canvas>
    <div class="mana-boss-main">
    <div class="mana-boss-top"><span id="mana-boss-name">THE SCALPER</span><span id="mana-boss-hp">HP $500</span></div>
    <div class="mana-boss-bar"><i id="mana-boss-fill"></i><em id="mana-boss-ko">K.O.!</em></div>
    <div id="mana-boss-taunt"></div>
    </div>
    <div id="mana-boss-hits" aria-hidden="true"></div>
  </div>
  <div id="mana-dungeon" class="mana-hidden" aria-label="Dungeon floor"><b id="mana-dungeon-floor">FLOOR 1</b><span id="mana-dungeon-shed">GARDEN SHED</span><span id="mana-dungeon-stars"></span><span id="mana-dungeon-next"></span></div>
  <div id="mana-combo" aria-live="polite"></div>
</section>
<!-- Boss fights (2026-11-12): the versus entrance, hit combos, angry moves, the K.O. -->
<div id="mana-boss-intro" class="mana-hidden" aria-live="polite"><div class="mana-vs-flash"></div><div class="mana-vs-card"><canvas id="mana-vs-art" width="48" height="48"></canvas><div class="mana-vs-text"><span id="mana-vs-floor">FLOOR 1 BOSS</span><b id="mana-vs-name">THE SCALPER</b><i id="mana-vs-taunt"></i></div></div></div>
<div id="mana-boss-combo" aria-hidden="true"></div>
<div id="mana-move" aria-hidden="true"></div>
<div id="mana-ko" aria-hidden="true"><b>K.O.!</b></div>
<main id="mana-sign" class="mana-panel" aria-label="Mana Pocket arcade sign"><div class="mana-liquid" aria-hidden="true"></div><div class="mana-bubbles" aria-hidden="true"></div><div class="mana-title"><span id="mana-title-text">THE MANA POCKET</span><span id="mana-flask-meter"></span></div><div id="mana-cbar-sub"></div><div id="mana-sign-hits" aria-hidden="true"></div><div class="mana-track"><span id="mana-message"></span></div></main>
<section id="mana-crawl" class="mana-hidden" aria-label="The shed crawl"><canvas id="mana-fp" width="240" height="96" aria-hidden="true"></canvas><div id="mana-crawl-weapon"></div><div id="mana-fp-hand" aria-hidden="true"></div><div id="mana-fp-peek"></div><div id="mana-fp-chest"></div><div id="mana-fp-batt" aria-label="Flashlight battery"></div></section>
<div id="mana-fg" class="mana-hidden" aria-hidden="true"><canvas id="mana-fg-l" width="160" height="160"></canvas><canvas id="mana-fg-r" width="160" height="160"></canvas></div>
<section id="mana-reveal" class="mana-hidden" aria-live="polite"><div id="mana-reveal-label"></div><div class="mana-reveal-stage"><div class="mana-reveal-rays" aria-hidden="true"></div><div class="mana-reveal-lift"><div class="mana-reveal-card"><img id="mana-reveal-img" alt=""><div class="mana-reveal-back">THE MANA POCKET</div></div></div></div><canvas id="mana-reveal-chest" width="160" height="160" aria-hidden="true"></canvas><div id="mana-reveal-title"></div><div id="mana-reveal-price"></div></section>
<section id="mana-vote" class="mana-hidden" aria-live="polite"><div class="mana-vote-head">CHAT PICKS!</div><div id="mana-vote-title"></div><ol id="mana-vote-list"></ol><div class="mana-vote-foot">TYPE THE NUMBER IN CHAT</div></section>
<section id="mana-arena" class="mana-hidden" aria-label="Boss"></section>
<section id="mana-card" class="mana-panel" aria-label="Now playing">
  <div class="mana-card-head">NOW PLAYING</div>
  <div class="mana-card-art"><img id="mana-card-img" alt=""><div id="mana-card-insert">INSERT<br>COIN</div></div>
  <div id="mana-card-title"></div><div id="mana-card-detail"></div>
  <div id="mana-card-price"></div>
</section>
<section id="mana-map" class="mana-panel mana-hidden" aria-label="Dungeon map"><div class="mana-card-head">THE MAP</div><div id="mana-doors"></div><ol id="mana-map-list"></ol><div class="mana-relic-head">RELICS</div><div id="mana-relics"></div></section>
<section id="mana-queue" class="mana-panel" aria-label="Next up"><div class="mana-card-head">NEXT STAGE</div><ol id="mana-queue-list"></ol></section>
<div id="mana-effect" role="status" aria-live="assertive"><div class="mana-burst"><img id="mana-effect-art" alt=""><canvas id="mana-effect-boss" width="420" height="420" aria-hidden="true"></canvas><div id="mana-effect-word"></div><div id="mana-effect-main"></div><div id="mana-effect-sub"></div></div></div>
<div id="mana-coins" aria-hidden="true"></div><canvas id="mana-coins-3d" width="1080" height="1920" aria-hidden="true"></canvas>
<div id="mana-hype" aria-label="Hype meter"><b>HYPE</b><i></i><i></i><i></i><i></i><i></i></div>
<div id="byterider" aria-label="ByteRider_97"></div>
<div id="mana-connection" hidden></div>
<script type="module" src="scripts/live-studio-overlay.mjs?v=41"></script></body></html>
