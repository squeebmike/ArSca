<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Mana Pocket Arcade V4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&display=swap">
<link rel="stylesheet" href="assets/live-studio.css?v=5"></head>
<body class="mana-overlay">
<section id="mana-hud" class="mana-panel" aria-label="Show score board">
  <div class="mana-hud-row">
    <div class="mana-stat"><span class="mana-label">1UP SCORE</span><b id="mana-gross">$0</b></div>
    <div class="mana-stat"><span class="mana-label">SOLD</span><b id="mana-sold">0</b></div>
    <div class="mana-stat"><span class="mana-label">HI-SCORE</span><b id="mana-biggest">$0</b></div>
  </div>
  <div id="mana-boss" aria-label="Boss battle">
    <div class="mana-boss-top"><span id="mana-boss-name">THE SPECULATOR</span><span id="mana-boss-hp">HP $500</span></div>
    <div class="mana-boss-bar"><i id="mana-boss-fill"></i><em id="mana-boss-ko">K.O.!</em></div>
    <div id="mana-boss-hits" aria-hidden="true"></div>
  </div>
  <div id="mana-combo" aria-live="polite"></div>
</section>
<main id="mana-sign" class="mana-panel" aria-label="Mana Pocket arcade sign"><div class="mana-liquid" aria-hidden="true"></div><div class="mana-bubbles" aria-hidden="true"></div><div class="mana-title">THE MANA POCKET</div><div class="mana-track"><span id="mana-message"></span></div></main>
<section id="mana-card" class="mana-panel" aria-label="Now playing">
  <div class="mana-card-head">NOW PLAYING</div>
  <div class="mana-card-art"><img id="mana-card-img" alt=""><div id="mana-card-insert">INSERT<br>COIN</div></div>
  <div id="mana-card-title"></div><div id="mana-card-detail"></div>
  <div id="mana-card-price"></div>
</section>
<section id="mana-queue" class="mana-panel" aria-label="Next up"><div class="mana-card-head">NEXT STAGE</div><ol id="mana-queue-list"></ol></section>
<div id="mana-effect" role="status" aria-live="assertive"><div class="mana-burst"><div id="mana-effect-word"></div><div id="mana-effect-main"></div><div id="mana-effect-sub"></div></div></div>
<div id="mana-coins" aria-hidden="true"></div>
<div id="mana-connection" hidden></div>
<script type="module" src="scripts/live-studio-overlay.mjs?v=5"></script></body></html>
