<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LBA Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--g:#00ffb3;--gd:rgba(0,255,179,0.15);--gold:#ffd166;--red:#ff4d6d;--blue:#48cae4;--purple:#c77dff;--psa:#e63946;--bg:#050507;--surface:rgba(5,5,7,0.97);}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:#fff;}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
#canvas{display:none;}
#oc{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;}
#setup{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;z-index:100;}
.s-logo{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;color:var(--g);letter-spacing:5px;text-shadow:0 0 30px var(--g);text-align:center;line-height:1.1;}
.s-sub{font-family:monospace;font-size:10px;color:rgba(255,255,255,.3);letter-spacing:3px;}
.s-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.s-badge{font-family:monospace;font-size:9px;padding:3px 8px;border:1px solid rgba(0,255,179,.2);color:rgba(0,255,179,.5);}
.s-inp{width:100%;max-width:340px;background:rgba(0,0,0,.5);border:1px solid rgba(0,255,179,.25);color:#fff;padding:12px 14px;font-family:monospace;font-size:13px;outline:none;}
.s-inp:focus{border-color:var(--g);}
.s-btn{width:100%;max-width:340px;background:var(--g);color:#000;border:none;padding:15px;font-family:'Orbitron',monospace;font-weight:700;font-size:13px;letter-spacing:2px;cursor:pointer;}
.s-btn2{width:100%;max-width:340px;background:rgba(255,209,102,.15);color:var(--gold);border:1px solid rgba(255,209,102,.4);padding:13px;font-family:'Orbitron',monospace;font-weight:700;font-size:12px;letter-spacing:2px;cursor:pointer;}
#hud{position:fixed;top:0;left:0;right:0;z-index:30;padding:10px 12px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;align-items:center;}
.hl{font-family:'Orbitron',monospace;font-size:13px;font-weight:900;color:var(--g);letter-spacing:3px;text-shadow:0 0 16px var(--g);}
.hbtns{display:flex;gap:5px;align-items:center;}
#hstatus{font-family:monospace;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:1px;margin-right:2px;}
.hbtn{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:5px 9px;font-family:monospace;font-size:10px;cursor:pointer;}
.hbtn.on{color:var(--red);border-color:var(--red);}
.hbtn.flip-on{color:var(--gold);border-color:var(--gold);background:rgba(255,209,102,.1);}
.hbtn.bulk-on{color:var(--purple);border-color:var(--purple);background:rgba(199,125,255,.1);}
#scanbar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:12px 12px 26px;background:linear-gradient(to top,rgba(0,0,0,.92) 60%,transparent);display:flex;flex-direction:column;align-items:center;gap:7px;}
#scanbtn{background:var(--g);color:#000;border:none;padding:15px 52px;font-family:'Orbitron',monospace;font-weight:900;font-size:14px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 32px rgba(0,255,179,.5);touch-action:manipulation;}
#scanbtn.reading{background:var(--gold);}
#scanbtn.autoon{background:var(--red);}
#scanbtn.backmode{background:var(--gold);}
#scanbtn.bulkmode{background:var(--purple);}
.shint{font-family:monospace;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1px;text-align:center;}
.shint.back{color:var(--gold);}.shint.bulk{color:var(--purple);}
#brackets{position:fixed;inset:0;z-index:4;pointer-events:none;}
.br{position:absolute;width:44px;height:44px;border-color:var(--g);border-style:solid;opacity:.5;}
.br.gold{border-color:var(--gold);}.br.purple{border-color:var(--purple);}
.tl{top:22%;left:4%;border-width:2px 0 0 2px;}.tr{top:22%;right:4%;border-width:2px 2px 0 0;}
.bl{bottom:22%;left:4%;border-width:0 0 2px 2px;}.brr{bottom:22%;right:4%;border-width:0 2px 2px 0;}
#scanline{position:absolute;left:4%;right:4%;height:1.5px;background:linear-gradient(90deg,transparent,var(--g),transparent);box-shadow:0 0 8px var(--g);animation:scan 2.5s ease-in-out infinite;}
#scanline.gold{background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 8px var(--gold);}
#scanline.purple{background:linear-gradient(90deg,transparent,var(--purple),transparent);box-shadow:0 0 8px var(--purple);}
@keyframes scan{0%{top:23%}48%{top:77%}52%{top:77%}100%{top:23%}}
#modebadge{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:30;padding:5px 14px;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;display:none;}
#modebadge.back{background:rgba(255,209,102,.15);border:1px solid var(--gold);color:var(--gold);}
#modebadge.bulk{background:rgba(199,125,255,.15);border:1px solid var(--purple);color:var(--purple);}
.bub{position:fixed;background:var(--surface);border:1.5px solid var(--g);padding:10px 12px;width:192px;z-index:20;box-shadow:0 0 20px rgba(0,255,179,.15);max-height:82vh;overflow-y:auto;}
.bub::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--g),transparent);}
.bub.sports{border-color:var(--gold);}.bub.sports::before{background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.bub.comic{border-color:var(--purple);}.bub.comic::before{background:linear-gradient(90deg,transparent,var(--purple),transparent);}
.bub.psa{border-color:var(--psa);border-width:2px;}.bub.psa::before{background:linear-gradient(90deg,transparent,var(--psa),transparent);}
.bub.bgs{border-color:#aaa;}.bub.bgs::before{background:linear-gradient(90deg,transparent,#aaa,transparent);}
.bub.cgc{border-color:var(--gold);}.bub.cgc::before{background:linear-gradient(90deg,transparent,var(--gold),transparent);}
/* CARD IMAGE */
.card-img{width:100%;height:120px;object-fit:contain;margin-bottom:6px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.3);}
.card-img-placeholder{width:100%;height:80px;display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:9px;color:rgba(255,255,255,.2);letter-spacing:1px;border:1px dashed rgba(255,255,255,.08);margin-bottom:6px;}
.btype{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:2px;margin-bottom:2px;opacity:.8;}
.btype.tcg{color:var(--g)}.btype.sports{color:var(--gold)}.btype.comic{color:var(--purple)}
.btype.psa{color:var(--psa)}.btype.bgs{color:#ccc}.btype.cgc{color:var(--gold)}.btype.sgc{color:#ff9500}
.bname{font-size:13px;font-weight:600;color:#fff;margin-bottom:1px;padding-right:18px;line-height:1.2;}
.bsub{font-family:monospace;font-size:9px;color:rgba(255,255,255,.4);margin-bottom:4px;line-height:1.5;}
.slab-grade{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:8px 10px;}
.slab-grade.psa{background:rgba(230,57,70,.12);border:1px solid rgba(230,57,70,.3);}
.slab-grade.bgs{background:rgba(150,150,150,.1);border:1px solid rgba(150,150,150,.3);}
.slab-grade.cgc{background:rgba(244,162,97,.1);border:1px solid rgba(244,162,97,.3);}
.grade-num{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;line-height:1;}
.grade-num.psa{color:var(--psa)}.grade-num.bgs{color:#ccc}.grade-num.cgc{color:var(--gold)}.grade-num.sgc{color:#ff9500}
.grade-info{display:flex;flex-direction:column;gap:2px;}
.grade-co{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;letter-spacing:1px;}
.grade-co.psa{color:var(--psa)}.grade-co.bgs{color:#ccc}.grade-co.cgc{color:var(--gold)}.grade-co.sgc{color:#ff9500}
.grade-cert{font-family:monospace;font-size:9px;color:rgba(255,255,255,.4);}
.slab-subgrades{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:6px;}
.sg{background:rgba(255,255,255,.04);padding:4px 6px;text-align:center;}
.sg-label{font-family:monospace;font-size:7px;color:rgba(255,255,255,.3);letter-spacing:1px;}
.sg-val{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;color:#ccc;}
.pop-row{display:flex;justify-content:space-between;padding:5px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);margin-bottom:5px;}
.pop-label{font-family:monospace;font-size:8px;color:rgba(255,255,255,.35);}
.pop-val.rare{color:var(--g)}.pop-val.common{color:rgba(255,255,255,.5)}
.pop-val{font-family:'Orbitron',monospace;font-size:10px;}
.stock-row{display:flex;align-items:center;gap:6px;margin-bottom:5px;padding:4px 7px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
.stock-num{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;}
.sn-in{color:var(--g)}.sn-low{color:var(--gold)}.sn-no{color:var(--red)}
.stock-label{font-family:monospace;font-size:9px;color:rgba(255,255,255,.4);letter-spacing:1px;}
.drow{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.dscore{font-family:'Orbitron',monospace;font-size:10px;font-weight:700;padding:2px 6px;}
.dhi{color:#00ffb3;background:rgba(0,255,179,.12);border:1px solid rgba(0,255,179,.3);}
.dmd{color:var(--gold);background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.3);}
.dlo{color:var(--red);background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);}
.trend{font-family:monospace;font-size:10px;flex:1;}
.tup{color:#00ffb3}.tdn{color:var(--red)}.tfl{color:rgba(255,255,255,.4)}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px;}
.tag{font-family:monospace;font-size:8px;padding:2px 5px;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);}
.tag.hot{border-color:rgba(255,77,109,.4);color:var(--red);background:rgba(255,77,109,.08);}
.tag.rc{border-color:rgba(255,209,102,.4);color:var(--gold);background:rgba(255,209,102,.08);}
.tag.key{border-color:rgba(0,255,179,.4);color:var(--g);background:rgba(0,255,179,.08);}
.keynotes{font-family:monospace;font-size:8px;color:rgba(255,209,102,.7);margin-bottom:4px;line-height:1.4;}
.prow{display:flex;align-items:baseline;gap:5px;margin-bottom:2px;}
.bprice{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;line-height:1;}
.bprice.tcg{color:var(--g)}.bprice.sports{color:var(--gold)}.bprice.comic{color:var(--purple)}
.bprice.psa,.bprice.bgs,.bprice.cgc,.bprice.sgc{color:#ccc}
.brange{font-family:monospace;font-size:9px;color:rgba(255,255,255,.3);margin-bottom:5px;}
.comps{margin-bottom:5px;}
.comps-hdr{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.3);margin-bottom:3px;}
.comp-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.comp-d{font-family:monospace;font-size:8px;color:rgba(255,255,255,.45);flex:1;margin-right:4px;line-height:1.3;}
.comp-p{font-family:'Orbitron',monospace;font-size:9px;color:var(--g);}
.backinfo{background:rgba(255,209,102,.05);border:1px solid rgba(255,209,102,.2);padding:6px 8px;margin-bottom:6px;}
.backinfo-hdr{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;color:var(--gold);margin-bottom:4px;}
.backinfo-row{display:flex;justify-content:space-between;font-family:monospace;font-size:8px;color:rgba(255,255,255,.5);padding:1px 0;}
.backinfo-val{color:rgba(255,255,255,.8);}
.bsels{display:flex;flex-direction:column;gap:4px;margin-bottom:5px;}
.bsel{width:100%;background:#0d0d0f;color:#fff;border:1px solid rgba(255,255,255,.12);padding:5px 7px;font-family:monospace;font-size:10px;outline:none;}
.bsel:focus{border-color:var(--g);}
.bconds{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px;}
.bcp{font-family:'Orbitron',monospace;font-size:7px;padding:2px 5px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4);cursor:pointer;}
.bcp.on{border-color:var(--g);color:var(--g);background:var(--gd);}
.inv-form{background:rgba(0,0,0,.4);border:1px solid rgba(0,255,179,.2);padding:8px;margin-bottom:5px;}
.inv-form-title{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;color:var(--g);margin-bottom:6px;}
.sold-form{background:rgba(255,77,109,.05);border:1px solid rgba(255,77,109,.2);padding:8px;margin-bottom:5px;}
.sold-form-title{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;color:var(--red);margin-bottom:6px;}
.inv-inp{width:100%;background:#0d0d0f;color:#fff;border:1px solid rgba(255,255,255,.12);padding:5px 7px;font-family:monospace;font-size:11px;outline:none;margin-bottom:4px;}
.inv-inp:focus{border-color:var(--g);}
.inv-inp::placeholder{color:rgba(255,255,255,.2);}
.inv-label{font-family:monospace;font-size:8px;color:rgba(255,255,255,.3);margin-bottom:2px;}
/* CMS SYNC STATUS */
.cms-status{font-family:monospace;font-size:8px;padding:3px 6px;text-align:center;margin-bottom:4px;letter-spacing:1px;}
.cms-syncing{color:var(--gold);border:1px solid rgba(255,209,102,.2);background:rgba(255,209,102,.06);}
.cms-synced{color:var(--g);border:1px solid rgba(0,255,179,.2);background:rgba(0,255,179,.06);}
.cms-error{color:var(--red);border:1px solid rgba(255,77,109,.2);background:rgba(255,77,109,.06);}
.bacts{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:0;}
.bact{border:none;padding:7px 4px;font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;cursor:pointer;text-align:center;text-decoration:none;display:block;line-height:1.3;}
.a-tcg{background:rgba(0,255,179,.08);color:var(--g);border:1px solid rgba(0,255,179,.2);}
.a-ebay{background:rgba(255,209,102,.08);color:var(--gold);border:1px solid rgba(255,209,102,.2);}
.a-130{background:rgba(72,202,228,.08);color:var(--blue);border:1px solid rgba(72,202,228,.2);}
.a-gcol{background:rgba(199,125,255,.08);color:var(--purple);border:1px solid rgba(199,125,255,.2);}
.a-psa{background:rgba(230,57,70,.08);color:var(--psa);border:1px solid rgba(230,57,70,.2);}
.a-add{background:rgba(0,255,179,.1);color:var(--g);border:1px solid rgba(0,255,179,.25);grid-column:1/-1;}
.a-sell{background:rgba(255,77,109,.1);color:var(--red);border:1px solid rgba(255,77,109,.25);grid-column:1/-1;}
.a-confirm{background:var(--g);color:#000;border:none;grid-column:1/-1;font-weight:700;}
.a-cancel{background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1);}
.a-added{background:rgba(0,255,179,.2);color:var(--g);border:1px solid var(--g);grid-column:1/-1;}
.bx{position:absolute;top:4px;right:6px;background:none;border:none;color:rgba(255,255,255,.25);font-size:15px;cursor:pointer;padding:0;}
.conf{font-family:monospace;font-size:8px;padding:1px 5px;display:inline-block;margin-bottom:4px;}
.c-hi{color:var(--g);border:1px solid rgba(0,255,179,.25);background:rgba(0,255,179,.06);}
.c-md{color:var(--gold);border:1px solid rgba(255,209,102,.25);background:rgba(255,209,102,.06);}
.c-lo{color:var(--red);border:1px solid rgba(255,77,109,.25);background:rgba(255,77,109,.06);}
.profit-preview{font-family:'Orbitron',monospace;font-size:10px;padding:4px 6px;text-align:center;margin-bottom:4px;}
.profit-pos{color:var(--g);background:rgba(0,255,179,.08);border:1px solid rgba(0,255,179,.2);}
.profit-neg{color:var(--red);background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.2);}
/* BULK PANEL */
#bulkpanel{position:fixed;bottom:80px;left:10px;right:10px;z-index:25;background:rgba(5,5,7,.97);border:1.5px solid var(--purple);padding:14px;display:none;max-height:60vh;overflow-y:auto;}
#bulkpanel::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--purple),transparent);}
.bulk-hdr{font-family:'Orbitron',monospace;font-size:11px;font-weight:900;color:var(--purple);letter-spacing:2px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.bulk-settings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
.bulk-label{font-family:monospace;font-size:8px;color:rgba(255,255,255,.35);letter-spacing:1px;margin-bottom:3px;}
.bulk-inp{width:100%;background:#0d0d0f;color:#fff;border:1px solid rgba(199,125,255,.2);padding:6px 8px;font-family:'Orbitron',monospace;font-size:12px;outline:none;}
.bulk-list{margin-bottom:10px;}
.bulk-item{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.bulk-item-name{font-family:monospace;font-size:10px;color:#fff;flex:1;}
.bulk-item-mkt{font-family:monospace;font-size:9px;color:rgba(255,255,255,.35);margin-left:6px;}
.bulk-item-offer{font-family:'Orbitron',monospace;font-size:11px;color:var(--purple);}
.bulk-item-rm{background:none;border:none;color:rgba(255,77,109,.5);font-size:13px;cursor:pointer;padding:0 0 0 6px;}
.bulk-total{background:rgba(199,125,255,.08);border:1px solid rgba(199,125,255,.3);padding:10px 12px;margin-bottom:8px;}
.bulk-total-row{display:flex;justify-content:space-between;font-family:monospace;font-size:10px;color:rgba(255,255,255,.5);margin-bottom:3px;}
.bulk-total-val{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;color:var(--purple);}
.bulk-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.bulk-btn{padding:10px;font-family:'Orbitron',monospace;font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer;text-align:center;border:none;}
.bulk-btn.primary{background:var(--purple);color:#fff;}
.bulk-btn.secondary{background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);}
.empty-bulk{font-family:monospace;font-size:11px;color:rgba(255,255,255,.25);text-align:center;padding:20px 0;letter-spacing:1px;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.95);border:1px solid rgba(0,255,179,.4);padding:9px 20px;font-family:monospace;font-size:11px;color:var(--g);z-index:200;max-width:90vw;text-align:center;}
</style>
</head>
<body>

<div id="setup">
  <div class="s-logo">LBA<br>SCANNER</div>
  <div class="s-sub">AI CARD + COMIC IDENTIFIER</div>
  <div class="s-badges">
    <span class="s-badge">TCG</span><span class="s-badge">SPORTS</span>
    <span class="s-badge">COMICS</span><span class="s-badge">PSA/BGS/CGC</span>
  </div>
  <input class="s-inp" id="kinp" type="password" placeholder="Anthropic API key (sk-ant-...)">
  <button class="s-btn" onclick="launch()">&#9654; LAUNCH SCANNER</button>
  <button class="s-btn2" onclick="launchBulk()">&#9654; BULK BUY MODE</button>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<canvas id="oc"></canvas>
<div id="brackets">
  <div class="br tl" id="br-tl"></div><div class="br tr" id="br-tr"></div>
  <div class="br bl" id="br-bl"></div><div class="br brr" id="br-br"></div>
  <div id="scanline"></div>
</div>
<div id="modebadge"></div>
<div id="hud" style="display:none">
  <span class="hl">LBA</span>
  <div class="hbtns">
    <span id="hstatus">LIVE</span>
    <button class="hbtn" id="flipbtn" onclick="toggleFlip()">FLIP</button>
    <button class="hbtn" id="bulkbtn" onclick="toggleBulk()">BULK</button>
    <button class="hbtn" id="autobitn" onclick="toggleAuto()">AUTO</button>
    <button class="hbtn" onclick="clearAll()">CLR</button>
  </div>
</div>

// ============================================================
// TCG PRINTING FETCHERS — fetch ALL printings from free APIs
// Returns { printings: [...], imageUrl: '...', bestMatchIdx: 0 }
// ============================================================

async function fetchAllPrintings(item){
  const game = item.game||'';
  const name = item.name||'';
  const hintSet = (item.set_name||'').toLowerCase();
  const result = { printings: [], imageUrl: null, bestMatchIdx: 0 };

  try{
    // ── POKEMON TCG ──────────────────────────────────────────
    if(game==='Pokemon TCG'){
      // Search all printings of this card name
      const q = encodeURIComponent(`name:"${name}"`);
      const r = await fetch(`https://api.pokemontcg.io/v2/cards?q=${q}&pageSize=100&orderBy=-set.releaseDate`);
      const d = await r.json();
      if(d.data&&d.data.length){
        let bestIdx = 0;
        d.data.forEach((card, i) => {
          const setNameLower = (card.set?.name||'').toLowerCase();
          const variantName = card.subtypes?.join(' ')||'';
          const rarity = card.rarity||'';
          const number = card.number||'';
          const total = card.set?.total||'';
          // Build a price estimate from tcgplayer data if available
          const mid = card.tcgplayer?.prices?.holofoil?.mid
            || card.tcgplayer?.prices?.normal?.mid
            || card.tcgplayer?.prices?.['1stEditionHolofoil']?.mid
            || card.tcgplayer?.prices?.reverseHolofoil?.mid
            || 0;
          const low = card.tcgplayer?.prices?.holofoil?.low
            || card.tcgplayer?.prices?.normal?.low || 0;
          const high = card.tcgplayer?.prices?.holofoil?.high
            || card.tcgplayer?.prices?.normal?.high || 0;
          const tcgUrl = card.tcgplayer?.url || null;
          result.printings.push({
            set: card.set?.name || 'Unknown Set',
            variant: variantName || rarity || 'Base',
            year: card.set?.releaseDate?.substring(0,4) || '',
            numbered: number&&total ? `${number}/${total}` : null,
            mid: mid||0, low: low||0, high: high||0,
            hasRealPrice: !!(mid),
            imageUrl: card.images?.large || card.images?.small || null,
            tcgUrl: tcgUrl,
            setId: card.set?.id || '',
            cardId: card.id
          });
          // Score match quality against Claude's hint set
          if(hintSet && setNameLower.includes(hintSet.split(' ')[0])) bestIdx = i;
        });
        result.bestMatchIdx = bestIdx;
        result.imageUrl = d.data[bestIdx]?.images?.large || d.data[0]?.images?.small;
      }
    }

    // ── MAGIC: THE GATHERING (Scryfall) ──────────────────────
    else if(game==='Magic: The Gathering'){
      // Get all printings via /cards/search with unique=prints
      const r = await fetch(`https://api.scryfall.com/cards/search?q=${encodeURIComponent('!"'+name+'"')}&unique=prints&order=released&dir=desc`);
      const d = await r.json();
      if(d.data&&d.data.length){
        let bestIdx = 0;
        d.data.forEach((card, i) => {
          const setNameLower = (card.set_name||'').toLowerCase();
          const imgUrl = card.image_uris?.normal
            || card.card_faces?.[0]?.image_uris?.normal || null;
          const usd = parseFloat(card.prices?.usd||0);
          const usdFoil = parseFloat(card.prices?.usd_foil||0);
          const isFoil = card.foil && !card.nonfoil;
          const tcgLink = card.purchase_uris?.tcgplayer || null;
          result.printings.push({
            set: card.set_name || 'Unknown Set',
            variant: card.frame_effects?.join(' ') || (isFoil?'Foil':'Base'),
            year: card.released_at?.substring(0,4) || '',
            numbered: card.collector_number ? `#${card.collector_number}` : null,
            mid: usdFoil||usd||0, low: Math.max((usdFoil||usd)*0.8,0), high: (usdFoil||usd)*1.3||0,
            hasRealPrice: !!(usdFoil||usd),
            imageUrl: imgUrl,
            tcgUrl: tcgLink,
            scryfallUrl: `https://scryfall.com/card/${card.set}/${card.collector_number}`,
            setCode: card.set,
            cardId: card.id
          });
          if(hintSet && setNameLower.includes(hintSet.split(' ')[0])) bestIdx = i;
        });
        result.bestMatchIdx = bestIdx;
        result.imageUrl = d.data[bestIdx]?.image_uris?.normal
          || d.data[bestIdx]?.card_faces?.[0]?.image_uris?.normal
          || d.data[0]?.image_uris?.normal;
      }
    }

    // ── YU-GI-OH (YGOProDeck) ────────────────────────────────
    else if(game==="Yu-Gi-Oh!"){
      const r = await fetch(`https://db.ygoprodeck.com/api/v7/cardinfo.php?name=${encodeURIComponent(name)}`);
      const d = await r.json();
      if(d.data&&d.data[0]){
        const card = d.data[0];
        // Each card_set entry is a printing
        let bestIdx = 0;
        if(card.card_sets&&card.card_sets.length){
          card.card_sets.forEach((s, i) => {
            const setNameLower = (s.set_name||'').toLowerCase();
            const ygoPrice = parseFloat(s.set_price)||0;
            result.printings.push({
              set: s.set_name || 'Unknown Set',
              variant: s.set_rarity || 'Common',
              year: s.set_code?.match(/\d{2}/)?.[0] ? '20'+s.set_code.match(/\d{2}/)[0] : '',
              numbered: s.set_code||null,
              mid: ygoPrice, low: ygoPrice*0.8, high: ygoPrice*1.3,
              hasRealPrice: !!(ygoPrice),
              imageUrl: card.card_images[0]?.image_url || null,
              tcgUrl: `https://www.tcgplayer.com/search/yugioh/product?productLineName=yugioh&q=${encodeURIComponent(card.name)}`,
              setCode: s.set_code
            });
            if(hintSet && setNameLower.includes(hintSet.split(' ')[0])) bestIdx = i;
          });
          result.bestMatchIdx = bestIdx;
        } else {
          result.printings.push({set:'Unknown',variant:'Base',year:'',numbered:null,mid:1,low:0.5,high:2,imageUrl:card.card_images[0]?.image_url||null});
        }
        result.imageUrl = card.card_images[0]?.image_url || null;
      }
    }

  }catch(e){ console.log('Printings fetch failed:',e); }

  return result;
}

async function syncToWebflowCMS(entry, imageUrl){
  const key = localStorage.getItem('lba_k');
  if(!key) return null;

  // Generate unique slug
  const slug = 'lba-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);

  const fieldData = {
    name: entry.name || 'Unknown Card',
    slug: slug,
    'player-card-name': entry.player || entry.name || '',
    'set': entry.set || '',
    'variant-parallel': entry.variant || '',
    'year': entry.year ? String(entry.year) : '',
    'team': entry.team || '',
    'manufacturer': entry.manufacturer || '',
    'condition': entry.condition || 'NM',
    'card-number': entry.card_number || '',
    'serial-number': entry.serial_number || '',
    'grading-company': entry.grading_company || '',
    'grade': entry.grade || '',
    'cert-number': entry.cert_number || '',
    'sport': entry.sport || '',
    'key-notes': entry.key_notes || '',
    'cost': Math.round((entry.cost || 0) * 100) / 100,
    'market-value': Math.round((entry.market || 0) * 100) / 100,
    'list-price': Math.round((entry.price || entry.market || 0) * 100) / 100,
    'quantity-in-stock': 1,
    'quantity-sold': 0,
    'is-rookie': entry.is_rookie || false,
    'is-key-card': entry.is_key || false,
    'status': 'In Stock',
    'category': entry.category || 'TCG',
    'source': entry.source || 'AR Scanner',
    'location': entry.location || '',
    'desirability-score': entry.desirability || 5,
    'desirability': entry.desirability || 5,
    'date-added': new Date().toISOString(),
  };

  // Add image URL if we have one
  if(imageUrl){
    fieldData['card-photo'] = { url: imageUrl };
  }

  try{
    const res = await fetch(`https://api.webflow.com/v2/collections/${WF_COLLECTION_ID}/items`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${localStorage.getItem('lba_wf_token')||''}`,
        'accept': 'application/json'
      },
      body: JSON.stringify({ fieldData, isDraft: false, isArchived: false })
    });

    if(res.ok){
      const data = await res.json();
      // Also publish it
      await fetch(`https://api.webflow.com/v2/collections/${WF_COLLECTION_ID}/items/publish`, {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${localStorage.getItem('lba_wf_token')||''}` },
        body: JSON.stringify({ itemIds: [data.id] })
      });
      return data.id;
    }
  }catch(e){ console.log('CMS sync failed:', e); }
  return null;
}

function capture(){
  const vw=video.videoWidth||1280,vh=video.videoHeight||720;
  canvas.width=1024;canvas.height=Math.round(1024*vh/vw);
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',.9).split(',')[1];
}
async function callClaude(msgs,maxTok){
  const key=localStorage.getItem('lba_k');
  const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTok||3000,messages:msgs})});
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'HTTP '+res.status);}
  return(await res.json()).content[0].text;
}

async function scanFront(img){
  const hs=document.getElementById('hstatus');
  const prompt=`You are an expert collectibles identifier. Examine this image.

Check for GRADED SLAB first — PSA=red/blue/white label, BGS=black label with subgrades, CGC=yellow/orange, SGC=red label.

STEP 1 — READ ALL TEXT: name, card number, set, year, cert number, grade, serial number.
STEP 2 — VISUAL: border color, foil, holo, slab label, artwork style.
STEP 3 — COMBINE.

Return ONLY raw JSON array, no markdown:
[{"name":"exact name","game":"Pokemon TCG|Magic: The Gathering|Yu-Gi-Oh!|Sports Card|Comic|PSA Slab|BGS Slab|CGC Slab|SGC Slab|Other TCG","sport":"Baseball|Basketball|Football|Hockey|Soccer|null","player":"player name or null","team":"team or null","year":"year","card_number":"# or null","manufacturer":"Topps|Panini|Upper Deck|Bowman|Pokemon Company|Wizards|Konami|Marvel|DC|Image|Other","publisher":"publisher if comic","issue":"issue # if comic","set_name":"exact set","parallel":"Base|Chrome|Prizm|Silver Prizm|Gold Refractor|Red Prizm|Blue|Green|Orange|Holo|Reverse Holo|Full Art|Alt Art|Borderless|Showcase|Extended Art|Etched Foil|Serialized|1st Edition|Promo|Rainbow Rare|Secret Rare|Special Illustration Rare|Auto|Relic|Standard|Variant|Virgin|Textless|Sketch|Foil|Newsstand","serial_number":"/99 or null","grading_company":"PSA|BGS|CGC|SGC|null","grade":"10|9.5|9|8.5|null","cert_number":"cert # or null","subgrades":{"centering":"9.5","surface":"9","corners":"9.5","edges":"9"},"pop_this_grade":450,"pop_higher":120,"is_black_label":false,"is_rookie":true,"is_key":false,"key_notes":"why notable or null","confidence":"high|medium|low","confidence_reason":"brief","desirability":7,"trend":"up|down|flat","trend_reason":"brief","cx":50,"cy":50,"printings":[{"set":"set","variant":"variant","year":"year","numbered":"/99 or null","mid":5.00,"low":2.00,"high":10.00}],"comps":[{"desc":"comp description","price":8.50},{"desc":"comp","price":7.00},{"desc":"comp","price":9.50}]}]

For virgin/textless comics: identify from artwork, character, art style only. Include ALL printings. Max 4. [] if none.`;

  const text=await callClaude([{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}},{type:'text',text:prompt}]}],4000);
  const items=JSON.parse(text.replace(/```json|```/g,'').trim());
  if(Array.isArray(items)&&items.length){
    if(auto)clearAll();
    for(const item of items){
      const stock=checkStock(item);
      const isTCG=['Pokemon TCG','Magic: The Gathering','Yu-Gi-Oh!','Other TCG'].includes(item.game);
      let apiPrintings=null,imgUrl=null,bestMatchIdx=0;
      if(isTCG){
        const fetched=await fetchAllPrintings(item);
        if(fetched.printings&&fetched.printings.length){
          apiPrintings=fetched.printings;
          bestMatchIdx=fetched.bestMatchIdx;
          imgUrl=fetched.imageUrl;

      }
      addBubble(item,stock,imgUrl,apiPrintings,bestMatchIdx);
    }
    hs.textContent=items.length+' FOUND';drawLines();
  }else{hs.textContent='NONE';toast('Nothing detected — get closer');}
}

function getType(item){
  const g=item.game||'';
  if(g.includes('PSA'))return 'psa';
  if(g.includes('BGS'))return 'bgs';
  if(g.includes('CGC'))return 'cgc';
  if(g.includes('SGC'))return 'sgc';
  if(g==='Sports Card')return 'sports';
  if(g==='Comic')return 'comic';
  return 'tcg';
}
function checkStock(item){
  const inv=JSON.parse(localStorage.getItem('lba_inventory')||'[]');
  const name=(item.player||item.name||'').toLowerCase().split(' ')[0];
  const m=inv.filter(i=>(i.name||'').toLowerCase().includes(name)||name.includes((i.name||'').toLowerCase().split(' ')[0]));
  return{inStock:m.filter(i=>i.status==='in_stock').length,totalSold:m.filter(i=>i.status==='sold').length};
}

function addBubble(item,stock,imgUrl,apiPrintings,bestMatchIdx){
  const W=window.innerWidth,H=window.innerHeight;
  const cx=(item.cx/100)*W,cy=(item.cy/100)*H;
  const id='b'+Date.now()+Math.random().toString(36).slice(2,5);
  // Merge: API printings override Claude's guesses when available.
  // Best match index pre-selects the most likely printing.
  const prints = (apiPrintings && apiPrintings.length) ? apiPrintings : (item.printings||[]);
  const bmi = bestMatchIdx||0;
  const first=prints[bmi]||prints[0]||{mid:0,low:0,high:0,set:'Unknown',variant:''};
  const ct=getType(item);
  const isSlab=['psa','bgs','cgc','sgc'].includes(ct);
  const el=document.createElement('div');
  el.className='bub '+ct;el.id=id;el._prints=prints;el._item=item;el._ct=ct;el._imgUrl=imgUrl||null;el._apiPrintings=apiPrintings||null;el._bmi=bmi||0;

  const ds=Math.min(10,Math.max(1,item.desirability||5));
  const dc=ds>=7?'dhi':ds>=4?'dmd':'dlo';
  const tc=item.trend==='up'?'tup':item.trend==='down'?'tdn':'tfl';
  const ti=item.trend==='up'?'↑ ':item.trend==='down'?'↓ ':'→ ';
  const tags=[];
  if(item.is_rookie)tags.push('<span class="tag rc">RC</span>');
  if(item.is_key)tags.push('<span class="tag key">KEY</span>');
  if(ds>=8)tags.push('<span class="tag hot">HOT</span>');
  if(item.is_black_label)tags.push('<span class="tag key" style="color:#fff;border-color:#aaa">BLACK LABEL</span>');

  // Card image
  const imgHtml=imgUrl
    ?`<img class="card-img" src="${imgUrl}" alt="${item.name}" loading="lazy" onerror="this.style.display='none'">`
    :(ct==='tcg'?`<div class="card-img-placeholder">NO IMAGE</div>`:'');

  // Slab display
  let slabHtml='';
  if(isSlab&&item.grade){
    let sgHtml='';
    if(ct==='bgs'&&item.subgrades){const sg=item.subgrades;sgHtml=`<div class="slab-subgrades">${sg.centering?`<div class="sg"><div class="sg-label">CENT</div><div class="sg-val">${sg.centering}</div></div>`:''} ${sg.surface?`<div class="sg"><div class="sg-label">SURF</div><div class="sg-val">${sg.surface}</div></div>`:''} ${sg.corners?`<div class="sg"><div class="sg-label">CORN</div><div class="sg-val">${sg.corners}</div></div>`:''} ${sg.edges?`<div class="sg"><div class="sg-label">EDGE</div><div class="sg-val">${sg.edges}</div></div>`:''}</div>`;}
    let popHtml='';
    if(item.pop_this_grade||item.pop_higher){const isRare=(item.pop_this_grade||999)<100;popHtml=`<div class="pop-row"><div><div class="pop-label">POP ${(item.grading_company||ct).toUpperCase()} ${item.grade}</div><div class="pop-val ${isRare?'rare':'common'}">${item.pop_this_grade||'?'}</div></div>${item.pop_higher?`<div><div class="pop-label">POP HIGHER</div><div class="pop-val">${item.pop_higher}</div></div>`:''}</div>`;}
    slabHtml=`<div class="slab-grade ${ct}"><div class="grade-num ${ct}">${item.grade}</div><div class="grade-info"><div class="grade-co ${ct}">${(item.grading_company||ct).toUpperCase()} GRADE</div>${item.cert_number?`<div class="grade-cert">CERT #${item.cert_number}</div>`:''}</div></div>${sgHtml}${popHtml}`;
  }

  const compsHtml=item.comps&&item.comps.length?`<div class="comps"><div class="comps-hdr">${isSlab?'GRADED SALES':ct==='sports'?'EBAY SOLD COMPS':'RECENT SALES'}</div>${item.comps.slice(0,3).map(c=>`<div class="comp-row"><span class="comp-d">${c.desc}</span><span class="comp-p">$${Number(c.price).toFixed(2)}</span></div>`).join('')}</div>`:'';
  const printOpts=prints.map((p,i)=>`<option value="${i}"${i===bmi?' selected':''}>` + (i===bmi?'★ ':'')+`${p.set}${p.variant&&p.variant!=='Base'?' · '+p.variant:''}${p.numbered?' '+p.numbered:''}${p.year?' ('+p.year+')':''}</option>`).join('');
  const displayName=item.player||item.name;
  const subParts=[];
  if(item.team)subParts.push(item.team);
  if(item.year&&!isSlab)subParts.push(item.year);
  if(item.set_name&&!isSlab)subParts.push(item.set_name);
  if(item.parallel&&item.parallel!=='Base')subParts.push(item.parallel);
  if(item.serial_number)subParts.push(item.serial_number);
  if(item.card_number&&!isSlab)subParts.push('#'+item.card_number);
  if(item.publisher)subParts.push(item.publisher);
  if(item.issue)subParts.push(item.issue);
  const confCls=item.confidence==='high'?'c-hi':item.confidence==='low'?'c-lo':'c-md';
  const si=stock.inStock;
  const sc=si>2?'sn-in':si>0?'sn-low':'sn-no';

  let actLinks='';
  if(isSlab){const q=encodeURIComponent((item.player||item.name)+' '+(item.grading_company||'')+' '+item.grade);actLinks=`<a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1" target="_blank">eBay Sold ↗</a>
              <a class="bact a-ebay" style="background:rgba(72,202,228,.08);color:var(--blue);border-color:rgba(72,202,228,.2)" href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(item.player||item.name)}&LH_Sold=1&LH_Complete=1" target="_blank">All Sales ↗</a>
              ${item.cert_number&&ct==='psa'?`<a class="bact a-psa" href="https://www.psacard.com/cert/${item.cert_number}" target="_blank">PSA Verify ↗</a>`:''}
              ${item.cert_number&&ct==='bgs'?`<a class="bact a-bgs" href="https://www.beckett.com/grading/cert?cert=${item.cert_number}" target="_blank">BGS Verify ↗</a>`:''}`;
  }
  else if(ct==='sports'){
    const qBase=encodeURIComponent((item.player||item.name)+' '+(item.year||''));
    const qFull=encodeURIComponent((item.player||item.name)+' '+(item.year||'')+' '+((item.parallel&&item.parallel!=='Base')?item.parallel:''));
    actLinks=`<a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${qFull}&LH_Sold=1&LH_Complete=1" target="_blank">eBay Sold ↗</a>
      <a class="bact a-ebay" style="background:rgba(72,202,228,.08);color:var(--blue);border-color:rgba(72,202,228,.2)" href="https://www.ebay.com/sch/i.html?_nkw=${qBase}&LH_Sold=1&LH_Complete=1" target="_blank">Base Sales ↗</a>`;
  }
  else if(ct==='comic'){const qgc=encodeURIComponent((item.name||'')+' '+(item.issue||''));actLinks=`<a class="bact a-gcol" href="https://www.gocollect.com/search/?q=${qgc}" target="_blank">GoCollect ↗</a><a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${qgc}&LH_Sold=1" target="_blank">eBay ↗</a>`;}
  else{const qt=encodeURIComponent((item.name||'')+' '+(item.set_name||''));actLinks=`<a class="bact a-tcg" id="bt${id}" href="https://www.tcgplayer.com/search/all/product?q=${qt}" target="_blank">TCGPlayer ↗</a><a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(item.name||'')}&LH_Sold=1" target="_blank">eBay ↗</a>`;}

  el.innerHTML=`
    <button class="bx" onclick="rmBub('${id}')">×</button>
    ${imgHtml}
    <div class="btype ${ct}">${item.game}</div>
    <div class="bname">${displayName}</div>
    ${subParts.length?`<div class="bsub">${subParts.join(' · ')}</div>`:''}
    ${slabHtml}
    <div class="stock-row"><span class="stock-num ${sc}">${si}</span><div><div class="stock-label">${si>0?si+' IN STOCK':'NOT IN STOCK'}</div>${stock.totalSold>0?`<div class="stock-label">${stock.totalSold} SOLD</div>`:''}</div></div>
    <span class="conf ${confCls}">${item.confidence} — ${(item.confidence_reason||'').substring(0,30)}</span>
    <div class="drow"><span class="dscore ${dc}">${ds}/10</span><span class="trend ${tc}">${ti}${(item.trend_reason||'').substring(0,20)}</span></div>
    ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}
    ${item.key_notes?`<div class="keynotes">${item.key_notes}</div>`:''}
    ${(()=>{
      const hasReal = first.hasRealPrice || (first.mid>0 && apiPrintings);
      const isSportsOrComic = ct==='sports'||ct==='comic';
      if(isSportsOrComic){
        return `<div class="prow"><span class="bprice ${ct}" style="font-size:13px;color:rgba(255,255,255,.4)">SEE COMPS ↓</span></div>
        <div class="brange" id="br${id}" style="color:rgba(255,255,255,.25)">Tap eBay Sold for real prices</div>`;
      }
      if(hasReal){
        return `<div class="prow"><span class="bprice ${ct}" id="bp${id}">$${Number(first.mid).toFixed(2)}</span><span style="font-family:monospace;font-size:8px;color:rgba(0,255,179,.5)">LIVE</span></div>
        <div class="brange" id="br${id}">$${Number(first.low).toFixed(2)} – $${Number(first.high).toFixed(2)} NM</div>`;
      }
      return `<div class="prow"><span class="bprice ${ct}" style="font-size:13px;color:rgba(255,255,255,.4)">NO PRICE DATA</span></div>
      <div class="brange" id="br${id}" style="color:rgba(255,255,255,.2)">Select printing for price</div>`;
    })()}
    ${apiPrintings?`<div style="font-family:monospace;font-size:8px;color:rgba(0,255,179,.5);margin-bottom:4px">★ best match · ${prints.length} printings found</div>`:''}
    ${compsHtml}
    ${!isSlab?`<div class="bsels"><select class="bsel" id="ps${id}" onchange="chPrint('${id}')" data-bmi="${bmi}">${printOpts}</select><select class="bsel" id="cs${id}" onchange="chCond('${id}')">${Object.keys(CM).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="bconds">${Object.keys(CM).map((c,i)=>`<span class="bcp${i===0?' on':''}" onclick="cpill('${id}',this,'${c}')">${c}</span>`).join('')}</div>`:''}
    <div class="bacts" id="acts${id}">${actLinks}<button class="bact a-add" onclick="showAddForm('${id}')">+ Add to Inventory</button>${si>0?`<button class="bact a-sell" onclick="showSellForm('${id}')">✓ Mark as Sold</button>`:''}</div>`;

  const bw=192,bh=isSlab?480:540;
  let left=cx-bw/2,top=cy-bh-24;
  if(top<60)top=cy+20;
  left=Math.max(6,Math.min(left,W-bw-6));
  top=Math.max(60,Math.min(top,H-bh-90));
  el.style.left=left+'px';el.style.top=top+'px';
  document.body.appendChild(el);
  bubs.push({id,el,ax:cx,ay:cy,ct});
}

window.chPrint=function(id){const el=document.getElementById(id);if(!el)return;const pi=parseInt(document.getElementById('ps'+id).value);const cond=document.getElementById('cs'+id)?.value||'NM';if(!isNaN(pi))updatePrice(id,el._prints[pi],cond);};
window.chCond=function(id){const el=document.getElementById(id);if(!el)return;const pi=parseInt(document.getElementById('ps'+id)?.value)||0;const cond=document.getElementById('cs'+id).value;el.querySelectorAll('.bcp').forEach(p=>p.classList.toggle('on',p.textContent===cond));updatePrice(id,el._prints[pi]||el._prints[0],cond);};
window.cpill=function(id,pill,cond){const el=document.getElementById(id);if(!el)return;const pi=parseInt(document.getElementById('ps'+id)?.value)||0;const cs=document.getElementById('cs'+id);if(cs)cs.value=cond;el.querySelectorAll('.bcp').forEach(p=>p.classList.remove('on'));pill.classList.add('on');updatePrice(id,el._prints[pi]||el._prints[0],cond);};
function updatePrice(id,p,cond){
  if(!p)return;
  const m=CM[cond]||1;
  const bpEl=document.getElementById('bp'+id);
  const brEl=document.getElementById('br'+id);
  if(bpEl&&p.hasRealPrice&&p.mid>0){
    bpEl.textContent='$'+(p.mid*m).toFixed(2);
    if(brEl)brEl.textContent='$'+(p.low*m).toFixed(2)+' – $'+(p.high*m).toFixed(2)+' '+cond;
  } else if(bpEl) {
    bpEl.textContent='No price data';
    bpEl.style.fontSize='11px';bpEl.style.color='rgba(255,255,255,.4)';
    if(brEl)brEl.textContent='Check TCGPlayer for current price';
  }
  // Update TCGPlayer link to direct URL for this printing if available
  const bt=document.getElementById('bt'+id);
  if(bt){
    if(p.tcgUrl){bt.href=p.tcgUrl;bt.textContent='TCGPlayer ↗';}
    else{const n=document.getElementById(id)?.querySelector('.bname')?.textContent||'';bt.href='https://www.tcgplayer.com/search/all/product?q='+encodeURIComponent(n+' '+(p.set||'')+' '+(p.variant||''));bt.textContent='TCGPlayer Search ↗';}
  }
  // Update Scryfall link if available
  const sf=document.getElementById('sf'+id);
  if(sf&&p.scryfallUrl)sf.href=p.scryfallUrl;
}

window.showAddForm=function(id){
  const el=document.getElementById(id);if(!el)return;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const print=el._prints[pi]||el._prints[0]||{};
  document.getElementById('acts'+id).innerHTML=`
    <div class="inv-form">
      <div class="inv-form-title">+ ADD TO INVENTORY</div>
      <div class="inv-label">Your Cost ($)</div>
      <input class="inv-inp" id="cost${id}" type="number" placeholder="0.00" step="0.01" oninput="previewProfit('${id}')">
      <div class="inv-label">Quantity</div>
      <input class="inv-inp" id="qty${id}" type="number" value="1" min="1">
      <div class="inv-label">Storage Location</div>
      <input class="inv-inp" id="loc${id}" type="text" placeholder="Bin A3, Showcase...">
      <div id="pp${id}"></div>
    </div>
    <div class="bacts">
      <button class="bact a-confirm" onclick="confirmAdd('${id}')">SAVE + SYNC</button>
      <button class="bact a-cancel" onclick="resetActs('${id}')">Cancel</button>
    </div>`;
};

window.previewProfit=function(id){
  const el=document.getElementById(id);if(!el)return;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const print=el._prints[pi]||el._prints[0]||{};
  const cost=parseFloat(document.getElementById('cost'+id)?.value)||0;
  const mkt=Number(print.mid||0);const profit=mkt-cost;
  const pp=document.getElementById('pp'+id);
  if(pp&&cost>0)pp.innerHTML=`<div class="profit-preview ${profit>=0?'profit-pos':'profit-neg'}">Est Profit: $${profit.toFixed(2)}</div>`;
};

window.confirmAdd=async function(id){
  const el=document.getElementById(id);if(!el||!el._item)return;
  const item=el._item,ct=el._ct;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const cond=document.getElementById('cs'+id)?.value||'NM';
  const print=el._prints[pi]||el._prints[0]||{};
  const cost=parseFloat(document.getElementById('cost'+id)?.value)||0;
  const qty=parseInt(document.getElementById('qty'+id)?.value)||1;
  const loc=document.getElementById('loc'+id)?.value||'';

  // Show syncing status
  const acts=document.getElementById('acts'+id);
  acts.innerHTML=`<div class="cms-status cms-syncing">⟳ SAVING TO INVENTORY...</div>`;

  for(let i=0;i<qty;i++){
    const entry={
      id:'scan_'+Date.now()+'_'+i,
      name:item.player||item.name,
      category:ct==='sports'?'Sports':ct==='comic'?'Comic':['psa','bgs','cgc','sgc'].includes(ct)?'Graded':'TCG',
      set:print.set||item.set_name||'',
      variant:print.variant||item.parallel||'',
      condition:cond,year:item.year||'',team:item.team||'',
      player:item.player||'',manufacturer:item.manufacturer||'',
      publisher:item.publisher||'',issue:item.issue||'',
      card_number:item.card_number||'',serial_number:item.serial_number||'',
      grading_company:item.grading_company||'',grade:item.grade||'',
      cert_number:item.cert_number||'',sport:item.sport||'',
      is_rookie:item.is_rookie||false,is_key:item.is_key||false,
      key_notes:item.key_notes||'',cost,
      market:Number(print.mid)||0,price:Number(print.mid)||0,
      location:loc,desirability:item.desirability||5,
      status:'in_stock',addedAt:new Date().toISOString(),
      scannedFrom:'AR Scanner'
    };

    // 1. Save to localStorage (works for this device immediately)
    const inv=JSON.parse(localStorage.getItem('lba_inventory')||'[]');
    inv.unshift(entry);localStorage.setItem('lba_inventory',JSON.stringify(inv));

    // 2. Sync to Webflow CMS (persists across all devices)
    const cmsId=await syncToWebflowCMS(entry, el._imgUrl);

    if(cmsId){
      entry.cmsId=cmsId;
      inv[0].cmsId=cmsId;
      localStorage.setItem('lba_inventory',JSON.stringify(inv));
    }
  }

  const profit=(Number(print.mid||0)-cost).toFixed(2);
  const hasCMS=!!localStorage.getItem('lba_wf_token');
  acts.innerHTML=`
    <div class="cms-status ${hasCMS?'cms-synced':'cms-syncing'}">
      ${hasCMS?'✓ SAVED + SYNCED TO WEBFLOW':'✓ SAVED LOCALLY'}
    </div>
    <div class="bact a-added">Cost $${cost.toFixed(2)} · Est Profit $${profit}</div>
    <button class="bact a-sell" onclick="showSellForm('${id}')">✓ Mark as Sold</button>`;

  toast('Added '+(qty>1?qty+'x ':'')+((item.player||item.name)||'item')+(hasCMS?' → Webflow CMS':''));
};

window.showSellForm=function(id){
  const el=document.getElementById(id);if(!el)return;
  const inv=JSON.parse(localStorage.getItem('lba_inventory')||'[]');
  const name=(el._item.player||el._item.name||'').toLowerCase().split(' ')[0];
  const inStock=inv.filter(i=>i.status==='in_stock'&&(i.name||'').toLowerCase().includes(name));
  const avgCost=inStock.length?inStock.reduce((a,i)=>a+(i.cost||0),0)/inStock.length:0;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const print=el._prints[pi]||el._prints[0]||{};
  document.getElementById('acts'+id).innerHTML=`
    <div class="sold-form">
      <div class="sold-form-title">✓ RECORD SALE</div>
      ${inStock.length?`<div style="font-family:monospace;font-size:9px;color:rgba(255,255,255,.4);margin-bottom:6px">${inStock.length} in stock · Avg cost $${avgCost.toFixed(2)}</div>`:''}
      <div class="inv-label">Sale Price ($)</div>
      <input class="inv-inp" id="sale${id}" type="number" placeholder="${Number(print.mid||0).toFixed(2)}" step="0.01" oninput="previewSale('${id}',${avgCost})">
      <div class="inv-label">Channel</div>
      <select class="bsel" id="chan${id}" style="margin-bottom:4px">
        <option>In-Store</option><option>eBay</option><option>Whatnot</option><option>Website</option>
      </select>
      <div id="sp${id}"></div>
    </div>
    <div class="bacts">
      <button class="bact a-confirm" style="background:var(--red)" onclick="confirmSell('${id}',${avgCost})">RECORD SALE</button>
      <button class="bact a-cancel" onclick="resetActs('${id}')">Cancel</button>
    </div>`;
};

window.previewSale=function(id,avgCost){const sale=parseFloat(document.getElementById('sale'+id)?.value)||0;const profit=sale-avgCost;const sp=document.getElementById('sp'+id);if(sp&&sale>0)sp.innerHTML=`<div class="profit-preview ${profit>=0?'profit-pos':'profit-neg'}">Profit: $${profit.toFixed(2)}</div>`;};

window.confirmSell=async function(id,avgCost){
  const el=document.getElementById(id);if(!el||!el._item)return;
  const salePrice=parseFloat(document.getElementById('sale'+id)?.value)||0;
  if(!salePrice){toast('Enter a sale price');return;}
  const channel=document.getElementById('chan'+id)?.value||'In-Store';
  const item=el._item;
  const name=(item.player||item.name||'').toLowerCase().split(' ')[0];
  const inv=JSON.parse(localStorage.getItem('lba_inventory')||'[]');
  let soldItem=null;
  for(let i=0;i<inv.length;i++){
    if(inv[i].status==='in_stock'&&(inv[i].name||'').toLowerCase().includes(name)){
      inv[i].status='sold';inv[i].soldAt=new Date().toISOString();
      inv[i].salePrice=salePrice;inv[i].saleChannel=channel;
      inv[i].profit=salePrice-(inv[i].cost||avgCost||0);
      soldItem=inv[i];break;
    }
  }
  if(!soldItem){
    const e={id:'scan_'+Date.now(),name:item.player||item.name,category:el._ct==='sports'?'Sports':el._ct==='comic'?'Comic':'TCG',cost:avgCost,salePrice,profit:salePrice-avgCost,saleChannel:channel,status:'sold',soldAt:new Date().toISOString(),addedAt:new Date().toISOString()};
    inv.unshift(e);soldItem=e;
  }
  const sales=JSON.parse(localStorage.getItem('lba_sales')||'[]');
  sales.unshift({id:'sale_'+Date.now(),name:item.player||item.name,category:el._ct==='sports'?'Sports':el._ct==='comic'?'Comic':'TCG',cost:avgCost,salePrice,profit:salePrice-avgCost,channel,date:new Date().toISOString()});
  localStorage.setItem('lba_sales',JSON.stringify(sales));
  localStorage.setItem('lba_inventory',JSON.stringify(inv));

  // Update Webflow CMS if item has a CMS ID
  if(soldItem&&soldItem.cmsId&&localStorage.getItem('lba_wf_token')){
    try{
      await fetch(`https://api.webflow.com/v2/collections/${WF_COLLECTION_ID}/items/${soldItem.cmsId}`,{
        method:'PATCH',
        headers:{'Content-Type':'application/json','Authorization':`Bearer ${localStorage.getItem('lba_wf_token')}`},
        body:JSON.stringify({fieldData:{'status':'Sold','sale-price':salePrice,'profit':salePrice-avgCost,'sale-channel':channel,'date-sold':new Date().toISOString(),'quantity-in-stock':0,'quantity-sold':1}})
      });
    }catch(e){console.log('CMS update failed',e);}
  }

  const profit=salePrice-avgCost;
  document.getElementById('acts'+id).innerHTML=`<div class="bact a-added">✓ SOLD $${salePrice.toFixed(2)} via ${channel}</div><div class="profit-preview ${profit>=0?'profit-pos':'profit-neg'}">Profit: $${profit.toFixed(2)}</div>`;
  toast('Sold! Profit: $'+profit.toFixed(2));
};

window.resetActs=function(id){
  const el=document.getElementById(id);if(!el||!el._item)return;
  const item=el._item,ct=el._ct,stock=checkStock(item),si=stock.inStock;
  let links='';
  if(ct==='sports'){const q=encodeURIComponent((item.player||item.name)+' '+(item.year||''));links=`<a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1" target="_blank">eBay Sold ↗</a><a class="bact a-ebay" style="background:rgba(72,202,228,.08);color:var(--blue);border-color:rgba(72,202,228,.2)" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1" target="_blank">eBay Base ↗</a>`;}
  else if(ct==='comic'){const q=encodeURIComponent((item.name||'')+' '+(item.issue||''));links=`<a class="bact a-gcol" href="https://www.gocollect.com/search/?q=${q}" target="_blank">GoCollect ↗</a><a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1" target="_blank">eBay ↗</a>`;}
  else if(['psa','bgs','cgc','sgc'].includes(ct)){const q=encodeURIComponent((item.player||item.name)+' '+(item.grading_company||'')+' '+(item.grade||''));links=`<a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1" target="_blank">eBay ↗</a><a class="bact a-ebay" style="background:rgba(72,202,228,.08);color:var(--blue);border-color:rgba(72,202,228,.2)" href="https://www.ebay.com/sch/i.html?_nkw=${encodeURIComponent(item.player||item.name)}&LH_Sold=1&LH_Complete=1" target="_blank">All Sales ↗</a>`;}
  else{
    const q=encodeURIComponent((item.name||'')+' '+(item.set_name||item.game||''));
    const qe=encodeURIComponent((item.name||'')+' '+(item.set_name||'')+' '+(item.game||''));
    links=`<a class="bact a-tcg" href="https://www.tcgplayer.com/search/all/product?q=${q}" target="_blank">TCGPlayer Search ↗</a><a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${qe}&LH_Sold=1&LH_Complete=1" target="_blank">eBay Sold ↗</a>`;
  }
  document.getElementById('acts'+id).innerHTML=links+`<button class="bact a-add" onclick="showAddForm('${id}')">+ Add to Inventory</button>${si>0?`<button class="bact a-sell" onclick="showSellForm('${id}')">✓ Mark as Sold</button>`:''}`;
};

function showBackStandalone(back){
  const id='back_'+Date.now();const el=document.createElement('div');el.className='bub';el.id=id;el.style.left='10px';el.style.top='80px';
  const statsHtml=back.stats&&back.stats.length?back.stats.slice(0,6).map(s=>`<div class="backinfo-row"><span>${s.label}</span><span class="backinfo-val">${s.value}</span></div>`).join(''):'';
  el.innerHTML=`<button class="bx" onclick="document.getElementById('${id}').remove()">×</button><div class="btype tcg">CARD BACK</div><div class="backinfo"><div class="backinfo-hdr">⟳ BACK OF CARD</div>${back.serial_number?`<div class="backinfo-row"><span>Serial</span><span class="backinfo-val">${back.serial_number}</span></div>`:''}${back.print_run?`<div class="backinfo-row"><span>Print Run</span><span class="backinfo-val">${back.print_run}</span></div>`:''}${back.auto_authenticated?`<div class="backinfo-row"><span>Auto</span><span class="backinfo-val" style="color:var(--g)">✓ Auth</span></div>`:''}${back.rookie_stamp?`<div class="backinfo-row"><span>RC</span><span class="backinfo-val" style="color:var(--gold)">✓ YES</span></div>`:''}${statsHtml}${back.notes?`<div style="font-family:monospace;font-size:8px;color:rgba(255,255,255,.4);margin-top:4px">${back.notes.substring(0,100)}</div>`:''}</div>`;
  document.body.appendChild(el);bubs.push({id,el,ax:window.innerWidth/2,ay:window.innerHeight/2,ct:'tcg'});drawLines();
}
function addBackInfo(bubId,back){
  const el=document.getElementById(bubId);if(!el)return;el.querySelector('.backinfo')?.remove();
  const statsHtml=back.stats&&back.stats.length?back.stats.slice(0,6).map(s=>`<div class="backinfo-row"><span>${s.label}</span><span class="backinfo-val">${s.value}</span></div>`).join(''):'';
  const bi=document.createElement('div');bi.className='backinfo';
  bi.innerHTML=`<div class="backinfo-hdr">⟳ BACK OF CARD</div>${back.serial_number?`<div class="backinfo-row"><span>Serial</span><span class="backinfo-val">${back.serial_number}</span></div>`:''}${back.print_run?`<div class="backinfo-row"><span>Print Run</span><span class="backinfo-val">${back.print_run}</span></div>`:''}${back.auto_authenticated?`<div class="backinfo-row"><span>Auto</span><span class="backinfo-val" style="color:var(--g)">✓ Auth</span></div>`:''}${back.rookie_stamp?`<div class="backinfo-row"><span>RC</span><span class="backinfo-val" style="color:var(--gold)">✓</span></div>`:''}${statsHtml}${back.notes?`<div style="font-family:monospace;font-size:8px;color:rgba(255,255,255,.4);margin-top:3px">${back.notes.substring(0,80)}</div>`:''}`;
  const acts=el.querySelector('.bacts');if(acts)el.insertBefore(bi,acts);else el.appendChild(bi);
}
window.rmBub=function(id){document.getElementById(id)?.remove();bubs=bubs.filter(b=>b.id!==id);drawLines();};
function clearAll(){bubs.forEach(b=>b.el?.remove());bubs=[];if(octx)octx.clearRect(0,0,oc.width,oc.height);}
function drawLines(){
  if(!octx)return;octx.clearRect(0,0,oc.width,oc.height);
  const lc={tcg:'rgba(0,255,179,.35)',sports:'rgba(255,209,102,.35)',comic:'rgba(199,125,255,.35)',psa:'rgba(230,57,70,.4)',bgs:'rgba(180,180,180,.3)',cgc:'rgba(244,162,97,.4)',sgc:'rgba(255,149,0,.4)'};
  const dc={tcg:'rgba(0,255,179,.7)',sports:'rgba(255,209,102,.7)',comic:'rgba(199,125,255,.7)',psa:'rgba(230,57,70,.8)',bgs:'rgba(180,180,180,.7)',cgc:'rgba(244,162,97,.8)',sgc:'rgba(255,149,0,.8)'};
  bubs.forEach(b=>{
    if(!b.el?.parentNode)return;
    const r=b.el.getBoundingClientRect();
    octx.beginPath();octx.moveTo(r.left+r.width/2,r.bottom);octx.lineTo(b.ax,b.ay);
    octx.strokeStyle=lc[b.ct]||lc.tcg;octx.lineWidth=1.5;octx.setLineDash([4,4]);octx.stroke();
    octx.beginPath();octx.arc(b.ax,b.ay,6,0,Math.PI*2);
    octx.fillStyle=dc[b.ct]||dc.tcg;octx.fill();octx.setLineDash([]);
  });
}
function toggleAuto(){
  auto=!auto;const ab=document.getElementById('autobitn'),sb=document.getElementById('scanbtn');
  if(auto){ab.classList.add('on');ab.textContent='STOP';sb.innerHTML='AUTO ON';sb.className='autoon';autoT=setInterval(()=>{if(!scanning)doScan();},5500);doScan();}
  else{clearInterval(autoT);ab.classList.remove('on');ab.textContent='AUTO';sb.innerHTML='&#9654; SCAN CARDS';sb.className='';}
}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4000);}
</script>
