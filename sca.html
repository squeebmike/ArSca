<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LBA Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--g:#00ffb3;--gd:rgba(0,255,179,0.15);--gold:#ffd166;--red:#ff4d6d;--bg:#050507;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:#fff;}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
#canvas{display:none;}
#oc{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;}
#hud{position:fixed;top:0;left:0;right:0;z-index:30;padding:12px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;align-items:center;}
.hl{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;color:var(--g);letter-spacing:3px;text-shadow:0 0 16px var(--g);}
.hbtns{display:flex;gap:6px;align-items:center;}
#hstatus{font-family:monospace;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:1px;margin-right:4px;}
.hbtn{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:6px 12px;font-family:monospace;font-size:10px;cursor:pointer;letter-spacing:1px;}
.hbtn.on{color:var(--red);border-color:var(--red);}
#scanbar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:16px 16px 28px;background:linear-gradient(to top,rgba(0,0,0,.92) 60%,transparent);display:flex;flex-direction:column;align-items:center;gap:8px;}
#scanbtn{background:var(--g);color:#000;border:none;padding:18px 64px;font-family:'Orbitron',monospace;font-weight:900;font-size:16px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 32px rgba(0,255,179,.5);transition:all .15s;touch-action:manipulation;}
#scanbtn:active{transform:scale(.96);}
#scanbtn.reading{background:var(--gold);}
#scanbtn.auto{background:var(--red);}
.shint{font-family:monospace;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1px;}
#brackets{position:fixed;inset:0;z-index:4;pointer-events:none;}
.br{position:absolute;width:40px;height:40px;border-color:var(--g);border-style:solid;opacity:.6;}
.tl{top:28%;left:8%;border-width:2px 0 0 2px;}.tr{top:28%;right:8%;border-width:2px 2px 0 0;}
.bl{bottom:28%;left:8%;border-width:0 0 2px 2px;}.brr{bottom:28%;right:8%;border-width:0 2px 2px 0;}
#scanline{position:absolute;left:8%;right:8%;height:1.5px;background:linear-gradient(90deg,transparent,var(--g),transparent);box-shadow:0 0 8px var(--g);top:28%;animation:scan 2.5s ease-in-out infinite;}
@keyframes scan{0%{top:29%}48%{top:71%}52%{top:71%}100%{top:29%}}
.bub{position:fixed;background:rgba(5,5,7,.96);border:1.5px solid var(--g);padding:10px 12px;width:172px;z-index:20;box-shadow:0 0 16px rgba(0,255,179,.2);}
.bub::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--g),transparent);}
.bg{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:2px;color:var(--g);margin-bottom:2px;opacity:.7;}
.bn{font-size:13px;font-weight:600;color:#fff;margin-bottom:6px;padding-right:18px;line-height:1.2;}
.bp{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:var(--g);text-shadow:0 0 10px rgba(0,255,179,.4);line-height:1;}
.br2{font-family:monospace;font-size:9px;color:rgba(255,255,255,.3);margin-bottom:6px;}
.bsels{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
.bsel{width:100%;background:#0d0d0f;color:#fff;border:1px solid rgba(255,255,255,.12);padding:5px 7px;font-family:monospace;font-size:10px;outline:none;}
.bsel:focus{border-color:var(--g);}
.bconds{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px;}
.bcp{font-family:'Orbitron',monospace;font-size:7px;padding:2px 5px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4);cursor:pointer;letter-spacing:1px;}
.bcp.on{border-color:var(--g);color:var(--g);background:var(--gd);}
.btcg{display:block;background:rgba(0,255,179,.08);color:var(--g);font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;padding:5px 6px;text-decoration:none;text-align:center;border:1px solid rgba(0,255,179,.2);}
.bx{position:absolute;top:4px;right:6px;background:none;border:none;color:rgba(255,255,255,.25);font-size:14px;cursor:pointer;line-height:1;}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.95);border:1px solid rgba(0,255,179,.4);padding:9px 20px;font-family:monospace;font-size:11px;color:var(--g);z-index:200;white-space:nowrap;}
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<canvas id="oc"></canvas>
<div id="brackets">
  <div class="br tl"></div><div class="br tr"></div>
  <div class="br bl"></div><div class="br brr"></div>
  <div id="scanline"></div>
</div>
<div id="hud">
  <span class="hl">LBA</span>
  <div class="hbtns">
    <span id="hstatus">LIVE</span>
    <button class="hbtn" id="autobitn" onclick="toggleAuto()">AUTO</button>
    <button class="hbtn" onclick="clearAll()">CLEAR</button>
  </div>
</div>
<div id="scanbar">
  <button id="scanbtn" onclick="doScan()">&#9654; SCAN CARDS</button>
  <div class="shint">Point camera at cards then tap scan</div>
</div>
<script>
const KEY='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';
const CM={NM:1,LP:.8,MP:.64,HP:.4,DMG:.25};
let bubs=[],auto=false,autoT=null,scanning=false,octx=null;
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),oc=document.getElementById('oc');
function resizeOC(){oc.width=window.innerWidth;oc.height=window.innerHeight;}
window.addEventListener('resize',resizeOC);resizeOC();octx=oc.getContext('2d');
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false}).then(s=>{video.srcObject=s;video.play();}).catch(e=>toast('Camera: '+e.message));
function capture(){const vw=video.videoWidth||1280,vh=video.videoHeight||720;canvas.width=800;canvas.height=Math.round(800*vh/vw);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.82).split(',')[1];}
async function doScan(){
  if(scanning)return;scanning=true;
  const btn=document.getElementById('scanbtn'),hs=document.getElementById('hstatus');
  btn.textContent='READING...';btn.className='reading';hs.textContent='SCANNING...';
  try{
    const img=capture();
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':KEY,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:2000,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}},{type:'text',text:`Identify ALL trading cards visible in this image. Return ONLY a raw JSON array, no markdown:\n[{\n"name":"exact card name as printed",\n"game":"Pokemon TCG|Magic: The Gathering|Yu-Gi-Oh!|Sports Card|Other TCG",\n"cx":50,"cy":50,\n"printings":[{"set":"full set name","variant":"Base|Holo|Reverse Holo|Full Art|Alt Art|Borderless|Showcase|Extended Art|Etched Foil|Galaxy Foil|Textured Foil|Retro Frame|Serialized|1st Edition|Unlimited|Promo|Rainbow Rare|Secret Rare|Special Illustration Rare|Collector Booster|Buy-a-Box|Prerelease|Gold Border","year":"year if known","mid":5.00,"low":2.00,"high":10.00}]\n}]\nCRITICAL: Include EVERY known printing - all sets, all alt arts, ALL special variants, promos. For MTG: every set it appeared in, borderless, showcase, extended art, retro frame, serialized, collector booster exclusives, buy-a-box, prerelease. For Pokemon: every set, holo, reverse holo, full art, alt art, rainbow rare, gold rare, special illustration rare, japanese promos. For Yu-Gi-Oh: every set, secret rare, ultimate rare, ghost rare, starlight rare. For sports: base, all parallels, refractors, prizms, autos. cx/cy=card center percent 0-100. Max 5 cards. Empty [] if none.`}]}]})});
    if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'API '+res.status);}
    const data=await res.json();
    const cards=JSON.parse(data.content[0].text.replace(/```json|```/g,'').trim());
    if(Array.isArray(cards)&&cards.length){if(auto)clearAll();cards.forEach(c=>addBubble(c));hs.textContent=cards.length+' FOUND';drawLines();}
    else{hs.textContent='NONE';toast('No cards detected');}
  }catch(e){document.getElementById('hstatus').textContent='ERROR';toast('Error: '+e.message);}
  scanning=false;btn.innerHTML='&#9654; SCAN CARDS';btn.className='';
}
function addBubble(card){
  const W=window.innerWidth,H=window.innerHeight,cx=(card.cx/100)*W,cy=(card.cy/100)*H;
  const id='b'+Date.now()+Math.random().toString(36).slice(2,5);
  const prints=card.printings||[];const first=prints[0]||{mid:0,low:0,high:0,set:'Unknown',variant:''};
  const el=document.createElement('div');el.className='bub';el.id=id;el._prints=prints;
  const q=encodeURIComponent(card.name+' '+(first.set||''));
  el.innerHTML=`<button class="bx" onclick="rmBub('${id}')">×</button><div class="bg">${card.game||'CARD'}</div><div class="bn">${card.name}</div><div class="bp" id="bp${id}">$${first.mid.toFixed(2)}</div><div class="br2" id="br${id}">$${first.low.toFixed(2)} – $${first.high.toFixed(2)} NM</div><div class="bsels"><select class="bsel" id="ps${id}" onchange="chPrint('${id}')"><option value="">── Printing / Set ──</option>${prints.map((p,i)=>`<option value="${i}">${p.set}${p.variant&&p.variant!=='Base'?' · '+p.variant:''}${p.year?' ('+p.year+')':''}</option>`).join('')}</select><select class="bsel" id="cs${id}" onchange="chCond('${id}')">${Object.keys(CM).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="bconds">${Object.keys(CM).map((c,i)=>`<span class="bcp${i===0?' on':''}" onclick="cpill('${id}',this,'${c}')">${c}</span>`).join('')}</div><a class="btcg" id="bt${id}" href="https://www.tcgplayer.com/search/all/product?q=${q}" target="_blank">TCGPlayer ↗</a>`;
  const bw=172,bh=300;let left=cx-bw/2,top=cy-bh-24;
  if(top<60)top=cy+20;left=Math.max(6,Math.min(left,W-bw-6));top=Math.max(60,Math.min(top,H-bh-90));
  el.style.left=left+'px';el.style.top=top+'px';document.body.appendChild(el);
  bubs.push({id,el,ax:cx,ay:cy});
}
window.chPrint=function(id){const el=document.getElementById(id);if(!el)return;const pi=parseInt(document.getElementById('ps'+id).value);if(isNaN(pi))return;const cond=document.getElementById('cs'+id)?.value||'NM';updatePrice(id,el._prints[pi],cond);};
window.chCond=function(id){const el=document.getElementById(id);if(!el)return;const pi=parseInt(document.getElementById('ps'+id)?.value);const p=isNaN(pi)?el._prints[0]:el._prints[pi];const cond=document.getElementById('cs'+id).value;el.querySelectorAll('.bcp').forEach(x=>x.classList.toggle('on',x.textContent===cond));updatePrice(id,p,cond);};
window.cpill=function(id,pill,cond){const el=document.getElementById(id);if(!el)return;const pi=parseInt(document.getElementById('ps'+id)?.value);const p=isNaN(pi)?el._prints[0]:el._prints[pi];const cs=document.getElementById('cs'+id);if(cs)cs.value=cond;el.querySelectorAll('.bcp').forEach(x=>x.classList.remove('on'));pill.classList.add('on');updatePrice(id,p,cond);};
function updatePrice(id,p,cond){if(!p)return;const m=CM[cond]||1;const bp=document.getElementById('bp'+id),br=document.getElementById('br'+id),bt=document.getElementById('bt'+id);const name=document.getElementById(id)?.querySelector('.bn')?.textContent||'';if(bp)bp.textContent='$'+(p.mid*m).toFixed(2);if(br)br.textContent='$'+(p.low*m).toFixed(2)+' – $'+(p.high*m).toFixed(2)+' '+cond;if(bt)bt.href='https://www.tcgplayer.com/search/all/product?q='+encodeURIComponent(name+' '+p.set+' '+(p.variant||''));}
window.rmBub=function(id){document.getElementById(id)?.remove();bubs=bubs.filter(b=>b.id!==id);octx.clearRect(0,0,oc.width,oc.height);drawLines();};
function clearAll(){bubs.forEach(b=>b.el?.remove());bubs=[];octx.clearRect(0,0,oc.width,oc.height);}
function drawLines(){octx.clearRect(0,0,oc.width,oc.height);bubs.forEach(b=>{if(!b.el?.parentNode)return;const r=b.el.getBoundingClientRect();octx.beginPath();octx.moveTo(r.left+r.width/2,r.bottom);octx.lineTo(b.ax,b.ay);octx.strokeStyle='rgba(0,255,179,.35)';octx.lineWidth=1.5;octx.setLineDash([4,4]);octx.stroke();octx.beginPath();octx.arc(b.ax,b.ay,5,0,Math.PI*2);octx.fillStyle='rgba(0,255,179,.7)';octx.fill();octx.setLineDash([]);});}
function toggleAuto(){auto=!auto;const ab=document.getElementById('autobitn'),sb=document.getElementById('scanbtn');if(auto){ab.classList.add('on');ab.textContent='STOP';sb.innerHTML='AUTO ON';sb.className='auto';autoT=setInterval(()=>{if(!scanning)doScan();},4500);doScan();}else{clearInterval(autoT);ab.classList.remove('on');ab.textContent='AUTO';sb.innerHTML='&#9654; SCAN CARDS';sb.className='';}}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}
</script>
</body>
</html>
