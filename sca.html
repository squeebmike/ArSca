<!DOCTYPE html>
<html>
<head>
  <title>LBA Scanner</title>
</head>
<body>
  <h1>Scanner</h1>

  <label>Worker URL:</label><br>
  <input id="proxy" style="width:400px"><br><br>

  <label>Webflow Token (optional):</label><br>
  <input id="token" style="width:400px"><br><br>

  <label>Collection ID:</label><br>
  <input id="collection" style="width:400px"><br><br>

  <label>Item Name:</label><br>
  <input id="name"><br><br>

  <button onclick="addItem()">Add Item</button>

  <pre id="output"></pre>

  <script>
    function getHeaders() {
      const token = document.getElementById('token').value;
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['X-LBA-Token'] = token;
      return headers;
    }

    async function addItem() {
      const proxy = document.getElementById('proxy').value;
      const collection = document.getElementById('collection').value;
      const name = document.getElementById('name').value;

      const res = await fetch(
        proxy + '/proxy/collections/' + collection + '/items',
        {
          method: 'POST',
          headers: getHeaders(),
          body: JSON.stringify({
            fieldData: {
              name: name,
              slug: name.toLowerCase().replace(/\s+/g, '-')
            }
          })
        }
      );

      const data = await res.json();

      document.getElementById('output').textContent =
        JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
