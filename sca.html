<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LBA Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--g:#00ffb3;--gd:rgba(0,255,179,0.15);--gold:#ffd166;--red:#ff4d6d;--blue:#48cae4;--bg:#050507;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:#fff;}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
#canvas{display:none;}
#oc{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;}

/* SETUP */
#setup{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:32px;z-index:100;}
.s-logo{font-family:'Orbitron',monospace;font-size:32px;font-weight:900;color:var(--g);letter-spacing:5px;text-shadow:0 0 30px var(--g);text-align:center;line-height:1.1;}
.s-sub{font-family:monospace;font-size:11px;color:rgba(255,255,255,.3);letter-spacing:3px;}
.s-inp{width:100%;max-width:340px;background:rgba(0,0,0,.5);border:1px solid rgba(0,255,179,.25);color:#fff;padding:12px 14px;font-family:monospace;font-size:13px;outline:none;}
.s-inp:focus{border-color:var(--g);}
.s-btn{width:100%;max-width:340px;background:var(--g);color:#000;border:none;padding:15px;font-family:'Orbitron',monospace;font-weight:700;font-size:13px;letter-spacing:2px;cursor:pointer;}
.s-note{font-size:10px;color:rgba(255,255,255,.2);text-align:center;max-width:280px;line-height:1.7;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:30;padding:12px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;align-items:center;}
.hl{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;color:var(--g);letter-spacing:3px;text-shadow:0 0 16px var(--g);}
.hbtns{display:flex;gap:6px;align-items:center;}
#hstatus{font-family:monospace;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:1px;margin-right:4px;}
.hbtn{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:6px 12px;font-family:monospace;font-size:10px;cursor:pointer;letter-spacing:1px;}
.hbtn.on{color:var(--red);border-color:var(--red);}

/* SCAN BAR */
#scanbar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:16px 16px 32px;background:linear-gradient(to top,rgba(0,0,0,.92) 60%,transparent);display:flex;flex-direction:column;align-items:center;gap:8px;}
#scanbtn{background:var(--g);color:#000;border:none;padding:18px 64px;font-family:'Orbitron',monospace;font-weight:900;font-size:16px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 32px rgba(0,255,179,.5);touch-action:manipulation;}
#scanbtn.reading{background:var(--gold);}
#scanbtn.autoon{background:var(--red);}
.shint{font-family:monospace;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1px;}

/* BRACKETS */
#brackets{position:fixed;inset:0;z-index:4;pointer-events:none;}
.br{position:absolute;width:44px;height:44px;border-color:var(--g);border-style:solid;opacity:.5;}
.tl{top:24%;left:5%;border-width:2px 0 0 2px;}.tr{top:24%;right:5%;border-width:2px 2px 0 0;}
.bl{bottom:24%;left:5%;border-width:0 0 2px 2px;}.brr{bottom:24%;right:5%;border-width:0 2px 2px 0;}
#scanline{position:absolute;left:5%;right:5%;height:1.5px;background:linear-gradient(90deg,transparent,var(--g),transparent);box-shadow:0 0 8px var(--g);animation:scan 2.5s ease-in-out infinite;}
@keyframes scan{0%{top:25%}48%{top:75%}52%{top:75%}100%{top:25%}}

/* BUBBLE */
.bub{position:fixed;background:rgba(5,5,7,.97);border:1.5px solid var(--g);padding:10px 12px;width:188px;z-index:20;box-shadow:0 0 20px rgba(0,255,179,.2);}
.bub::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--g),transparent);}
.bg{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:2px;color:var(--g);margin-bottom:2px;opacity:.7;}
.bn{font-size:13px;font-weight:600;color:#fff;margin-bottom:1px;padding-right:18px;line-height:1.2;}
.bteam{font-family:monospace;font-size:9px;color:rgba(255,255,255,.4);margin-bottom:4px;}

/* PRICE ROW */
.price-row{display:flex;align-items:baseline;gap:6px;margin-bottom:2px;}
.bp{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;color:var(--g);text-shadow:0 0 10px rgba(0,255,179,.4);line-height:1;}
.bsrc{font-family:monospace;font-size:8px;color:rgba(255,255,255,.3);letter-spacing:1px;}
.br2{font-family:monospace;font-size:9px;color:rgba(255,255,255,.3);margin-bottom:4px;}

/* DESIRABILITY */
.desir-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.desir-score{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;padding:2px 6px;border-radius:1px;}
.desir-high{color:#00ffb3;background:rgba(0,255,179,.12);border:1px solid rgba(0,255,179,.3);}
.desir-med{color:var(--gold);background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.3);}
.desir-low{color:var(--red);background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);}
.trend{font-family:monospace;font-size:10px;}
.trend-up{color:#00ffb3;}
.trend-dn{color:var(--red);}
.trend-fl{color:rgba(255,255,255,.4);}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px;}
.tag{font-family:monospace;font-size:8px;padding:2px 5px;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);}
.tag.hot{border-color:rgba(255,77,109,.4);color:var(--red);background:rgba(255,77,109,.08);}
.tag.rc{border-color:rgba(255,209,102,.4);color:var(--gold);background:rgba(255,209,102,.08);}
.tag.key{border-color:rgba(0,255,179,.4);color:var(--g);background:rgba(0,255,179,.08);}
.tag.pop{border-color:rgba(72,202,228,.4);color:var(--blue);background:rgba(72,202,228,.08);}

/* SELECTS */
.bsels{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
.bsel{width:100%;background:#0d0d0f;color:#fff;border:1px solid rgba(255,255,255,.12);padding:5px 7px;font-family:monospace;font-size:10px;outline:none;}
.bsel:focus{border-color:var(--g);}
.bconds{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px;}
.bcp{font-family:'Orbitron',monospace;font-size:7px;padding:2px 5px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4);cursor:pointer;}
.bcp.on{border-color:var(--g);color:var(--g);background:var(--gd);}

/* ACTION BUTTONS */
.bactions{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:0;}
.bact{border:none;padding:7px 4px;font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;cursor:pointer;text-align:center;text-decoration:none;display:block;}
.bact-tcg{background:rgba(0,255,179,.1);color:var(--g);border:1px solid rgba(0,255,179,.25);}
.bact-ebay{background:rgba(255,209,102,.1);color:var(--gold);border:1px solid rgba(255,209,102,.25);}
.bact-inv{background:rgba(72,202,228,.1);color:var(--blue);border:1px solid rgba(72,202,228,.25);grid-column:1/-1;}
.bact-inv.added{background:rgba(0,255,179,.2);color:var(--g);border-color:var(--g);}

.bx{position:absolute;top:4px;right:6px;background:none;border:none;color:rgba(255,255,255,.25);font-size:15px;cursor:pointer;padding:0;}

/* EBAY SALES */
.ebay-sales{margin-bottom:6px;}
.ebay-title{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.3);margin-bottom:4px;}
.ebay-item{display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.ebay-desc{font-family:monospace;font-size:9px;color:rgba(255,255,255,.5);flex:1;margin-right:4px;}
.ebay-price{font-family:'Orbitron',monospace;font-size:9px;color:var(--gold);}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.95);border:1px solid rgba(0,255,179,.4);padding:9px 20px;font-family:monospace;font-size:11px;color:var(--g);z-index:200;white-space:nowrap;max-width:90vw;text-align:center;}
</style>
</head>
<body>

<div id="setup">
  <div class="s-logo">LBA<br>SCANNER</div>
  <div class="s-sub">AR CARD PRICE SCANNER</div>
  <input class="s-inp" id="kinp" type="password" placeholder="Anthropic API key (sk-ant-...)">
  <button class="s-btn" onclick="launch()">&#9654; LAUNCH SCANNER</button>
  <div class="s-note">Visual AI card identification with live eBay pricing, desirability scores, and inventory sync</div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<canvas id="oc"></canvas>

<div id="brackets">
  <div class="br tl"></div><div class="br tr"></div>
  <div class="br bl"></div><div class="br brr"></div>
  <div id="scanline"></div>
</div>

<div id="hud" style="display:none">
  <span class="hl">LBA</span>
  <div class="hbtns">
    <span id="hstatus">LIVE</span>
    <button class="hbtn" id="autobitn" onclick="toggleAuto()">AUTO</button>
    <button class="hbtn" onclick="clearAll()">CLEAR</button>
  </div>
</div>

<div id="scanbar" style="display:none">
  <button id="scanbtn" onclick="doScan()">&#9654; SCAN CARDS</button>
  <div class="shint">Point camera at cards then tap scan</div>
</div>

<script>
const CM={NM:1,LP:.8,MP:.64,HP:.4,DMG:.25};
let bubs=[],auto=false,autoT=null,scanning=false,octx=null,wakeLock=null;
const video=document.getElementById('video'),canvas=document.getElementById('canvas'),oc=document.getElementById('oc');
const savedKey=localStorage.getItem('lba_k');
if(savedKey) document.getElementById('kinp').value=savedKey;

function launch(){
  const k=document.getElementById('kinp').value.trim();
  if(!k){toast('Enter your Anthropic API key');return;}
  if(!k.startsWith('sk-ant-')){toast('Key must start with sk-ant-');return;}
  localStorage.setItem('lba_k',k);
  startScanner();
}
if(savedKey) startScanner();

async function startScanner(){
  document.getElementById('setup').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('scanbar').style.display='flex';
  function resizeOC(){oc.width=window.innerWidth;oc.height=window.innerHeight;}
  window.addEventListener('resize',resizeOC);resizeOC();
  octx=oc.getContext('2d');
  try{
    if('wakeLock' in navigator){
      wakeLock=await navigator.wakeLock.request('screen');
      document.addEventListener('visibilitychange',async()=>{
        if(wakeLock!==null&&document.visibilityState==='visible')
          wakeLock=await navigator.wakeLock.request('screen');
      });
    }
  }catch(e){}
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=s;await video.play();
    document.getElementById('hstatus').textContent='LIVE';
  }catch(e){toast('Camera: '+e.message);}
}

function capture(){
  const vw=video.videoWidth||1280,vh=video.videoHeight||720;
  canvas.width=1024;canvas.height=Math.round(1024*vh/vw);
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',.88).split(',')[1];
}

async function callClaude(messages,maxTokens){
  const key=localStorage.getItem('lba_k');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTokens||2000,messages})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'HTTP '+res.status);}
  const d=await res.json();
  return d.content[0].text;
}

async function doScan(){
  if(scanning)return;
  scanning=true;
  const btn=document.getElementById('scanbtn'),hs=document.getElementById('hstatus');
  btn.textContent='READING...';btn.className='reading';hs.textContent='SCANNING...';
  try{
    const img=capture();
    const prompt=`You are an expert trading card identifier. Analyze this image VISUALLY — look at card layout, border colors, foil patterns, holo effects, player pose, jersey numbers, team colors, manufacturer logos, uniform styles.

Return ONLY a raw JSON array, no markdown:
[{
  "name": "exact card name",
  "game": "Pokemon TCG|Magic: The Gathering|Yu-Gi-Oh!|Sports Card|Other TCG",
  "sport": "Baseball|Basketball|Football|Hockey|Soccer|null",
  "player": "player full name if sports card, null otherwise",
  "team": "team name",
  "year": "card year",
  "manufacturer": "Topps|Panini|Upper Deck|Pokemon Company|Wizards of the Coast|Konami|Other",
  "is_rookie": true or false,
  "is_key_card": true or false,
  "key_notes": "why this card is notable e.g. 1st appearance, tournament staple, HOF player, rookie year",
  "confidence": "high|medium|low",
  "cx": 50, "cy": 50,
  "desirability": 7,
  "desirability_reason": "brief reason e.g. short print, star player, tournament staple",
  "trend": "up|down|flat",
  "trend_reason": "brief reason for price trend",
  "pop_estimate": "e.g. PSA 10: ~2400 copies, common print run",
  "printings": [{
    "set": "Full set name",
    "variant": "Base|Chrome|Prizm|Silver Prizm|Gold Refractor|Red Prizm|Blue Wave|Green|Orange|Pink|Purple|Holo|Reverse Holo|Full Art|Alt Art|Borderless|Showcase|Extended Art|Etched Foil|Galaxy Foil|Textured Foil|Retro Frame|Serialized|1st Edition|Unlimited|Promo|Rainbow Rare|Secret Rare|Special Illustration Rare|Collector Booster|Superfractor|Auto|Relic|Patch|Rookie",
    "year": "year",
    "numbered": "/25|/49|/99|/199|/299|null",
    "mid": 5.00, "low": 2.00, "high": 10.00,
    "price_source": "TCGPlayer|eBay|Estimate"
  }],
  "ebay_comps": [
    {"desc": "short sale description", "price": 12.50, "days_ago": 3},
    {"desc": "short sale description", "price": 11.00, "days_ago": 7},
    {"desc": "short sale description", "price": 13.50, "days_ago": 14}
  ]
}]

RULES:
- cx/cy = card center as % of image (0-100)
- desirability = 1-10 score based on player/card fame, rarity, demand
- For sports cards use ebay_comps for realistic recent sold prices
- Include ALL printings exhaustively
- For sports: base, chrome, prizm, all color parallels, autos, relics, numbered
- For Pokemon: every set, holo, reverse holo, full art, alt art, rainbow, special illustration
- For MTG: every set, borderless, showcase, extended art, retro frame, serialized, promos
- Max 5 cards, return [] if none visible`;

    const text=await callClaude([{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}},{type:'text',text:prompt}]}],3000);
    const cards=JSON.parse(text.replace(/```json|```/g,'').trim());
    if(Array.isArray(cards)&&cards.length){
      if(auto)clearAll();
      cards.forEach(c=>addBubble(c));
      hs.textContent=cards.length+' FOUND';
      drawLines();
    }else{hs.textContent='NONE';toast('No cards detected — try again');}
  }catch(e){document.getElementById('hstatus').textContent='ERROR';toast('Error: '+e.message);}
  scanning=false;btn.innerHTML='&#9654; SCAN CARDS';btn.className='';
}

function addBubble(card){
  const W=window.innerWidth,H=window.innerHeight;
  const cx=(card.cx/100)*W,cy=(card.cy/100)*H;
  const id='b'+Date.now()+Math.random().toString(36).slice(2,5);
  const prints=card.printings||[];
  const first=prints[0]||{mid:0,low:0,high:0,set:'Unknown',variant:'',price_source:'Estimate'};
  const isSports=card.game==='Sports Card';
  const el=document.createElement('div');
  el.className='bub';el.id=id;el._prints=prints;el._card=card;

  // Desirability
  const ds=Math.min(10,Math.max(1,card.desirability||5));
  const dc=ds>=7?'desir-high':ds>=4?'desir-med':'desir-low';
  const trendIcon=card.trend==='up'?'↑ '+card.trend_reason:card.trend==='down'?'↓ '+card.trend_reason:'→ stable';
  const trendClass=card.trend==='up'?'trend-up':card.trend==='down'?'trend-dn':'trend-fl';

  // Tags
  const tags=[];
  if(card.is_rookie)tags.push('<span class="tag rc">RC</span>');
  if(card.is_key_card)tags.push('<span class="tag key">KEY</span>');
  if(ds>=8)tags.push('<span class="tag hot">HOT</span>');
  if(card.pop_estimate)tags.push('<span class="tag pop">'+card.pop_estimate.substring(0,20)+'</span>');

  // eBay comps
  let ebayHtml='';
  if(isSports&&card.ebay_comps&&card.ebay_comps.length){
    ebayHtml=`<div class="ebay-sales"><div class="ebay-title">RECENT EBAY SOLD</div>${card.ebay_comps.slice(0,3).map(e=>`<div class="ebay-item"><span class="ebay-desc">${e.desc}</span><span class="ebay-price">$${e.price.toFixed(2)}</span></div>`).join('')}</div>`;
  }

  // Print options
  const printOpts=prints.map((p,i)=>`<option value="${i}">${p.set}${p.variant&&p.variant!=='Base'?' · '+p.variant:''}${p.numbered?' '+p.numbered:''}${p.year?' ('+p.year+')':''}</option>`).join('');

  const displayName=card.player||card.name;
  const displaySub=(card.team?card.team+' · ':'')+(card.year||'')+(card.manufacturer?' · '+card.manufacturer:'');
  const q=encodeURIComponent((card.player||card.name)+' '+(card.sport||'')+' '+(first.set||''));
  const ebayQ=encodeURIComponent((card.player||card.name)+' '+(card.year||'')+' '+(first.variant||'')+' card');

  el.innerHTML=`
    <button class="bx" onclick="rmBub('${id}')">×</button>
    <div class="bg">${card.game||'CARD'}${card.sport?' · '+card.sport:''}</div>
    <div class="bn">${displayName}</div>
    ${displaySub?`<div class="bteam">${displaySub}</div>`:''}
    <div class="desir-row">
      <span class="desir-score ${dc}">${ds}/10</span>
      <span class="trend ${trendClass}">${trendIcon}</span>
    </div>
    ${tags.length?`<div class="tags">${tags.join('')}</div>`:''}
    ${card.key_notes?`<div style="font-family:monospace;font-size:8px;color:rgba(255,209,102,.7);margin-bottom:4px;line-height:1.4;">${card.key_notes}</div>`:''}
    <div class="price-row">
      <div class="bp" id="bp${id}">$${first.mid.toFixed(2)}</div>
      <div class="bsrc" id="bsrc${id}">${first.price_source||'Est'}</div>
    </div>
    <div class="br2" id="br${id}">$${first.low.toFixed(2)} – $${first.high.toFixed(2)} NM</div>
    ${ebayHtml}
    <div class="bsels">
      <select class="bsel" id="ps${id}" onchange="chPrint('${id}')">
        ${printOpts}
      </select>
      <select class="bsel" id="cs${id}" onchange="chCond('${id}')">
        ${Object.keys(CM).map(c=>`<option>${c}</option>`).join('')}
      </select>
    </div>
    <div class="bconds">
      ${Object.keys(CM).map((c,i)=>`<span class="bcp${i===0?' on':''}" onclick="cpill('${id}',this,'${c}')">${c}</span>`).join('')}
    </div>
    <div class="bactions">
      ${isSports
        ?`<a class="bact bact-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${ebayQ}&LH_Sold=1&LH_Complete=1" target="_blank">eBay Sold ↗</a>`
        :`<a class="bact bact-tcg" id="bt${id}" href="https://www.tcgplayer.com/search/all/product?q=${q}" target="_blank">TCGPlayer ↗</a>`
      }
      <a class="bact ${isSports?'bact-tcg':'bact-ebay'}" href="https://www.ebay.com/sch/i.html?_nkw=${ebayQ}&LH_Sold=1" target="_blank">eBay ↗</a>
      <button class="bact bact-inv" id="inv${id}" onclick="addToInv('${id}')">+ Add to Inventory</button>
    </div>
  `;

  const bw=188,bh=420;
  let left=cx-bw/2,top=cy-bh-24;
  if(top<60)top=cy+20;
  left=Math.max(6,Math.min(left,W-bw-6));
  top=Math.max(60,Math.min(top,H-bh-90));
  el.style.left=left+'px';el.style.top=top+'px';
  document.body.appendChild(el);
  bubs.push({id,el,ax:cx,ay:cy});
}

window.chPrint=function(id){
  const el=document.getElementById(id);if(!el)return;
  const pi=parseInt(document.getElementById('ps'+id).value);
  const cond=document.getElementById('cs'+id)?.value||'NM';
  if(!isNaN(pi))updatePrice(id,el._prints[pi],cond);
};
window.chCond=function(id){
  const el=document.getElementById(id);if(!el)return;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const cond=document.getElementById('cs'+id).value;
  el.querySelectorAll('.bcp').forEach(p=>p.classList.toggle('on',p.textContent===cond));
  updatePrice(id,el._prints[pi]||el._prints[0],cond);
};
window.cpill=function(id,pill,cond){
  const el=document.getElementById(id);if(!el)return;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const cs=document.getElementById('cs'+id);if(cs)cs.value=cond;
  el.querySelectorAll('.bcp').forEach(p=>p.classList.remove('on'));
  pill.classList.add('on');
  updatePrice(id,el._prints[pi]||el._prints[0],cond);
};
function updatePrice(id,p,cond){
  if(!p)return;
  const m=CM[cond]||1;
  const name=document.getElementById(id)?.querySelector('.bn')?.textContent||'';
  document.getElementById('bp'+id).textContent='$'+(p.mid*m).toFixed(2);
  document.getElementById('br'+id).textContent='$'+(p.low*m).toFixed(2)+' – $'+(p.high*m).toFixed(2)+' '+cond;
  const src=document.getElementById('bsrc'+id);
  if(src)src.textContent=p.price_source||'Est';
  const bt=document.getElementById('bt'+id);
  if(bt)bt.href='https://www.tcgplayer.com/search/all/product?q='+encodeURIComponent(name+' '+p.set+' '+(p.variant||''));
}

window.addToInv=function(id){
  const el=document.getElementById(id);if(!el||!el._card)return;
  const card=el._card;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const cond=document.getElementById('cs'+id)?.value||'NM';
  const print=el._prints[pi]||el._prints[0]||{};
  const m=CM[cond]||1;

  const item={
    id:'scan_'+Date.now(),
    name:card.player||card.name,
    category:card.game==='Sports Card'?'Sports':
              card.game==='Pokemon TCG'||card.game==='Magic: The Gathering'||card.game==='Yu-Gi-Oh!'?'TCG':'TCG',
    set:print.set||'',
    variant:print.variant||'',
    condition:cond,
    year:card.year||'',
    team:card.team||'',
    player:card.player||'',
    manufacturer:card.manufacturer||'',
    is_rookie:card.is_rookie||false,
    key_notes:card.key_notes||'',
    market:print.mid||0,
    price:print.mid||0,
    cost:0,
    status:'in_stock',
    addedAt:new Date().toISOString(),
    scannedFrom:'AR Scanner'
  };

  // Save to localStorage bridge for POS system
  const pending=JSON.parse(localStorage.getItem('lba_pending')||'[]');
  pending.unshift(item);
  localStorage.setItem('lba_pending',JSON.stringify(pending));

  // Also save to main inventory
  const inventory=JSON.parse(localStorage.getItem('lba_inventory')||'[]');
  inventory.unshift(item);
  localStorage.setItem('lba_inventory',JSON.stringify(inventory));

  const btn=document.getElementById('inv'+id);
  if(btn){btn.textContent='✓ Added!';btn.classList.add('added');}
  toast('Added to inventory: '+item.name);
};

window.rmBub=function(id){
  document.getElementById(id)?.remove();
  bubs=bubs.filter(b=>b.id!==id);
  drawLines();
};
function clearAll(){bubs.forEach(b=>b.el?.remove());bubs=[];if(octx)octx.clearRect(0,0,oc.width,oc.height);}
function drawLines(){
  if(!octx)return;
  octx.clearRect(0,0,oc.width,oc.height);
  bubs.forEach(b=>{
    if(!b.el?.parentNode)return;
    const r=b.el.getBoundingClientRect();
    const bx=r.left+r.width/2,by=r.bottom;
    octx.beginPath();octx.moveTo(bx,by);octx.lineTo(b.ax,b.ay);
    octx.strokeStyle='rgba(0,255,179,.35)';octx.lineWidth=1.5;octx.setLineDash([4,4]);octx.stroke();
    octx.beginPath();octx.arc(b.ax,b.ay,5,0,Math.PI*2);
    octx.fillStyle='rgba(0,255,179,.7)';octx.fill();octx.setLineDash([]);
  });
}
function toggleAuto(){
  auto=!auto;
  const ab=document.getElementById('autobitn'),sb=document.getElementById('scanbtn');
  if(auto){ab.classList.add('on');ab.textContent='STOP';sb.innerHTML='AUTO ON';sb.className='autoon';autoT=setInterval(()=>{if(!scanning)doScan();},5000);doScan();}
  else{clearInterval(autoT);ab.classList.remove('on');ab.textContent='AUTO';sb.innerHTML='&#9654; SCAN CARDS';sb.className='';}
}
function toast(msg){
  const old=document.querySelector('.toast');if(old)old.remove();
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),4000);
}
</script>
