<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LBA Scanner</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
#cam{width:100%;height:auto}
#hud{
  position:fixed;top:0;left:0;width:100%;height:100%;
  pointer-events:none;border:3px solid rgba(0,255,255,0.2)
}
#controls{
  position:fixed;bottom:0;width:100%;
  background:#111;padding:10px;text-align:center
}
button{
  padding:12px 20px;margin:5px;
  background:#0ff;border:none;color:#000;font-weight:bold
}
.card{
  background:#111;margin:10px;padding:10px;border-radius:10px
}
</style>
</head>

<body>

<video id="cam" autoplay playsinline></video>
<div id="hud"></div>

<div id="results"></div>

<div id="controls">
<button onclick="scan()">SCAN</button>
</div>

<script>

const WORKER = "https://still-resonance-4f87.swarnerauto.workers.dev";

let stream;

async function start(){
  stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
  document.getElementById("cam").srcObject = stream;
}
start();

function capture(){
  const v = document.getElementById("cam");
  const c = document.createElement("canvas");
  c.width = v.videoWidth;
  c.height = v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  return c.toDataURL("image/jpeg").split(",")[1];
}

async function scan(){

  const img = capture();

  const res = await fetch(WORKER + "/api/scan",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      imageBase64:img,
      mode:"front"
    })
  });

  const data = await res.json();

  const out = document.getElementById("results");
  out.innerHTML = "";

  if(!data.ok){
    out.innerHTML = "Scan failed";
    return;
  }

  data.data.forEach(card=>{
    const div = document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <b>${card.name}</b><br>
      ${card.year} ${card.set_name || ''}<br>
      $${card.printings?.[0]?.mid || 0}
      <br><br>
      <button onclick='add("${card.name}")'>Add to Webflow</button>
    `;

    out.appendChild(div);
  });
}

async function add(name){

  await fetch(WORKER + "/proxy/collections/YOUR_COLLECTION/items",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      fields:{ name:name }
    })
  });

  alert("Added to Webflow");
}

</script>

</body>
</html>
