<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner</title>

<style>
body{margin:0;background:#000;color:#fff;font-family:sans-serif}
video{width:100%;height:auto}
button{padding:10px;margin:10px}
.card{background:#111;padding:10px;margin:10px}
</style>
</head>

<body>

<video id="cam" autoplay playsinline></video>

<br>

<button onclick="scan()">Scan</button>

<div id="results"></div>

<script>

const DEFAULT_PROXY = "https://still-resonance-4f87.swarnerauto.workers.dev";

let stream;

async function start(){
  stream = await navigator.mediaDevices.getUserMedia({video:true});
  document.getElementById("cam").srcObject = stream;
}

start();

function capture(){
  const video = document.getElementById("cam");
  const canvas = document.createElement("canvas");
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const ctx = canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  return canvas.toDataURL("image/jpeg").split(",")[1];
}

async function scan(){

  const proxy = localStorage.getItem("proxy") || DEFAULT_PROXY;

  const img = capture();

  const res = await fetch(proxy + "/api/scan",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      imageBase64:img,
      mode:"front"
    })
  });

  const data = await res.json();

  const out = document.getElementById("results");

  if(!data.ok){
    out.innerHTML = "Error";
    return;
  }

  out.innerHTML = "";

  data.data.forEach(card=>{
    const div = document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <b>${card.name}</b><br>
      ${card.year} - ${card.set}<br>
      $${card.market_nm}
      <br><br>
      <button onclick="addToWebflow('${card.name}')">
        Add to Webflow
      </button>
    `;

    out.appendChild(div);
  });
}

async function addToWebflow(name){

  const proxy = localStorage.getItem("proxy") || DEFAULT_PROXY;

  const res = await fetch(proxy + "/proxy/collections/YOUR_COLLECTION/items",{
    method:"POST",
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      fields:{
        name:name
      }
    })
  });

  alert("Sent to Webflow");
}

</script>

</body>
</html>
