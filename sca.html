<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LBA Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--g:#00ffb3;--gd:rgba(0,255,179,0.15);--gold:#ffd166;--red:#ff4d6d;--blue:#48cae4;--purple:#c77dff;--bg:#050507;--surface:rgba(5,5,7,0.97);}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;color:#fff;}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;}
#canvas,#backcanvas{display:none;}
#oc{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none;}

/* SETUP */
#setup{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;z-index:100;}
.s-logo{font-family:'Orbitron',monospace;font-size:28px;font-weight:900;color:var(--g);letter-spacing:5px;text-shadow:0 0 30px var(--g);text-align:center;line-height:1.1;}
.s-sub{font-family:monospace;font-size:10px;color:rgba(255,255,255,.3);letter-spacing:3px;}
.s-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.s-badge{font-family:monospace;font-size:9px;padding:3px 8px;border:1px solid rgba(0,255,179,.2);color:rgba(0,255,179,.5);}
.s-inp{width:100%;max-width:340px;background:rgba(0,0,0,.5);border:1px solid rgba(0,255,179,.25);color:#fff;padding:12px 14px;font-family:monospace;font-size:13px;outline:none;}
.s-inp:focus{border-color:var(--g);}
.s-btn{width:100%;max-width:340px;background:var(--g);color:#000;border:none;padding:15px;font-family:'Orbitron',monospace;font-weight:700;font-size:13px;letter-spacing:2px;cursor:pointer;}

/* HUD */
#hud{position:fixed;top:0;left:0;right:0;z-index:30;padding:12px 14px;background:linear-gradient(to bottom,rgba(0,0,0,.9),transparent);display:flex;justify-content:space-between;align-items:center;}
.hl{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;color:var(--g);letter-spacing:3px;text-shadow:0 0 16px var(--g);}
.hbtns{display:flex;gap:6px;align-items:center;}
#hstatus{font-family:monospace;font-size:10px;color:rgba(255,255,255,.35);letter-spacing:1px;margin-right:2px;}
.hbtn{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.15);padding:5px 10px;font-family:monospace;font-size:10px;cursor:pointer;}
.hbtn.on{color:var(--red);border-color:var(--red);}
.hbtn.flip-on{color:var(--gold);border-color:var(--gold);background:rgba(255,209,102,.1);}

/* SCAN BAR */
#scanbar{position:fixed;bottom:0;left:0;right:0;z-index:30;padding:14px 14px 28px;background:linear-gradient(to top,rgba(0,0,0,.92) 60%,transparent);display:flex;flex-direction:column;align-items:center;gap:8px;}
#scanbtn{background:var(--g);color:#000;border:none;padding:16px 56px;font-family:'Orbitron',monospace;font-weight:900;font-size:15px;letter-spacing:2px;cursor:pointer;box-shadow:0 0 32px rgba(0,255,179,.5);touch-action:manipulation;}
#scanbtn.reading{background:var(--gold);}
#scanbtn.autoon{background:var(--red);}
#scanbtn.backmode{background:var(--gold);box-shadow:0 0 32px rgba(255,209,102,.5);}
.shint{font-family:monospace;font-size:10px;color:rgba(255,255,255,.25);letter-spacing:1px;text-align:center;}
.shint.back{color:var(--gold);}

/* BRACKETS */
#brackets{position:fixed;inset:0;z-index:4;pointer-events:none;}
.br{position:absolute;width:44px;height:44px;border-color:var(--g);border-style:solid;opacity:.5;}
.br.gold{border-color:var(--gold);}
.tl{top:22%;left:4%;border-width:2px 0 0 2px;}.tr{top:22%;right:4%;border-width:2px 2px 0 0;}
.bl{bottom:22%;left:4%;border-width:0 0 2px 2px;}.brr{bottom:22%;right:4%;border-width:0 2px 2px 0;}
#scanline{position:absolute;left:4%;right:4%;height:1.5px;background:linear-gradient(90deg,transparent,var(--g),transparent);box-shadow:0 0 8px var(--g);animation:scan 2.5s ease-in-out infinite;}
#scanline.gold{background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 8px var(--gold);}
@keyframes scan{0%{top:23%}48%{top:77%}52%{top:77%}100%{top:23%}}

/* BACK MODE INDICATOR */
#backbadge{position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:30;background:rgba(255,209,102,.15);border:1px solid var(--gold);padding:6px 16px;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;color:var(--gold);display:none;}

/* BUBBLE */
.bub{position:fixed;background:var(--surface);border:1.5px solid var(--g);padding:10px 12px;width:192px;z-index:20;box-shadow:0 0 20px rgba(0,255,179,.15);max-height:80vh;overflow-y:auto;}
.bub::before{content:'';position:absolute;top:-1px;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--g),transparent);}
.bub.sports{border-color:var(--gold);}.bub.sports::before{background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.bub.comic{border-color:var(--purple);}.bub.comic::before{background:linear-gradient(90deg,transparent,var(--purple),transparent);}
.btype{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:2px;margin-bottom:2px;opacity:.8;}
.btype.tcg{color:var(--g)}.btype.sports{color:var(--gold)}.btype.comic{color:var(--purple)}
.bname{font-size:13px;font-weight:600;color:#fff;margin-bottom:1px;padding-right:18px;line-height:1.2;}
.bsub{font-family:monospace;font-size:9px;color:rgba(255,255,255,.4);margin-bottom:4px;line-height:1.5;}

/* STOCK INDICATOR */
.stock-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:5px 8px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);}
.stock-num{font-family:'Orbitron',monospace;font-size:14px;font-weight:900;}
.stock-num.instock{color:var(--g);}
.stock-num.lowstock{color:var(--gold);}
.stock-num.nostock{color:var(--red);}
.stock-label{font-family:monospace;font-size:9px;color:rgba(255,255,255,.4);letter-spacing:1px;}

/* DESIRABILITY */
.drow{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.dscore{font-family:'Orbitron',monospace;font-size:11px;font-weight:700;padding:2px 7px;}
.dhi{color:#00ffb3;background:rgba(0,255,179,.12);border:1px solid rgba(0,255,179,.3);}
.dmd{color:var(--gold);background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.3);}
.dlo{color:var(--red);background:rgba(255,77,109,.1);border:1px solid rgba(255,77,109,.3);}
.trend{font-family:monospace;font-size:10px;flex:1;}
.tup{color:#00ffb3}.tdn{color:var(--red)}.tfl{color:rgba(255,255,255,.4)}

/* TAGS */
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px;}
.tag{font-family:monospace;font-size:8px;padding:2px 5px;border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.4);}
.tag.hot{border-color:rgba(255,77,109,.4);color:var(--red);background:rgba(255,77,109,.08);}
.tag.rc{border-color:rgba(255,209,102,.4);color:var(--gold);background:rgba(255,209,102,.08);}
.tag.key{border-color:rgba(0,255,179,.4);color:var(--g);background:rgba(0,255,179,.08);}
.keynotes{font-family:monospace;font-size:8px;color:rgba(255,209,102,.7);margin-bottom:4px;line-height:1.4;}

/* PRICE */
.prow{display:flex;align-items:baseline;gap:5px;margin-bottom:2px;}
.bprice{font-family:'Orbitron',monospace;font-size:20px;font-weight:900;line-height:1;}
.bprice.tcg{color:var(--g);}.bprice.sports{color:var(--gold);}.bprice.comic{color:var(--purple);}
.brange{font-family:monospace;font-size:9px;color:rgba(255,255,255,.3);margin-bottom:5px;}

/* COMPS */
.comps{margin-bottom:5px;}
.comps-hdr{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;color:rgba(255,255,255,.3);margin-bottom:3px;}
.comp-row{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid rgba(255,255,255,.05);}
.comp-d{font-family:monospace;font-size:8px;color:rgba(255,255,255,.45);flex:1;margin-right:4px;line-height:1.3;}
.comp-p{font-family:'Orbitron',monospace;font-size:9px;}
.comp-p.tcg{color:var(--g)}.comp-p.sports{color:var(--gold)}.comp-p.comic{color:var(--purple)}

/* BACK INFO */
.backinfo{background:rgba(255,209,102,.05);border:1px solid rgba(255,209,102,.2);padding:6px 8px;margin-bottom:6px;}
.backinfo-hdr{font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;color:var(--gold);margin-bottom:4px;}
.backinfo-row{display:flex;justify-content:space-between;font-family:monospace;font-size:8px;color:rgba(255,255,255,.5);padding:1px 0;}
.backinfo-val{color:rgba(255,255,255,.8);}

/* SELECTS */
.bsels{display:flex;flex-direction:column;gap:4px;margin-bottom:5px;}
.bsel{width:100%;background:#0d0d0f;color:#fff;border:1px solid rgba(255,255,255,.12);padding:5px 7px;font-family:monospace;font-size:10px;outline:none;}
.bsel:focus{border-color:var(--g);}
.bconds{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px;}
.bcp{font-family:'Orbitron',monospace;font-size:7px;padding:2px 5px;border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.4);cursor:pointer;}
.bcp.on{border-color:var(--g);color:var(--g);background:var(--gd);}

/* ADD TO INV MODAL */
.inv-form{background:rgba(0,0,0,.4);border:1px solid rgba(0,255,179,.2);padding:8px;margin-bottom:5px;}
.inv-form-title{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;color:var(--g);margin-bottom:6px;}
.inv-inp{width:100%;background:#0d0d0f;color:#fff;border:1px solid rgba(255,255,255,.12);padding:5px 7px;font-family:monospace;font-size:11px;outline:none;margin-bottom:4px;}
.inv-inp:focus{border-color:var(--g);}
.inv-inp::placeholder{color:rgba(255,255,255,.2);}
.inv-row{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px;}
.inv-label{font-family:monospace;font-size:8px;color:rgba(255,255,255,.3);margin-bottom:2px;}

/* SOLD MODAL */
.sold-form{background:rgba(255,77,109,.05);border:1px solid rgba(255,77,109,.2);padding:8px;margin-bottom:5px;}
.sold-form-title{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:1px;color:var(--red);margin-bottom:6px;}

/* ACTIONS */
.bacts{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:4px;}
.bact{border:none;padding:7px 4px;font-family:'Orbitron',monospace;font-size:7px;letter-spacing:1px;cursor:pointer;text-align:center;text-decoration:none;display:block;line-height:1.3;}
.a-tcg{background:rgba(0,255,179,.08);color:var(--g);border:1px solid rgba(0,255,179,.2);}
.a-ebay{background:rgba(255,209,102,.08);color:var(--gold);border:1px solid rgba(255,209,102,.2);}
.a-130{background:rgba(72,202,228,.08);color:var(--blue);border:1px solid rgba(72,202,228,.2);}
.a-gcol{background:rgba(199,125,255,.08);color:var(--purple);border:1px solid rgba(199,125,255,.2);}
.a-add{background:rgba(0,255,179,.1);color:var(--g);border:1px solid rgba(0,255,179,.25);grid-column:1/-1;}
.a-sell{background:rgba(255,77,109,.1);color:var(--red);border:1px solid rgba(255,77,109,.25);grid-column:1/-1;}
.a-confirm{background:var(--g);color:#000;border:none;grid-column:1/-1;font-weight:700;}
.a-confirm.sell{background:var(--red;}
.a-cancel{background:rgba(255,255,255,.06);color:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.1);}
.a-added{background:rgba(0,255,179,.2);color:var(--g);border:1px solid var(--g);grid-column:1/-1;}

.bx{position:absolute;top:4px;right:6px;background:none;border:none;color:rgba(255,255,255,.25);font-size:15px;cursor:pointer;padding:0;}
.conf{font-family:monospace;font-size:8px;padding:1px 5px;display:inline-block;margin-bottom:4px;}
.c-hi{color:var(--g);border:1px solid rgba(0,255,179,.25);background:rgba(0,255,179,.06);}
.c-md{color:var(--gold);border:1px solid rgba(255,209,102,.25);background:rgba(255,209,102,.06);}
.c-lo{color:var(--red);border:1px solid rgba(255,77,109,.25);background:rgba(255,77,109,.06);}
.profit-preview{font-family:'Orbitron',monospace;font-size:10px;padding:4px 6px;text-align:center;margin-bottom:4px;}
.profit-pos{color:var(--g);background:rgba(0,255,179,.08);border:1px solid rgba(0,255,179,.2);}
.profit-neg{color:var(--red);background:rgba(255,77,109,.08);border:1px solid rgba(255,77,109,.2);}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.95);border:1px solid rgba(0,255,179,.4);padding:9px 20px;font-family:monospace;font-size:11px;color:var(--g);z-index:200;max-width:90vw;text-align:center;}
</style>
</head>
<body>

<div id="setup">
  <div class="s-logo">LBA<br>SCANNER</div>
  <div class="s-sub">AI CARD + COMIC IDENTIFIER</div>
  <div class="s-badges">
    <span class="s-badge">TCG</span><span class="s-badge">SPORTS</span>
    <span class="s-badge">COMICS</span><span class="s-badge">GRADED</span>
  </div>
  <input class="s-inp" id="kinp" type="password" placeholder="Anthropic API key (sk-ant-...)">
  <button class="s-btn" onclick="launch()">&#9654; LAUNCH SCANNER</button>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<canvas id="backcanvas"></canvas>
<canvas id="oc"></canvas>

<div id="brackets">
  <div class="br tl" id="br-tl"></div><div class="br tr" id="br-tr"></div>
  <div class="br bl" id="br-bl"></div><div class="br brr" id="br-br"></div>
  <div id="scanline"></div>
</div>

<div id="backbadge">⟳ BACK OF CARD MODE</div>

<div id="hud" style="display:none">
  <span class="hl">LBA</span>
  <div class="hbtns">
    <span id="hstatus">LIVE</span>
    <button class="hbtn" id="flipbtn" onclick="toggleFlip()">FLIP</button>
    <button class="hbtn" id="autobitn" onclick="toggleAuto()">AUTO</button>
    <button class="hbtn" onclick="clearAll()">CLEAR</button>
  </div>
</div>

<div id="scanbar" style="display:none">
  <button id="scanbtn" onclick="doScan()">&#9654; SCAN CARDS</button>
  <div class="shint" id="scanhint">TCG · Sports · Comics · Graded slabs</div>
</div>

<script>
const CM={NM:1,LP:.8,MP:.64,HP:.4,DMG:.25};
const WF_COLLECTION='69cb5611c6522a8591b552c4';
let bubs=[],auto=false,autoT=null,scanning=false,octx=null,wakeLock=null,flipMode=false;
const video=document.getElementById('video'),canvas=document.getElementById('canvas');
const backcanvas=document.getElementById('backcanvas'),oc=document.getElementById('oc');

const savedKey=localStorage.getItem('lba_k');
if(savedKey)document.getElementById('kinp').value=savedKey;

function launch(){
  const k=document.getElementById('kinp').value.trim();
  if(!k){toast('Enter your Anthropic API key');return;}
  if(!k.startsWith('sk-ant-')){toast('Key must start with sk-ant-');return;}
  localStorage.setItem('lba_k',k);startScanner();
}
if(savedKey)startScanner();

async function startScanner(){
  document.getElementById('setup').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('scanbar').style.display='flex';
  function resizeOC(){oc.width=window.innerWidth;oc.height=window.innerHeight;}
  window.addEventListener('resize',resizeOC);resizeOC();octx=oc.getContext('2d');
  try{if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');document.addEventListener('visibilitychange',async()=>{if(wakeLock!==null&&document.visibilityState==='visible')wakeLock=await navigator.wakeLock.request('screen');});}}catch(e){}
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
    video.srcObject=s;await video.play();document.getElementById('hstatus').textContent='LIVE';
  }catch(e){toast('Camera: '+e.message);}
}

function toggleFlip(){
  flipMode=!flipMode;
  const fb=document.getElementById('flipbtn');
  const sl=document.getElementById('scanline');
  const sb=document.getElementById('scanbtn');
  const hint=document.getElementById('scanhint');
  const badge=document.getElementById('backbadge');
  ['br-tl','br-tr','br-bl','br-br'].forEach(id=>{
    document.getElementById(id).classList.toggle('gold',flipMode);
  });
  if(flipMode){
    fb.classList.add('flip-on');fb.textContent='FRONT';
    sl.classList.add('gold');
    sb.classList.add('backmode');sb.innerHTML='&#9654; SCAN BACK';
    hint.textContent='Flip card over — back gives serial # and stats';
    hint.classList.add('back');
    badge.style.display='block';
  }else{
    fb.classList.remove('flip-on');fb.textContent='FLIP';
    sl.classList.remove('gold');
    sb.classList.remove('backmode');sb.innerHTML='&#9654; SCAN CARDS';
    hint.textContent='TCG · Sports · Comics · Graded slabs';
    hint.classList.remove('back');
    badge.style.display='none';
  }
}

function capture(){
  const vw=video.videoWidth||1280,vh=video.videoHeight||720;
  canvas.width=1024;canvas.height=Math.round(1024*vh/vw);
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',.9).split(',')[1];
}

async function callClaude(msgs,maxTok){
  const key=localStorage.getItem('lba_k');
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:maxTok||3000,messages:msgs})
  });
  if(!res.ok){const e=await res.json();throw new Error(e.error?.message||'HTTP '+res.status);}
  return(await res.json()).content[0].text;
}

async function doScan(){
  if(scanning)return;scanning=true;
  const btn=document.getElementById('scanbtn'),hs=document.getElementById('hstatus');
  btn.textContent='READING...';btn.className=flipMode?'backmode reading':'reading';hs.textContent='SCANNING...';
  try{
    const img=capture();
    if(flipMode){
      await scanBack(img);
    }else{
      await scanFront(img);
    }
  }catch(e){document.getElementById('hstatus').textContent='ERROR';toast('Error: '+e.message);}
  scanning=false;
  btn.innerHTML=flipMode?'&#9654; SCAN BACK':'&#9654; SCAN CARDS';
  btn.className=flipMode?'backmode':'';
}

async function scanFront(img){
  const hs=document.getElementById('hstatus');
  const prompt=`You are an expert collectibles identifier. Carefully examine this image.

STEP 1 — READ ALL TEXT FIRST:
Read every word visible: player/card name, card number (e.g. 287/700), set name, year, manufacturer, serial number (/25, /49, /99, etc), rarity, publisher, issue number.

STEP 2 — VISUAL ANALYSIS:
Border color, foil/chrome/prizm shimmer, holo pattern, slab label, artwork style, character design, costume, artist style (for virgin/textless covers — identify purely from visual elements like character pose, art style, color palette, composition).

STEP 3 — COMBINE for best identification.

Return ONLY raw JSON array, no markdown:
[{
  "name":"exact name — player name for sports, card name for TCG, title+issue for comics",
  "game":"Pokemon TCG|Magic: The Gathering|Yu-Gi-Oh!|Sports Card|Comic|Graded Slab|Other TCG",
  "sport":"Baseball|Basketball|Football|Hockey|Soccer|null",
  "player":"player full name if sports",
  "team":"team name or null",
  "year":"year from card",
  "card_number":"card number e.g. 287/700 or null",
  "manufacturer":"Topps|Panini|Upper Deck|Bowman|Fleer|Donruss|Pokemon Company|Wizards|Konami|Marvel|DC|Image|Dark Horse|Other",
  "publisher":"publisher if comic or null",
  "issue":"issue number if comic or null",
  "set_name":"exact set name printed on card",
  "parallel":"Base|Chrome|Prizm|Silver Prizm|Gold Refractor|Red Prizm|Blue|Green|Orange|Pink|Purple|Holo|Reverse Holo|Full Art|Alt Art|Borderless|Showcase|Extended Art|Etched Foil|Galaxy Foil|Retro Frame|Serialized|1st Edition|Promo|Rainbow Rare|Secret Rare|Special Illustration Rare|Collector Booster|Auto|Relic|Patch|Standard|Variant|Virgin|Textless|Sketch|Foil|Newsstand",
  "serial_number":"/99 or null",
  "grading_company":"PSA|BGS|CGC|SGC|null",
  "grade":"10|9.5|9|null",
  "is_rookie":true,
  "is_key":false,
  "key_notes":"why notable or null",
  "confidence":"high|medium|low",
  "confidence_reason":"what helped or hurt identification",
  "desirability":7,
  "trend":"up|down|flat",
  "trend_reason":"brief market reason",
  "cx":50,"cy":50,
  "printings":[{"set":"full set name","variant":"Base|Chrome|Prizm|Silver Prizm|Gold Refractor|Red Prizm|Blue|Green|Orange|Holo|Reverse Holo|Full Art|Alt Art|Borderless|Showcase|Extended Art|Serialized|1st Edition|Promo|Rainbow Rare|Secret Rare|Special Illustration Rare|Auto|Relic|Standard|Variant|Virgin","year":"year","numbered":"/99 or null","mid":5.00,"low":2.00,"high":10.00}],

RULES:
- cx/cy=center as % of image 0-100
- For virgin/textless comics with no text: identify from artwork, character, art style, costume details
- Include ALL printings exhaustively
- Sports: all parallels, chrome, prizm colors, optic, select, mosaic, autos, relics
- Pokemon/MTG: every set, every variant, promos
- Comics: standard, newsstand, variants, virgin, sketch, CGC graded versions
- Comps=realistic current eBay sold prices
- Max 5 items, [] if nothing visible`;

  const text=await callClaude([{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}},{type:'text',text:prompt}]}],4000);
  const items=JSON.parse(text.replace(/```json|```/g,'').trim());

  if(Array.isArray(items)&&items.length){

}

function checkStock(item){
  const inv=JSON.parse(localStorage.getItem('lba_inventory')||'[]');
  const name=(item.player||item.name||'').toLowerCase();
  const set=(item.set_name||'').toLowerCase();
  const matches=inv.filter(i=>{
    const iname=(i.name||'').toLowerCase();
    const iset=(i.set||'').toLowerCase();
    return iname.includes(name.split(' ')[0])||name.includes(iname.split(' ')[0]);
  });
  const inStock=matches.filter(i=>i.status==='in_stock').length;
  const totalSold=matches.filter(i=>i.status==='sold').length;
  return{inStock,totalSold,matches};
}

function getType(item){
  if(item.game==='Sports Card')return 'sports';

window.confirmSell=function(id,avgCost){
  const el=document.getElementById(id);if(!el||!el._item)return;
  const salePrice=parseFloat(document.getElementById('sale'+id)?.value)||0;
  if(!salePrice){toast('Enter a sale price');return;}
  const channel=document.getElementById('chan'+id)?.value||'In-Store';
  const item=el._item;
  const name=(item.player||item.name||'').toLowerCase();

  const inv=JSON.parse(localStorage.getItem('lba_inventory')||'[]');
  let soldOne=false;
  for(let i=0;i<inv.length;i++){
    const iname=(inv[i].name||'').toLowerCase();
    if(inv[i].status==='in_stock'&&(iname.includes(name.split(' ')[0])||name.includes(iname.split(' ')[0]))){
      inv[i].status='sold';
      inv[i].soldAt=new Date().toISOString();
      inv[i].salePrice=salePrice;
      inv[i].saleChannel=channel;
      inv[i].profit=salePrice-(inv[i].cost||avgCost||0);
      soldOne=true;break;
    }
  }

  if(!soldOne){
    // Item not in inventory — add as sold
    inv.unshift({id:'scan_'+Date.now(),name:item.player||item.name,category:el._ct==='sports'?'Sports':el._ct==='comic'?'Comic':'TCG',cost:avgCost,salePrice,profit:salePrice-avgCost,saleChannel:channel,status:'sold',soldAt:new Date().toISOString(),addedAt:new Date().toISOString()});
  }

  // Save sale record
  const sales=JSON.parse(localStorage.getItem('lba_sales')||'[]');
  sales.unshift({id:'sale_'+Date.now(),name:item.player||item.name,category:el._ct==='sports'?'Sports':el._ct==='comic'?'Comic':'TCG',cost:avgCost,salePrice,profit:salePrice-avgCost,channel,date:new Date().toISOString()});
  localStorage.setItem('lba_sales',JSON.stringify(sales));
  localStorage.setItem('lba_inventory',JSON.stringify(inv));

  const profit=salePrice-avgCost;
  const acts=document.getElementById('acts'+id);
  const cls=profit>=0?'profit-pos':'profit-neg';
  if(acts)acts.innerHTML=`<div class="bact a-added">✓ SOLD $${salePrice.toFixed(2)} via ${channel}</div><div class="profit-preview ${cls}">Profit: $${profit.toFixed(2)}</div>`;
  toast('Sold! Profit: $'+profit.toFixed(2));
};

  const acts=document.getElementById('acts'+id);
  let links='';
  if(ct==='sports'){const q=encodeURIComponent((item.player||item.name)+' '+(item.year||'')+' '+(item.parallel||''));const q130=encodeURIComponent((item.player||item.name)+' '+(item.year||''));links=`<a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1" target="_blank">eBay Sold ↗</a><a class="bact a-130" href="https://130point.com/sales/?q=${q130}" target="_blank">130Point ↗</a>`;}
  else if(ct==='comic'){const qgc=encodeURIComponent((item.name||'')+' '+(item.issue||''));const qe=encodeURIComponent((item.name||'')+' comic');links=`<a class="bact a-gcol" href="https://www.gocollect.com/search/?q=${qgc}" target="_blank">GoCollect ↗</a><a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${qe}&LH_Sold=1" target="_blank">eBay Sold ↗</a>`;}
  else{const qt=encodeURIComponent((item.name||'')+' '+(item.set_name||''));const qe=encodeURIComponent((item.name||'')+' '+(item.game||''));links=`<a class="bact a-tcg" href="https://www.tcgplayer.com/search/all/product?q=${qt}" target="_blank">TCGPlayer ↗</a><a class="bact a-ebay" href="https://www.ebay.com/sch/i.html?_nkw=${qe}&LH_Sold=1" target="_blank">eBay Sold ↗</a>`;}
  acts.innerHTML=links+`<button class="bact a-add" onclick="showAddForm('${id}')">+ Add to Inventory</button>${si>0?`<button class="bact a-sell" onclick="showSellForm('${id}')">✓ Mark as Sold</button>`:''}`;
};

window.chPrint=function(id){
  const el=document.getElementById(id);if(!el)return;
  const pi=parseInt(document.getElementById('ps'+id).value);
  const cond=document.getElementById('cs'+id)?.value||'NM';
  if(!isNaN(pi))updatePrice(id,el._prints[pi],cond);
};
window.chCond=function(id){
  const el=document.getElementById(id);if(!el)return;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const cond=document.getElementById('cs'+id).value;
  el.querySelectorAll('.bcp').forEach(p=>p.classList.toggle('on',p.textContent===cond));
  updatePrice(id,el._prints[pi]||el._prints[0],cond);
};
window.cpill=function(id,pill,cond){
  const el=document.getElementById(id);if(!el)return;
  const pi=parseInt(document.getElementById('ps'+id)?.value)||0;
  const cs=document.getElementById('cs'+id);if(cs)cs.value=cond;
  el.querySelectorAll('.bcp').forEach(p=>p.classList.remove('on'));
  pill.classList.add('on');
  updatePrice(id,el._prints[pi]||el._prints[0],cond);
};
function updatePrice(id,p,cond){
  if(!p)return;
  const m=CM[cond]||1;
  document.getElementById('bp'+id).textContent='$'+(p.mid*m).toFixed(2);
  document.getElementById('br'+id).textContent='$'+(p.low*m).toFixed(2)+' – $'+(p.high*m).toFixed(2)+' '+cond;
  const bt=document.getElementById('bt'+id);
  if(bt){const n=document.getElementById(id)?.querySelector('.bname')?.textContent||'';bt.href='https://www.tcgplayer.com/search/all/product?q='+encodeURIComponent(n+' '+(p.set||'')+' '+(p.variant||''));}
}
window.rmBub=function(id){document.getElementById(id)?.remove();bubs=bubs.filter(b=>b.id!==id);drawLines();};
function clearAll(){bubs.forEach(b=>b.el?.remove());bubs=[];if(octx)octx.clearRect(0,0,oc.width,oc.height);}
function drawLines(){
  if(!octx)return;octx.clearRect(0,0,oc.width,oc.height);
  const lc={tcg:'rgba(0,255,179,.35)',sports:'rgba(255,209,102,.35)',comic:'rgba(199,125,255,.35)'};
  const dc={tcg:'rgba(0,255,179,.7)',sports:'rgba(255,209,102,.7)',comic:'rgba(199,125,255,.7)'};
  bubs.forEach(b=>{
    if(!b.el?.parentNode)return;
    const r=b.el.getBoundingClientRect();
    octx.beginPath();octx.moveTo(r.left+r.width/2,r.bottom);octx.lineTo(b.ax,b.ay);
    octx.strokeStyle=lc[b.ct]||lc.tcg;octx.lineWidth=1.5;octx.setLineDash([4,4]);octx.stroke();
    octx.beginPath();octx.arc(b.ax,b.ay,5,0,Math.PI*2);
    octx.fillStyle=dc[b.ct]||dc.tcg;octx.fill();octx.setLineDash([]);
  });
}
function toggleAuto(){
  auto=!auto;const ab=document.getElementById('autobitn'),sb=document.getElementById('scanbtn');
  if(auto){ab.classList.add('on');ab.textContent='STOP';sb.innerHTML='AUTO ON';sb.className='autoon';autoT=setInterval(()=>{if(!scanning)doScan();},5500);doScan();}
  else{clearInterval(autoT);ab.classList.remove('on');ab.textContent='AUTO';sb.innerHTML='&#9654; SCAN CARDS';sb.className='';}
}
function toast(msg){
  const old=document.querySelector('.toast');if(old)old.remove();
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),4000);
}
</script>
